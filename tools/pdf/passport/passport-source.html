v>\n<\u002Fdiv>\n<div class=\"cols\">\n<div class=\"f\"><span class=\"lbl\">Дополнительная область (если нужна)<\u002Fspan><div class=\"ln\"><\u002Fdiv><div class=\"ln\"><\u002Fdiv><\u002Fdiv>\n<div class=\"f\"><span class=\"lbl\">Она нужна, потому что<\u002Fspan><div class=\"ln\"><\u002Fdiv><div class=\"ln\"><\u002Fdiv><\u002Fdiv>\n<\u002Fdiv>\n<div class=\"f\"><span class=\"lbl\">Что не входит в работу сервитора<\u002Fspan><div class=\"wr wr3\"><\u002Fdiv><\u002Fdiv>\n<div class=\"rulebox\">\n<span class=\"lbl\">Проверь<\u002Fspan>\n<div class=\"cols\" style=\"gap: 10px 24px;\">\n<label class=\"chk\"><i><\u002Fi><span>Функция отвечает на вопрос «что делает?».<\u002Fspan><\u002Flabel>\n<label class=\"chk\"><i><\u002Fi><span>Это один механизм, а не список обязанностей.<\u002Fspan><\u002Flabel>\n<label class=\"chk\"><i><\u002Fi><span>Область не расширяет полномочия.<\u002Fspan><\u002Flabel>\n<label class=\"chk\"><i><\u002Fi><span>Исключения записаны прямо.<\u002Fspan><\u002Flabel>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<div class=\"ft\"><span>Шаг 04 · Поля<\u002Fspan><span>@levorules<\u002Fspan><span class=\"pg\"><\u002Fspan><\u002Fdiv>\n<\u002Fsection>\n\n<section class=\"page\" data-screen-label=\"13 Шаг 05 теория\" style=\"--acc: oklch(0.47 0.1 150); --acc2: oklch(0.6 0.08 150);\">\n<div class=\"hd\"><span>Часть I · Черновик<\u002Fspan><span><b>Шаг 05<\u002Fb> · Имя<\u002Fspan><\u002Fdiv>\n<div class=\"stepline\"><div class=\"gly\"><span style=\"width:16px;height:16px;border:1.5px solid var(--acc);border-radius:50%;position:relative;display:block\"><span style=\"position:absolute;left:50%;top:-5px;bottom:-5px;width:1.5px;background:var(--acc);transform:translateX(-50%)\"><\u002Fspan><\u002Fspan><\u002Fdiv><div class=\"step\" style=\"margin: 0;\">Шаг 05 · Имя<\u002Fdiv><\u002Fdiv>\n<h1>Имя — это рабочий ключ<\u002Fh1>\n<p class=\"lede\">Имя помогает быстро обратиться именно к этой конструкции и не спутать её с другим образом, состоянием или случайной мыслью. Ты будешь произносить его во время активации и использовать в командах.<\u002Fp>\n<div class=\"stack\">\n<div class=\"cols\">\n<div>\n<h2>Пять свойств хорошего имени<\u002Fh2>\n<ul>\n<li>состоит из одного короткого слова;<\u002Fli>\n<li>не ломает язык при произнесении;<\u002Fli>\n<li>отличается от обычных команд и имён окружающих людей;<\u002Fli>\n<li>связано с функцией или характером работы;<\u002Fli>\n<li>не приносит с собой чужую готовую биографию.<\u002Fli>\n<\u002Ful>\n<p style=\"margin: 0;\"><span class=\"hl\">Имя должно нормально звучать вслух.<\u002Fspan>&nbsp;Просто красивое сочетание букв, которое ты каждый раз произносишь по-разному, быстро перестаёт быть ключом.<\u002Fp>\n<\u002Fdiv>\n<div>\n<h2>Придумай несколько вариантов<\u002Fh2>\n<p>Не пытайся сразу найти единственное идеальное имя. Запиши три коротких варианта и произнеси каждый несколько раз в обычной фразе:<\u002Fp>\n<div class=\"card\">\n<p style=\"color: var(--ink);\">«______________, начинай работу».<\u002Fp>\n<p style=\"margin: 0; color: var(--ink);\">«______________, работа завершена».<\u002Fp>\n<\u002Fdiv>\n<p style=\"margin: 9px 0 0;\">Обрати внимание, какое имя проще сказать, услышать и вспомнить. Если приходится объяснять ударение или каждый раз сверяться с записью — упрощай.<\u002Fp>\n<\u002Fdiv>\n<\u002Fdiv>\n<div class=\"warn\">\n<span class=\"lbl\">Очень частая ошибка<\u002Fspan>\n<p style=\"margin: 0;\">Назвать сервитора именем известного демона, божества, героя или знакомого человека, чтобы добавить ему веса. Вместе с таким именем ты получаешь готовый набор чужих ассоциаций, историй и ожиданий — и они начинают влиять на конструкцию сильнее, чем её собственная функция. Если имя сразу ассоциируется с конкретным персонажем, выбери другой вариант или измени его до неузнаваемости.<\u002Fp>\n<\u002Fdiv>\n<div class=\"ex\">\n<span class=\"lbl acc\">Пример · Тенет<\u002Fspan>\n<p>Для конструкции, которая помогает доводить отдельные фрагменты до законченной рабочей версии, я выбрал имя <strong>Тенет<\u002Fstrong> — от английского <em>tenet<\u002Fem>, «положение» или «принцип». Оно короткое, легко произносится и отличается от обычных слов, которые я использую во время работы.<\u002Fp>\n<p style=\"margin: 0;\">С этой страницы Тенет становится именованным примером. Это не готовое имя для твоего сервитора. Копировать его не нужно.<\u002Fp>\n<\u002Fdiv>\n<div class=\"note\" style=\"border-top: 1px solid var(--hair); padding-top: 11px;\">Проверь имя ещё раз через несколько часов. Если оно по-прежнему легко вспоминается и не требует расшифровки — двигайся дальше.<\u002Fdiv>\n<\u002Fdiv>\n<div class=\"ft\"><span>Шаг 05 · Имя<\u002Fspan><span>@levorules<\u002Fspan><span class=\"pg\"><\u002Fspan><\u002Fdiv>\n<\u002Fsection>\n\n<section class=\"page\" data-screen-label=\"14 Шаг 05 поля\" style=\"--acc: oklch(0.47 0.1 150); --acc2: oklch(0.6 0.08 150);\">\n<div class=\"hd\"><span>Часть I · Черновик<\u002Fspan><span><b>Шаг 05<\u002Fb> · Поля<\u002Fspan><\u002Fdiv>\n<div class=\"stepline\"><div class=\"gly\"><span style=\"width:16px;height:16px;border:1.5px solid var(--acc);border-radius:50%;position:relative;display:block\"><span style=\"position:absolute;left:50%;top:-5px;bottom:-5px;width:1.5px;background:var(--acc);transform:translateX(-50%)\"><\u002Fspan><\u002Fspan><\u002Fdiv><div class=\"step\" style=\"margin: 0;\">Заполни<\u002Fdiv><\u002Fdiv>\n<h1>Три варианта имени<\u002Fh1>\n<p class=\"lede\">Произнеси каждый вслух несколько раз, затем расставь от худшего к лучшему.<\u002Fp>\n<div class=\"stack\" style=\"gap: 18px;\">\n<div class=\"rulebox\">\n<div style=\"display: grid; grid-template-columns: 1fr 1fr 70px; gap: 14px; align-items: end;\">\n<div class=\"f\" style=\"margin: 0;\"><span class=\"lbl\">Вариант 1<\u002Fspan><div class=\"ln\"><\u002Fdiv><\u002Fdiv>\n<div class=\"f\" style=\"margin: 0;\"><span class=\"lbl\">С чем связан<\u002Fspan><div class=\"ln\"><\u002Fdiv><\u002Fdiv>\n<div class=\"f\" style=\"margin: 0;\"><span class=\"lbl\">Место<\u002Fspan><div class=\"ln\"><\u002Fdiv><\u002Fdiv>\n<div class=\"f\" style=\"margin: 0;\"><span class=\"lbl\">Вариант 2<\u002Fspan><div class=\"ln\"><\u002Fdiv><\u002Fdiv>\n<div class=\"f\" style=\"margin: 0;\"><span class=\"lbl\">С чем связан<\u002Fspan><div class=\"ln\"><\u002Fdiv><\u002Fdiv>\n<div class=\"f\" style=\"margin: 0;\"><span class=\"lbl\">Место<\u002Fspan><div class=\"ln\"><\u002Fdiv><\u002Fdiv>\n<div class=\"f\" style=\"margin: 0;\"><span class=\"lbl\">Вариант 3<\u002Fspan><div class=\"ln\"><\u002Fdiv><\u002Fdiv>\n<div class=\"f\" style=\"margin: 0;\"><span class=\"lbl\">С чем связан<\u002Fspan><div class=\"ln\"><\u002Fdiv><\u002Fdiv>\n<div class=\"f\" style=\"margin: 0;\"><span class=\"lbl\">Место<\u002Fspan><div class=\"ln\"><\u002Fdiv><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<div class=\"rulebox\">\n<span class=\"lbl\">Проверка вслух<\u002Fspan>\n<div class=\"cols\" style=\"gap: 10px 24px;\">\n<label class=\"chk\"><i><\u002Fi><span>Произносится одинаково каждый раз.<\u002Fspan><\u002Flabel>\n<label class=\"chk\"><i><\u002Fi><span>Не требует объяснения ударения.<\u002Fspan><\u002Flabel>\n<label class=\"chk\"><i><\u002Fi><span>Не совпадает с именами людей рядом.<\u002Fspan><\u002Flabel>\n<label class=\"chk\"><i><\u002Fi><span>Не тянет за собой чужую биографию.<\u002Fspan><\u002Flabel>\n<\u002Fdiv>\n<\u002Fdiv>\n<div class=\"f\"><span class=\"lbl acc\">Имя моего сервитора<\u002Fspan><div class=\"ln\" style=\"height: 40px;\"><\u002Fdiv><\u002Fdiv>\n<div class=\"f\"><span class=\"lbl\">Я выбрал его, потому что<\u002Fspan><div class=\"wr wr4\"><\u002Fdiv><\u002Fdiv>\n<div class=\"f\"><span class=\"lbl\">Проверка через несколько часов: имя вспомнилось само<\u002Fspan><div class=\"chkrow\" style=\"padding-top: 4px;\"><label class=\"chk\"><i><\u002Fi><span>Да, двигаюсь дальше<\u002Fspan><\u002Flabel><label class=\"chk\"><i><\u002Fi><span>Нет, упрощаю<\u002Fspan><\u002Flabel><\u002Fdiv><\u002Fdiv>\n<\u002Fdiv>\n<div class=\"ft\"><span>Шаг 05 · Поля<\u002Fspan><span>@levorules<\u002Fspan><span class=\"pg\"><\u002Fspan><\u002Fdiv>\n<\u002Fsection>\n\n<section class=\"page\" data-screen-label=\"15 Шаг 06 теория\" style=\"--acc: oklch(0.47 0.1 175); --acc2: oklch(0.6 0.08 175);\">\n<div class=\"hd\"><span>Часть I · Черновик<\u002Fspan><span><b>Шаг 06<\u002Fb> · Сигила<\u002Fspan><\u002Fdiv>\n<div class=\"stepline\"><div class=\"gly\"><span style=\"width:13px;height:13px;border:1.5px solid var(--acc);transform:rotate(45deg);display:block\"><\u002Fspan><\u002Fdiv><div class=\"step\" style=\"margin: 0;\">Шаг 06 · Сигила<\u002Fdiv><\u002Fdiv>\n<h1>Визуальный ключ<\u002Fh1>\n<p class=\"lede\">Имя позволяет обратиться к сервитору словами. Сигила делает то же самое через изображение: связывает имя, задачу и функцию в один знак, который можно быстро узнать, нарисовать и использовать во время активации.<\u002Fp>\n<div class=\"stack\">\n<div class=\"cols\">\n<div>\n<h2>Начни со смысла<\u002Fh2>\n<p>Выбери два или три элемента, напрямую связанных с работой сервитора:<\u002Fp>\n<ul>\n<li>действие, которое он выполняет;<\u002Fli>\n<li>направление или характер движения;<\u002Fli>\n<li>границу, точку завершения или нужный результат;<\u002Fli>\n<li>одну деталь, связанную с именем.<\u002Fli>\n<\u002Ful>\n<p style=\"margin: 0;\">Не пытайся зашифровать в знаке весь паспорт. Чем больше смыслов ты в него запихнёшь, тем труднее будет понять, что действительно важно. Сигила не обязана выглядеть древней или таинственной — её задача остаться отличимой и воспроизводимой.<\u002Fp>\n<\u002Fdiv>\n<div>\n<h2>Упрости и проверь<\u002Fh2>\n<p>Сделай первый набросок, а затем убери всё, без чего смысл сохраняется. Затем проверь:<\u002Fp>\n<ul>\n<li>узнаётся ли общий силуэт;<\u002Fli>\n<li>можно ли нарисовать его одним привычным движением;<\u002Fli>\n<li>не путается ли он с уже знакомым символом;<\u002Fli>\n<li>остаётся ли читаемым в маленьком размере;<\u002Fli>\n<li>можешь ли ты восстановить его без исходника.<\u002Fli>\n<\u002Ful>\n<p style=\"margin: 0;\">Хорошая сигила не требует художественного образования. <span class=\"hl\">Неровная линия, которую ты уверенно повторяешь, полезнее идеальной эмблемы.<\u002Fspan><\u002Fp>\n<\u002Fdiv>\n<\u002Fdiv>\n<div class=\"rulebox\">\n<span class=\"lbl\">Проверка через время · три шага<\u002Fspan>\n<div class=\"cols3\" style=\"gap: 16px;\">\n<div><div class=\"num\" style=\"margin-bottom: 5px;\">01<\u002Fdiv><p style=\"margin: 0;\">Отложи рисунок хотя бы на час.<\u002Fp><\u002Fdiv>\n<div><div class=\"num\" style=\"margin-bottom: 5px;\">02<\u002Fdiv><p style=\"margin: 0;\">Возьми чистый лист и нарисуй сигилу по памяти.<\u002Fp><\u002Fdiv>\n<div><div class=\"num\" style=\"margin-bottom: 5px;\">03<\u002Fdiv><p style=\"margin: 0;\">Сравни. Исчезла деталь — она не была нужна. Изменился силуэт — знак пока не ясен.<\u002Fp><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<div class=\"cols\">\n<div class=\"warn\">\n<span class=\"lbl\">Ошибка<\u002Fspan>\n<p style=\"margin: 0;\">Превратить сигилу в подробный герб с десятками линий, кругов, букв и декоративных деталей. Такой знак может эффектно выглядеть, но без исходника быстро превращается в приблизительное воспоминание.<br><br>Либо у тебя ну просто шикарная память.<\u002Fp>\n<\u002Fdiv>\n\n<\u002Fdiv>\n<\u002Fdiv>\n<div class=\"ft\"><span>Шаг 06 · Сигила<\u002Fspan><span>@levorules<\u002Fspan><span class=\"pg\"><\u002Fspan><\u002Fdiv>\n<\u002Fsection>\n\n<section class=\"page\" data-screen-label=\"16 Шаг 06 поля\" style=\"--acc: oklch(0.47 0.1 175); --acc2: oklch(0.6 0.08 175);\">\n<div class=\"hd\"><span>Часть I · Черновик<\u002Fspan><span><b>Шаг 06<\u002Fb> · Поля<\u002Fspan><\u002Fdiv>\n<div class=\"stepline\"><div class=\"gly\"><span style=\"width:13px;height:13px;border:1.5px solid var(--acc);transform:rotate(45deg);display:block\"><\u002Fspan><\u002Fdiv><div class=\"step\" style=\"margin: 0;\">Заполни и нарисуй<\u002Fdiv><\u002Fdiv>\n<h1>От первого наброска к знаку<\u002Fh1>\n<p class=\"lede\">Три поля — три степени упрощения. Внутри областей нет направляющих: знак нужно именно воспроизвести.<\u002Fp>\n<div class=\"stack\" style=\"gap: 18px;\">\n<div class=\"cols3\">\n<div><span class=\"lbl\">01 · Первый вариант<\u002Fspan><div class=\"draw\" style=\"height: 300px;\"><\u002Fdiv><\u002Fdiv>\n<div><span class=\"lbl\">02 · Убери лишнее<\u002Fspan><div class=\"draw\" style=\"height: 300px;\"><\u002Fdiv><\u002Fdiv>\n<div><span class=\"lbl acc\">03 · Окончательный<\u002Fspan><div class=\"draw\" style=\"height: 300px; border-color: var(--acc2);\"><\u002Fdiv><\u002Fdiv>\n<\u002Fdiv>\n<div class=\"f\"><span class=\"lbl\">Главные элементы моей сигилы означают<\u002Fspan><div class=\"wr wr4\"><\u002Fdiv><\u002Fdiv>\n<div class=\"cols\">\n<div class=\"f\" style=\"margin: 0;\"><span class=\"lbl\">Что я убрал и почему<\u002Fspan><div class=\"wr wr3\"><\u002Fdiv><\u002Fdiv>\n<div class=\"rulebox\" style=\"padding: 12px 15px;\">\n<span class=\"lbl\">Проверка<\u002Fspan>\n<div class=\"stack\" style=\"gap: 8px;\">\n<label class=\"chk\"><i><\u002Fi><span>Рисуется одним движением.<\u002Fspan><\u002Flabel>\n<label class=\"chk\"><i><\u002Fi><span>Узнаётся в маленьком размере.<\u002Fspan><\u002Flabel>\n<label class=\"chk\"><i><\u002Fi><span>Воспроизводится по памяти без исходника.<\u002Fspan><\u002Flabel>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<div class=\"ft\"><span>Шаг 06 · Поля<\u002Fspan><span>@levorules<\u002Fspan><span class=\"pg\"><\u002Fspan><\u002Fdiv>\n<\u002Fsection>\n\n<section class=\"page\" data-screen-label=\"17 Шаг 07 теория\" style=\"--acc: oklch(0.47 0.1 200); --acc2: oklch(0.6 0.08 200);\">\n<div class=\"hd\"><span>Часть I · Черновик<\u002Fspan><span><b>Шаг 07<\u002Fb> · Форма<\u002Fspan><\u002Fdiv>\n<div class=\"stepline\"><div class=\"gly\"><span style=\"display:flex\"><span style=\"width:13px;height:13px;border:1.5px solid var(--acc);border-radius:50%\"><\u002Fspan><span style=\"width:13px;height:13px;border:1.5px solid var(--acc);border-radius:50%;margin-left:-5px\"><\u002Fspan><\u002Fspan><\u002Fdiv><div class=\"step\" style=\"margin: 0;\">Шаг 07 · Форма<\u002Fdiv><\u002Fdiv>\n<h1>Почему сервитор выглядит именно так?<\u002Fh1>\n<p class=\"lede\">Форма показывает, как сервитор выполняет работу. Она поддерживает функцию, а не отвлекает от неё — и должна объяснять работу ещё до того, как ты прочитаешь имя.<\u002Fp>\n<div class=\"stack\">\n<div class=\"cols\">\n<div>\n<h2>Начни с действия<\u002Fh2>\n<p>Вернись к основной функции и представь её как движение. Если находит — как ищет? Если напоминает — как привлекает внимание? Если завершает начатое — как выглядит момент завершения?<\u002Fp>\n<p style=\"margin: 0;\">Не собирай весь образ сразу: сначала найди одно действие, которое лучше всего передаёт функцию. Живое существо не обязательно — подойдёт механизм, предмет, геометрическая конструкция или животное, если связь с задачей понятна.<\u002Fp>\n<\u002Fdiv>\n<div>\n<h2>Четыре признака рабочей формы<\u002Fh2>\n<ul>\n<li><strong>Силуэт<\u002Fstrong> — узнаваемый даже без мелких деталей.<\u002Fli>\n<li><strong>Материалы<\u002Fstrong> — подсказывают характер работы: стекло — прозрачность, металл — точность, бумага — знания. Выбирай понятные тебе значения.<\u002Fli>\n<li><strong>Движение<\u002Fstrong> — показывает темп: плавно, рывками, по кругу, только вперёд, между заданными точками.<\u002Fli>\n<li><strong>Ключевой жест<\u002Fstrong> — захватывает, соединяет, указывает, отталкивает, закрывает.<\u002Fli>\n<\u002Ful>\n<p class=\"pull\" style=\"margin: 10px 0 0;\">Если виден только портрет, но не способ работы, форма пока не закончена.<\u002Fp>\n<\u002Fdiv>\n<\u002Fdiv>\n<div class=\"cols\">\n<div class=\"warn\">\n<span class=\"lbl\">Типичная ошибка<\u002Fspan>\n<p style=\"margin: 0;\">Добавить рога, крылья, доспехи и десяток глаз, а потом искать им функцию. Так появляется персонаж с богатым гардеробом, но без способа работы. Красивые детали допустимы — но если образ приходится расшифровывать, снова начни с действия. Деталь полезна, когда показывает функцию, помогает узнать сервитора, обозначает границу или проясняет ключевой жест.<\u002Fp>\n<\u002Fdiv>\n<div class=\"ex\">\n<span class=\"lbl acc\">Пример · Тенет<\u002Fspan>\n<p>Тенет доводит фрагменты проекта до рабочей версии, поэтому напоминает жука-переплётчика и небольшой пресс. Блок кремовой бумаги зажат между деревянными обложками; две передние латунные конечности работают как зажимы.<\u002Fp>\n<p style=\"margin: 0;\">Он удерживает ближайший фрагмент и пришивает его красной нитью к общему блоку. Храповик отмечает завершение, катушка хранит запас нити. Без зажимов и нити функция перестаёт читаться.<\u002Fp>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<div class=\"ft\"><span>Шаг 07 · Форма<\u002Fspan><span>@levorules<\u002Fspan><span class=\"pg\"><\u002Fspan><\u002Fdiv>\n<\u002Fsection>\n\n<section class=\"page\" data-screen-label=\"18 Шаг 07 поля\" style=\"--acc: oklch(0.47 0.1 200); --acc2: oklch(0.6 0.08 200);\">\n<div class=\"hd\"><span>Часть I · Черновик<\u002Fspan><span><b>Шаг 07<\u002Fb> · Поля<\u002Fspan><\u002Fdiv>\n<div class=\"stepline\"><div class=\"gly\"><span style=\"display:flex\"><span style=\"width:13px;height:13px;border:1.5px solid var(--acc);border-radius:50%\"><\u002Fspan><span style=\"width:13px;height:13px;border:1.5px solid var(--acc);border-radius:50%;margin-left:-5px\"><\u002Fspan><\u002Fspan><\u002Fdiv><div class=\"step\" style=\"margin: 0;\">Заполни и нарисуй<\u002Fdiv><\u002Fdiv>\n<h1>Форма и её связь с функцией<\u002Fh1>\n<p class=\"lede\">Художественная точность не нужна. Рисунок должен показывать силуэт, движение и ключевой жест.<\u002Fp>\n<div class=\"stack\" style=\"gap: 18px;\">\n<div><span class=\"lbl\">Набросок формы<\u002Fspan><div class=\"draw\" style=\"height: 440px; width: 698px\"><\u002Fdiv><\u002Fdiv>\n<div class=\"cols\">\n<div class=\"f\" style=\"margin: 0;\"><span class=\"lbl\">Общий силуэт<\u002Fspan><div class=\"ln\"><\u002Fdiv><div class=\"ln\"><\u002Fdiv><\u002Fdiv>\n<div class=\"f\" style=\"margin: 0;\"><span class=\"lbl\">Основные материалы<\u002Fspan><div class=\"ln\"><\u002Fdiv><div class=\"ln\"><\u002Fdiv><\u002Fdiv>\n<div class=\"f\" style=\"margin: 0;\"><span class=\"lbl\">Как сервитор двигается<\u002Fspan><div class=\"ln\"><\u002Fdiv><\u002Fdiv>\n<div class=\"f\" style=\"margin: 0;\"><span class=\"lbl\">ГЛАВНАЯ ДЕТАЛЬ · ОНА НУЖНА, ПОТОМУ ЧТО<\u002Fspan><div class=\"ln\"><\u002Fdiv><\u002Fdiv>\n<\u002Fdiv>\n<div class=\"cols\">\n<div class=\"f\" style=\"margin: 0;\"><span class=\"lbl acc\">ГЛАВНАЯ ДЕТАЛЬ · ОНА НУЖНА, ПОТОМУ ЧТО<\u002Fspan><div class=\"wr wr3\"><\u002Fdiv><\u002Fdiv>\n<div class=\"f\" style=\"margin: 0;\"><span class=\"lbl\">Я убрал (и функция не пострадала)<\u002Fspan><div class=\"wr wr3\"><\u002Fdiv><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<div class=\"ft\"><span>Шаг 07 · Поля<\u002Fspan><span>@levorules<\u002Fspan><span class=\"pg\"><\u002Fspan><\u002Fdiv>\n<\u002Fsection>\n\n<section class=\"page\" data-screen-label=\"19 Шаг 08 теория\" style=\"--acc: oklch(0.47 0.1 225); --acc2: oklch(0.6 0.08 225);\">\n<div class=\"hd\"><span>Часть I · Черновик<\u002Fspan><span><b>Шаг 08<\u002Fb> · Анкер и активация<\u002Fspan><\u002Fdiv>\n<div class=\"stepline\"><div class=\"gly\"><span style=\"width:18px;height:18px;border:1.5px solid var(--acc);display:flex;align-items:center;justify-content:center\"><span style=\"width:7px;height:7px;background:var(--acc)\"><\u002Fspan><\u002Fspan><\u002Fdiv><div class=\"step\" style=\"margin: 0;\">Шаг 08 · Анкер и активация<\u002Fdiv><\u002Fdiv>\n<h1>Как начинать и завершать работу?<\u002Fh1>\n<p class=\"lede\">Анкер связывает задачу, образ и правила с конкретным предметом или местом — точкой доступа во время работы. По умолчанию он не делает сервитора сильнее. <span class=\"hl\">Он делает обращение понятным и повторяемым.<\u002Fspan><\u002Fp>\n<div class=\"stack\">\n<div class=\"cols\">\n<div>\n<h2>Выбери доступный носитель<\u002Fh2>\n<p>Материальным анкером может стать карточка с сигилой, монета, жетон, фигурка или рабочий инструмент. Цифровым — файл, заметка или изображение сигилы. Главное — удобство.<\u002Fp>\n<p style=\"margin: 0;\"><strong>Хороший анкер<\u002Fstrong> связан с задачей или функцией; доступен тогда, когда начинается работа; не используется постоянно или случайно; его можно без сожаления убрать или заменить.<\u002Fp>\n<\u002Fdiv>\n<div>\n<div class=\"warn\">\n<span class=\"lbl\">Типичная ошибка<\u002Fspan>\n<p>Выбрать дорогой, незаменимый или постоянно используемый предмет. Если нужно доставать фамильную реликвию из банковской ячейки, активация становится сложнее задачи.<\u002Fp>\n<p style=\"margin: 0;\">Кольцо, телефон или ключ присутствуют рядом почти всегда — с ними трудно отличить активацию от обычного действия. Анкер должен упрощать доступ, а не делать каждое касание подозрительным.<\u002Fp>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<div class=\"cols\">\n<div class=\"rulebox\">\n<span class=\"lbl acc\">Начало сеанса<\u002Fspan>\n<p style=\"margin: 0;\">Активация — заранее выбранная последовательность: прикосновение к анкеру, произнесение имени, взгляд на сигилу, один простой жест, короткая стартовая фраза. Повторяй действия в одном порядке, чтобы отличать начало работы от случайного касания или слова.<\u002Fp>\n<\u002Fdiv>\n<div class=\"rulebox\">\n<span class=\"lbl\">Завершение сеанса<\u002Fspan>\n<p style=\"margin: 0;\">Выбери отдельную фразу или действие, закрывающее текущее обращение: «______, работа завершена». Затем верни анкер на место или закрой запись с сигилой. Это закрывает только сеанс — условия окончательного завершения определяются отдельно.<\u002Fp>\n<\u002Fdiv>\n<\u002Fdiv>\n<div class=\"cols\">\n<div class=\"card\">\n<span class=\"lbl\">Активация должна быть короткой<\u002Fspan>\n<p style=\"margin: 0;\">Достаточно короткой, чтобы ты действительно ею пользовался, и достаточно ясной, чтобы она не происходила случайно. Не собирай пятнадцатиминутную церемонию ради сорокапятиминутного рабочего блока.<\u002Fp>\n<\u002Fdiv>\n<div class=\"ex\">\n<span class=\"lbl acc\">Пример · Тенет<\u002Fspan>\n<p style=\"margin: 0;\">Анкер — латунный зажим: он повторяет функцию (выбрать фрагмент, удержать, присоединить к общей работе). Перед блоком я кладу зажим рядом с проектом, касаюсь его и говорю: «Тенет, начинай работу», затем выбираю ближайший шаг и запускаю таймер. В конце записываю результат, говорю «Тенет, работа завершена» и возвращаю зажим на подставку. Для других бумаг он не используется.<\u002Fp>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<div class=\"ft\"><span>Шаг 08 · Анкер и активация<\u002Fspan><span>@levorules<\u002Fspan><span class=\"pg\"><\u002Fspan><\u002Fdiv>\n<\u002Fsection>\n\n<section class=\"page\" data-screen-label=\"20 Шаг 08 поля\" style=\"--acc: oklch(0.47 0.1 225); --acc2: oklch(0.6 0.08 225);\">\n<div class=\"hd\"><span>Часть I · Черновик<\u002Fspan><span><b>Шаг 08<\u002Fb> · Поля<\u002Fspan><\u002Fdiv>\n<div class=\"stepline\"><div class=\"gly\"><span style=\"width:18px;height:18px;border:1.5px solid var(--acc);display:flex;align-items:center;justify-content:center\"><span style=\"width:7px;height:7px;background:var(--acc)\"><\u002Fspan><\u002Fspan><\u002Fdiv><div class=\"step\" style=\"margin: 0;\">Заполни<\u002Fdiv><\u002Fdiv>\n<h1>Анкер, активация, завершение сеанса<\u002Fh1>\n<p class=\"lede\">Если начало и завершение легко различаются без подсказки — можно переходить к главной команде.<\u002Fp>\n<div class=\"stack\" style=\"gap: 18px;\">\n<div class=\"cols\">\n<div class=\"f\" style=\"margin: 0;\"><span class=\"lbl acc\">Мой анкер<\u002Fspan><div class=\"ln\"><\u002Fdiv><\u002Fdiv>\n<div class=\"f\" style=\"margin: 0;\"><span class=\"lbl\">Где я его храню<\u002Fspan><div class=\"ln\"><\u002Fdiv><\u002Fdiv>\n<\u002Fdiv>\n<div class=\"f\"><span class=\"lbl\">Он связан с задачей или функцией, потому что<\u002Fspan><div class=\"wr wr2\"><\u002Fdiv><div class=\"ln\"><\u002Fdiv><div class=\"ln\"><\u002Fdiv><\u002Fdiv>\n<div class=\"rulebox\">\n<span class=\"lbl acc\">Активация · по порядку<\u002Fspan>\n<div class=\"stack\" style=\"gap: 6px;\">\n<div style=\"display: grid; grid-template-columns: 108px 1fr; gap: 10px; align-items: baseline;\"><span class=\"note\">Я беру / открываю<\u002Fspan><div class=\"ln\"><\u002Fdiv><\u002Fdiv>\n<div style=\"display: grid; grid-template-columns: 108px 1fr; gap: 10px; align-items: baseline;\"><span class=\"note\">Затем я<\u002Fspan><div class=\"ln\"><\u002Fdiv><\u002Fdiv>\n<div style=\"display: grid; grid-template-columns: 108px 1fr; gap: 10px; align-items: baseline;\"><span class=\"note\">Фраза начала<\u002Fspan><div class=\"ln\"><\u002Fdiv><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<div class=\"rulebox\">\n<span class=\"lbl\">Завершение сеанса<\u002Fspan>\n<div class=\"stack\" style=\"gap: 6px;\">\n<div style=\"display: grid; grid-template-columns: 108px 1fr; gap: 10px; align-items: baseline;\"><span class=\"note\">Фраза завершения<\u002Fspan><div class=\"ln\"><\u002Fdiv><\u002Fdiv>\n<div style=\"display: grid; grid-template-columns: 108px 1fr; gap: 10px; align-items: baseline;\"><span class=\"note\">После неё я<\u002Fspan><div class=\"ln\"><\u002Fdiv><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<div class=\"cols\">\n<div class=\"f\" style=\"margin: 0;\"><span class=\"lbl\">Вне обращения этот предмет<\u002Fspan><div class=\"chkrow\" style=\"padding-top: 4px;\"><label class=\"chk\"><i><\u002Fi><span>Не используется<\u002Fspan><\u002Flabel><label class=\"chk\"><i><\u002Fi><span>Используется иначе<\u002Fspan><\u002Flabel><\u002Fdiv><\u002Fdiv>\n<div class=\"f\" style=\"margin: 0;\"><span class=\"lbl\">Момент начала работы понятен, потому что<\u002Fspan><div class=\"ln\"><\u002Fdiv><div class=\"ln\"><\u002Fdiv><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<div class=\"ft\"><span>Шаг 08 · Поля<\u002Fspan><span>@levorules<\u002Fspan><span class=\"pg\"><\u002Fspan><\u002Fdiv>\n<\u002Fsection>\n\n<section class=\"page\" data-screen-label=\"21 Шаг 09 теория\" style=\"--acc: oklch(0.47 0.1 250); --acc2: oklch(0.6 0.08 250);\">\n<div class=\"hd\"><span>Часть I · Черновик<\u002Fspan><span><b>Шаг 09<\u002Fb> · Команда<\u002Fspan><\u002Fdiv>\n<div class=\"stepline\"><div class=\"gly\"><span style=\"display:flex;align-items:center;gap:4px\"><span style=\"width:12px;height:1.5px;background:var(--acc)\"><\u002Fspan><span style=\"width:7px;height:7px;border-radius:50%;background:var(--acc)\"><\u002Fspan><\u002Fspan><\u002Fdiv><div class=\"step\" style=\"margin: 0;\">Шаг 09 · Главная команда<\u002Fdiv><\u002Fdiv>\n<h1>Что именно должен делать сервитор?<\u002Fh1>\n<p class=\"lede\">Задача описывает результат, к которому ты хочешь прийти. Функция объясняет, какую работу выполняет сервитор. Главная команда собирает их в короткую инструкцию.<\u002Fp>\n<div class=\"stack\">\n<div class=\"rulebox\">\n<span class=\"lbl acc\">Команда отвечает на три вопроса<\u002Fspan>\n<div class=\"cols3\">\n<div><div class=\"num\" style=\"margin-bottom: 5px;\">01<\u002Fdiv><strong>Что делать<\u002Fstrong><p style=\"margin: 3px 0 0;\">Прямой глагол: находи, отслеживай, напоминай, возвращай, отделяй, соединяй, завершай.<\u002Fp><\u002Fdiv>\n<div><div class=\"num\" style=\"margin-bottom: 5px;\">02<\u002Fdiv><strong>С чем работать<\u002Fstrong><p style=\"margin: 3px 0 0;\">Конкретный материал задачи: список шагов, фрагмент проекта, внимание.<\u002Fp><\u002Fdiv>\n<div><div class=\"num\" style=\"margin-bottom: 5px;\">03<\u002Fdiv><strong>В какой ситуации<\u002Fstrong><p style=\"margin: 3px 0 0;\">Момент, в который команда вступает в силу: перед блоком, при активации.<\u002Fp><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<div class=\"cols\">\n<div>\n<h2>Оставь одну основную команду<\u002Fh2>\n<p>Рабочая команда содержит одну функцию. Несколько действий допустимы, если образуют один понятный механизм: «возвращай моё внимание к ____, чтобы я завершил выбранный рабочий фрагмент».<\u002Fp>\n<p style=\"margin: 0;\">Не нужно включать в неё имя, форму, материалы, питание, срок жизни и историю создания — для этого есть отдельные разделы. Команда «найди клиентов, улучши здоровье, повысь уверенность и помоги закончить проект» снова пытается устроить целую компанию сервиторов в одном корпусе.<\u002Fp>\n<\u002Fdiv>\n<div>\n<h2>Формулируй прямо<\u002Fh2>\n<p>Не прячь действие за красивой формулировкой. Не используй слова «всегда», «никогда» и «любыми способами», пока не определил, что именно они означают: обязательные правила и запреты записываются отдельно, на следующих шагах.<\u002Fp>\n<div class=\"warn\" style=\"margin-top: 12px;\">\n<span class=\"lbl\">Типичная ошибка<\u002Fspan>\n<p style=\"color: var(--ink); font-style: italic;\">«Веди меня по пути раскрытия истинного предназначения».<\u002Fp>\n<p style=\"margin: 0;\">Звучит торжественно, но не объясняет, что именно должно происходить. <span class=\"hl\">Сервитор не бог и не примет за тебя ключевое решение.<\u002Fspan><\u002Fp>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<div class=\"ex\">\n<span class=\"lbl acc\">Пример · Тенет<\u002Fspan>\n<p style=\"margin: 0; font-size: 16px; color: var(--ink);\">«Тенет, перед каждым рабочим блоком возвращай моё внимание к ближайшему выполнимому шагу и помогай завершать выбранный фрагмент в пределах этого блока».<\u002Fp>\n<\u002Fdiv>\n<div class=\"note\" style=\"border-top: 1px solid var(--hair); padding-top: 11px;\">Если команду можно понять пятью разными способами, сервитор здесь не виноват. Сначала перепиши команду. Это черновик — финальную ты запишешь в чистовом паспорте.<\u002Fdiv>\n<\u002Fdiv>\n<div class=\"ft\"><span>Шаг 09 · Команда<\u002Fspan><span>@levorules<\u002Fspan><span class=\"pg\"><\u002Fspan><\u002Fdiv>\n<\u002Fsection>\n\n<section class=\"page\" data-screen-label=\"22 Шаг 09 поля\" style=\"--acc: oklch(0.47 0.1 250); --acc2: oklch(0.6 0.08 250);\">\n<div class=\"hd\"><span>Часть I · Черновик<\u002Fspan><span><b>Шаг 09<\u002Fb> · Поля<\u002Fspan><\u002Fdiv>\n<div class=\"stepline\"><div class=\"gly\"><span style=\"display:flex;align-items:center;gap:4px\"><span style=\"width:12px;height:1.5px;background:var(--acc)\"><\u002Fspan><span style=\"width:7px;height:7px;border-radius:50%;background:var(--acc)\"><\u002Fspan><\u002Fspan><\u002Fdiv><div class=\"step\" style=\"margin: 0;\">Заполни<\u002Fdiv><\u002Fdiv>\n<h1>Черновик главной команды<\u002Fh1>\n<p class=\"lede\">Сначала собери части, затем напиши команду одной фразой и проверь её по пяти пунктам.<\u002Fp>\n<div class=\"stack\" style=\"gap: 18px;\">\n<div class=\"cols\">\n<div class=\"f\" style=\"margin: 0;\"><span class=\"lbl\">Имя сервитора<\u002Fspan><div class=\"ln\"><\u002Fdiv><\u002Fdiv>\n<div class=\"f\" style=\"margin: 0;\"><span class=\"lbl\">Основное действие (глагол)<\u002Fspan><div class=\"ln\"><\u002Fdiv><\u002Fdiv>\n<\u002Fdiv>\n<div class=\"rulebox\">\n<span class=\"lbl acc\">Главная команда<\u002Fspan>\n<div class=\"wr wr5\"><\u002Fdiv><div class=\"ln\"><\u002Fdiv>\n<\u002Fdiv>\n<div>\n<span class=\"lbl\">Проверь формулировку<\u002Fspan>\n<sc-raw-table>\n<sc-raw-thead><sc-raw-tr><sc-raw-th style=\"width: 54px;\">КРИТЕРИИ:<\u002Fsc-raw-th><sc-raw-th style=\"font-weight: 500; width: 25px\">Да<\u002Fsc-raw-th><sc-raw-th style=\"width: 25px\">Нет<\u002Fsc-raw-th><\u002Fsc-raw-tr><\u002Fsc-raw-thead>\n<sc-raw-tbody>\n<sc-raw-tr><sc-raw-td>Начинается с понятного действия.<\u002Fsc-raw-td><sc-raw-td><div style=\"width: 12px; height: 12px; border: 1px solid var(--mute);\"><\u002Fdiv><\u002Fsc-raw-td><sc-raw-td><div style=\"width: 12px; height: 12px; border: 1px solid var(--mute);\"><\u002Fdiv><\u002Fsc-raw-td><\u002Fsc-raw-tr>\n<sc-raw-tr><sc-raw-td>Относится к одной задаче.<\u002Fsc-raw-td><sc-raw-td><div style=\"width: 12px; height: 12px; border: 1px solid var(--mute);\"><\u002Fdiv><\u002Fsc-raw-td><sc-raw-td><div style=\"width: 12px; height: 12px; border: 1px solid var(--mute);\"><\u002Fdiv><\u002Fsc-raw-td><\u002Fsc-raw-tr>\n<sc-raw-tr><sc-raw-td>Не требует долгого толкования.<\u002Fsc-raw-td><sc-raw-td><div style=\"width: 12px; height: 12px; border: 1px solid var(--mute);\"><\u002Fdiv><\u002Fsc-raw-td><sc-raw-td><div style=\"width: 12px; height: 12px; border: 1px solid var(--mute);\"><\u002Fdiv><\u002Fsc-raw-td><\u002Fsc-raw-tr>\n<sc-raw-tr><sc-raw-td>Выполнение отличимо от совпадения.<\u002Fsc-raw-td><sc-raw-td><div style=\"width: 12px; height: 12px; border: 1px solid var(--mute);\"><\u002Fdiv><\u002Fsc-raw-td><sc-raw-td><div style=\"width: 12px; height: 12px; border: 1px solid var(--mute);\"><\u002Fdiv><\u002Fsc-raw-td><\u002Fsc-raw-tr>\n<sc-raw-tr><sc-raw-td>Остаётся внутри заданных границ.<\u002Fsc-raw-td><sc-raw-td><div style=\"width: 12px; height: 12px; border: 1px solid var(--mute);\"><\u002Fdiv><\u002Fsc-raw-td><sc-raw-td><div style=\"width: 12px; height: 12px; border: 1px solid var(--mute);\"><\u002Fdiv><\u002Fsc-raw-td><\u002Fsc-raw-tr>\n<\u002Fsc-raw-tbody>\n<\u002Fsc-raw-table>\n<\u002Fdiv>\n<div class=\"f\"><span class=\"lbl\">Команда описывает одну функцию — какую именно<\u002Fspan><div class=\"wr wr2\"><\u002Fdiv><div class=\"ln\"><\u002Fdiv><\u002Fdiv>\n<\u002Fdiv>\n<div class=\"ft\"><span>Шаг 09 · Поля<\u002Fspan><span>@levorules<\u002Fspan><span class=\"pg\"><\u002Fspan><\u002Fdiv>\n<\u002Fsection>\n\n<section class=\"page\" data-screen-label=\"23 Шаг 10 теория\" style=\"--acc: oklch(0.47 0.1 275); --acc2: oklch(0.6 0.08 275);\">\n<div class=\"hd\"><span>Часть I · Черновик<\u002Fspan><span><b>Шаг 10<\u002Fb> · Разрешения<\u002Fspan><\u002Fdiv>\n<div class=\"stepline\"><div class=\"gly\"><span style=\"display:flex;gap:4px\"><span style=\"width:5px;height:5px;border-radius:50%;background:var(--acc)\"><\u002Fspan><span style=\"width:5px;height:5px;border-radius:50%;background:var(--acc)\"><\u002Fspan><span style=\"width:5px;height:5px;border-radius:50%;background:var(--acc)\"><\u002Fspan><\u002Fspan><\u002Fdiv><div class=\"step\" style=\"margin: 0;\">Шаг 10 · Разрешения<\u002Fdiv><\u002Fdiv>\n<h1>Какими способами можно действовать?<\u002Fh1>\n<p class=\"lede\">Разрешения не добавляют новые задачи. Они уточняют, где и как может проявляться уже выбранная функция.<\u002Fp>\n<div class=\"stack\">\n<div class=\"cols\">\n<div>\n<h2>Что можно разрешить<\u002Fh2>\n<p>Например, сервитору можно разрешить:<\u002Fp>\n<ul>\n<li>обращать твоё внимание на нужный рабочий материал;<\u002Fli>\n<li>возвращать тебя к заранее составленному списку шагов;<\u002Fli>\n<li>помогать замечать момент, когда ты снова отвлёкся;<\u002Fli>\n<li>выделять ближайшую к завершению часть;<\u002Fli>\n<li>использовать только информацию внутри выбранного проекта.<\u002Fli>\n<\u002Ful>\n<p style=\"margin: 0;\">Обычно достаточно трёх–пяти разрешений. Если список занимает несколько страниц, ты уже не оставляешь ему пространства для работы, а пишешь инструкцию, которую сам же не сможешь воспроизвести.<\u002Fp>\n<\u002Fdiv>\n<div>\n<h2>Разрешение не отменяет границы<\u002Fh2>\n<p>Оно действует только внутри задачи, области работы и условий, которые ты уже определил. И оно не передаёт сервитору право принимать решения за тебя: он может обратить внимание на вариант — выбирать, проверять и действовать продолжаешь ты.<\u002Fp>\n<div class=\"card\" style=\"margin-top: 12px;\">\n<p style=\"margin: 0;\">Фраза «разрешено привлекать внимание» не означает «разрешено лишать сна, вызывать тревогу или вмешиваться во все мысли».<\u002Fp>\n<\u002Fdiv>\n<p style=\"margin: 9px 0 0;\">Если разрешение расширяет работу на здоровье, деньги, отношения или других людей, хотя этого не было в исходной задаче — убери его или вернись к границам.<\u002Fp>\n<\u002Fdiv>\n<\u002Fdiv>\n<div class=\"cols\">\n<div class=\"warn\">\n<span class=\"lbl\">Типичная ошибка · две крайности<\u002Fspan>\n<p style=\"color: var(--ink); font-style: italic;\">«Добейся результата любыми способами».<\u002Fp>\n<p style=\"margin: 0;\">Эта фраза не даёт полезной свободы — она просто убирает различие между допустимым и недопустимым. Вторая крайность: расписать каждое движение настолько подробно, что любое отклонение объявляется ошибкой. Тебе нужен ограниченный выбор способов внутри понятной функции: <span class=\"hl\">не вольная грамота и не пульт с кучей кнопок<\u002Fspan>.<\u002Fp>\n<\u002Fdiv>\n<div class=\"ex\">\n<span class=\"lbl acc\">Пример · разрешено Тенету<\u002Fspan>\n<ul style=\"margin: 0;\">\n<li>обращать моё внимание на список незавершённых частей проекта;<\u002Fli>\n<li>выделять ближайший к готовности фрагмент;<\u002Fli>\n<li>замечать, когда я снова переделываю готовое начало;<\u002Fli>\n<li>возвращать внимание к выбранному шагу в рабочем блоке;<\u002Fli>\n<li>учитывать только материалы текущего проекта.<\u002Fli>\n<\u002Ful>\n<\u002Fdiv>\n<\u002Fdiv>\n<div class=\"note\" style=\"border-top: 1px solid var(--hair); padding-top: 11px;\">Для каждого пункта спроси: связан ли он с главной командой; помогает ли выполнить ту же функцию; не создаёт ли новую задачу; не расширяет ли область; можно ли объяснить его одной фразой.<\u002Fdiv>\n<\u002Fdiv>\n<div class=\"ft\"><span>Шаг 10 · Разрешения<\u002Fspan><span>@levorules<\u002Fspan><span class=\"pg\"><\u002Fspan><\u002Fdiv>\n<\u002Fsection>\n\n<section class=\"page\" data-screen-label=\"24 Шаг 10 поля\" style=\"--acc: oklch(0.47 0.1 275); --acc2: oklch(0.6 0.08 275);\">\n<div class=\"hd\"><span>Часть I · Черновик<\u002Fspan><span><b>Шаг 10<\u002Fb> · Поля<\u002Fspan><\u002Fdiv>\n<div class=\"stepline\"><div class=\"gly\"><span style=\"display:flex;gap:4px\"><span style=\"width:5px;height:5px;border-radius:50%;background:var(--acc)\"><\u002Fspan><span style=\"width:5px;height:5px;border-radius:50%;background:var(--acc)\"><\u002Fspan><span style=\"width:5px;height:5px;border-radius:50%;background:var(--acc)\"><\u002Fspan><\u002Fspan><\u002Fdiv><div class=\"step\" style=\"margin: 0;\">Заполни<\u002Fdiv><\u002Fdiv>\n<h1>Разрешённые способы работы<\u002Fh1>\n<p class=\"lede\">Три–пять пунктов. Каждый поддерживает главную команду и не создаёт новой задачи.<\u002Fp>\n<div class=\"stack\" style=\"gap: 18px;\">\n<div class=\"stack\" style=\"gap: 12px;\">\n<div style=\"display: grid; grid-template-columns: 26px 1fr; gap: 10px; align-items: start;\"><span class=\"num\" style=\"margin-top: 22px;\">01<\u002Fspan><div class=\"wr wr2\"><\u002Fdiv><\u002Fdiv>\n<div style=\"display: grid; grid-template-columns: 26px 1fr; gap: 10px; align-items: start;\"><span class=\"num\" style=\"margin-top: 22px;\">02<\u002Fspan><div class=\"wr wr2\"><\u002Fdiv><\u002Fdiv>\n<div style=\"display: grid; grid-template-columns: 26px 1fr; gap: 10px; align-items: start;\"><span class=\"num\" style=\"margin-top: 22px;\">03<\u002Fspan><div class=\"wr wr2\"><\u002Fdiv><\u002Fdiv>\n<div style=\"display: grid; grid-template-columns: 26px 1fr; gap: 10px; align-items: start;\"><span class=\"num\" style=\"margin-top: 22px;\">04<\u002Fspan><div class=\"wr wr2\"><\u002Fdiv><\u002Fdiv>\n<div style=\"display: grid; grid-template-columns: 26px 1fr; gap: 10px; align-items: start;\"><span class=\"num\" style=\"margin-top: 22px;\">05<\u002Fspan><div class=\"wr wr2\"><\u002Fdiv><\u002Fdiv>\n<\u002Fdiv>\n<div class=\"rulebox\">\n<span class=\"lbl\">Проверь список<\u002Fspan>\n<div class=\"cols\" style=\"gap: 10px 24px;\">\n<label class=\"chk\"><i><\u002Fi><span>Все пункты поддерживают главную команду.<\u002Fspan><\u002Flabel>\n<label class=\"chk\"><i><\u002Fi><span>Ни один не создаёт новую задачу.<\u002Fspan><\u002Flabel>\n<label class=\"chk\"><i><\u002Fi><span>Область работы не расширяется.<\u002Fspan><\u002Flabel>\n<label class=\"chk\"><i><\u002Fi><span>Каждый пункт объясняется одной фразой.<\u002Fspan><\u002Flabel>\n<\u002Fdiv>\n<\u002Fdiv>\n<div class=\"cols\">\n<div class=\"f\" style=\"margin: 0;\"><span class=\"lbl\">ЧТО Я С СДЕЛАЛ С ЛИШНИМ ПУНКТОМ (ЕСЛИ БЫЛ)<\u002Fspan><div class=\"wr wr2\"><\u002Fdiv><div class=\"wr wr2\"><\u002Fdiv><\u002Fdiv>\n<div class=\"f\" style=\"margin: 0;\"><span class=\"lbl acc\">ВСЕ РАЗРЕШЕНИЯ ВЕДУТ К ЭТОМУ РЕЗУЛЬТАТУ<\u002Fspan><div class=\"wr wr2\"><\u002Fdiv><div class=\"wr wr2\"><\u002Fdiv><\u002Fdiv>\n<\u002Fdiv>\n<div class=\"note\" style=\"border-top: 1px solid var(--hair); padding-top: 11px;\">Прочитай команду и разрешения вслух. Если команда описывает одну функцию, а каждое разрешение поддерживает её и не расширяет границы — переходи к запретам.<\u002Fdiv>\n<\u002Fdiv>\n<div class=\"ft\"><span>Шаг 10 · Поля<\u002Fspan><span>@levorules<\u002Fspan><span class=\"pg\"><\u002Fspan><\u002Fdiv>\n<\u002Fsection>\n\n<section class=\"page\" data-screen-label=\"25 Шаг 11 теория\" style=\"--acc: oklch(0.47 0.1 300); --acc2: oklch(0.6 0.08 300);\">\n<div class=\"hd\"><span>Часть I · Черновик<\u002Fspan><span><b>Шаг 11<\u002Fb> · Запреты и сценарии<\u002Fspan><\u002Fdiv>\n<div class=\"stepline\"><div class=\"gly\"><span style=\"width:17px;height:17px;border:1.5px solid var(--acc);position:relative;display:block;overflow:hidden\"><span style=\"position:absolute;left:-4px;right:-4px;top:50%;height:1.5px;background:var(--acc);transform:rotate(-45deg)\"><\u002Fspan><\u002Fspan><\u002Fdiv><div class=\"step\" style=\"margin: 0;\">Шаг 11 · Запреты и сценарии<\u002Fdiv><\u002Fdiv>\n<h1>Что должно оставаться вне работы?<\u002Fh1>\n<p class=\"lede\">Эти правила нужны не для того, чтобы превратить паспорт в договор на триста страниц, а чтобы позже не менять условия задним числом. <span class=\"hl\">Если правило не записано, его легко подменяет настроение момента.<\u002Fspan><\u002Fp>\n<div class=\"stack\">\n<div>\n<span class=\"lbl\">Три вида правил — у каждого своя работа<\u002Fspan>\n<div style=\"display: grid; gap: 1px; background: var(--rule); border: 1px solid var(--rule);\">\n<div style=\"display: grid; grid-template-columns: 130px 1fr; gap: 16px; background: oklch(0.968 0.014 85); padding: 12px 15px;\"><strong>Запрещено<\u002Fstrong><span style=\"color: var(--soft);\">То, чего сервитор не делает ни при каком результате. Например, не вмешивается в сон, здоровье, отношения, деньги или чужие решения.<\u002Fspan><\u002Fdiv>\n<div style=\"display: grid; grid-template-columns: 130px 1fr; gap: 16px; background: oklch(0.968 0.014 85); padding: 12px 15px;\"><strong>Всегда<\u002Fstrong><span style=\"color: var(--soft);\">Обязательное действие в определённой ситуации: перед блоком возвращать внимание к ближайшему шагу; после блока фиксировать результат.<\u002Fspan><\u002Fdiv>\n<div style=\"display: grid; grid-template-columns: 130px 1fr; gap: 16px; background: oklch(0.968 0.014 85); padding: 12px 15px;\"><strong>Никогда<\u002Fstrong><span style=\"color: var(--soft);\">Способ работы, который нельзя использовать: подменять твои решения, расширять задачу, инициировать обращение вне выбранного времени.<\u002Fspan><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<div class=\"cols\">\n<div>\n<h2>Не запрещай всё сразу<\u002Fh2>\n<div class=\"warn\" style=\"margin-top: 4px;\">\n<p style=\"color: var(--ink); font-style: italic;\">«Никогда не вызывай у меня неприятных чувств».<\u002Fp>\n<p style=\"margin: 0;\">Звучит безопасно, но не объясняет, что делать в реальности. Тревога может означать, что задача слишком велика. Пиши конкретно: «Не усиливай тревогу и не используй её как повод отказаться от обычных действий».<\u002Fp>\n<\u002Fdiv>\n<\u002Fdiv>\n<div>\n<h2>Сценарии «если — то»<\u002Fh2>\n<p>Сценарий связывает повторяющуюся проблему с заранее выбранным действием. Продумай три ситуации:<\u002Fp>\n<ul style=\"margin: 0;\">\n<li>если результат задерживается;<\u002Fli>\n<li>если ты пропускаешь обычное действие;<\u002Fli>\n<li>если правила конфликтуют или ситуация неясна.<\u002Fli>\n<\u002Ful>\n<p style=\"margin: 9px 0 0;\">При конфликте останови обращение, запиши вопрос и реши сам. Окончательный выбор остаётся за тобой.<\u002Fp>\n<\u002Fdiv>\n<\u002Fdiv>\n<div class=\"ex\">\n<span class=\"lbl acc\">Пример · Тенет<\u002Fspan>\n<p>Тенету запрещено вмешиваться в сон, здоровье, отношения и другие проекты. Он не заменяет мои решения и не работает вне запланированных блоков. <strong>Всегда:<\u002Fstrong> перед блоком возвращает внимание к ближайшему шагу; после — помогает зафиксировать результат. <strong>Никогда:<\u002Fstrong> не увеличивает нагрузку в наказание за пропуск и не превращает сон, знак или настроение в доказательство выполненной задачи.<\u002Fp>\n<p style=\"margin: 0;\"><strong>Если<\u002Fstrong> я снова переделываю начало, <strong>то<\u002Fstrong> выбираю ближайшую к готовности часть. <strong>Если<\u002Fstrong> пропускаю блок, <strong>то<\u002Fstrong> переношу его без двойной нагрузки. <strong>Если<\u002Fstrong> шаг неясен, <strong>то<\u002Fstrong> выбираю самую маленькую проверяемую часть.<\u002Fp>\n<\u002Fdiv>\n<\u002Fdiv>\n<div class=\"ft\"><span>Шаг 11 · Запреты и сценарии<\u002Fspan><span>@levorules<\u002Fspan><span class=\"pg\"><\u002Fspan><\u002Fdiv>\n<\u002Fsection>\n\n<section class=\"page\" data-screen-label=\"26 Шаг 11 поля\" style=\"--acc: oklch(0.47 0.1 300); --acc2: oklch(0.6 0.08 300);\">\n<div class=\"hd\"><span>Часть I · Черновик<\u002Fspan><span><b>Шаг 11<\u002Fb> · Поля<\u002Fspan><\u002Fdiv>\n<div class=\"stepline\"><div class=\"gly\"><span style=\"width:17px;height:17px;border:1.5px solid var(--acc);position:relative;display:block;overflow:hidden\"><span style=\"position:absolute;left:-4px;right:-4px;top:50%;height:1.5px;background:var(--acc);transform:rotate(-45deg)\"><\u002Fspan><\u002Fspan><\u002Fdiv><div class=\"step\" style=\"margin: 0;\">Заполни<\u002Fdiv><\u002Fdiv>\n<h1>Границы и заранее принятые ответы<\u002Fh1>\n<p class=\"lede\">Убери правила, которые невозможно проверить, и те, что повторяют уже записанные границы.<\u002Fp>\n<div class=\"stack\" style=\"gap: 16px;\">\n<div>\n<span class=\"lbl\">Запрещено · пять пунктов<\u002Fspan>\n<div class=\"stack\" style=\"gap: 7px;\">\n<div style=\"display: grid; grid-template-columns: 26px 1fr; gap: 10px; align-items: baseline;\"><span class=\"num\">01<\u002Fspan><div class=\"ln\"><\u002Fdiv><\u002Fdiv>\n<div style=\"display: grid; grid-template-columns: 26px 1fr; gap: 10px; align-items: baseline;\"><span class=\"num\">02<\u002Fspan><div class=\"ln\"><\u002Fdiv><\u002Fdiv>\n<div style=\"display: grid; grid-template-columns: 26px 1fr; gap: 10px; align-items: baseline;\"><span class=\"num\">03<\u002Fspan><div class=\"ln\"><\u002Fdiv><\u002Fdiv>\n<div style=\"display: grid; grid-template-columns: 26px 1fr; gap: 10px; align-items: baseline;\"><span class=\"num\">04<\u002Fspan><div class=\"ln\"><\u002Fdiv><\u002Fdiv>\n<div style=\"display: grid; grid-template-columns: 26px 1fr; gap: 10px; align-items: baseline;\"><span class=\"num\">05<\u002Fspan><div class=\"ln\"><\u002Fdiv><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<div class=\"cols\">\n<div>\n<span class=\"lbl\">Всегда · три правила<\u002Fspan>\n<div class=\"stack\" style=\"gap: 7px;\">\n<div class=\"ln\"><\u002Fdiv><div class=\"ln\"><\u002Fdiv><div class=\"ln\"><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<div>\n<span class=\"lbl\">Никогда · три правила<\u002Fspan>\n<div class=\"stack\" style=\"gap: 7px;\">\n<div class=\"ln\"><\u002Fdiv><div class=\"ln\"><\u002Fdiv><div class=\"ln\"><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<div class=\"rulebox\">\n<span class=\"lbl acc\">Сценарии «если — то» · три повторяющиеся ситуации<\u002Fspan>\n<div class=\"stack\" style=\"gap: 10px;\">\n<div style=\"display: grid; grid-template-columns: 50px 1fr 44px 1fr; gap: 10px; align-items: baseline;\"><span class=\"note\">Если<\u002Fspan><div class=\"ln\"><\u002Fdiv><span class=\"note\">то я<\u002Fspan><div class=\"ln\"><\u002Fdiv><\u002Fdiv>\n<div style=\"display: grid; grid-template-columns: 50px 1fr 44px 1fr; gap: 10px; align-items: baseline;\"><span class=\"note\">Если<\u002Fspan><div class=\"ln\"><\u002Fdiv><span class=\"note\">то я<\u002Fspan><div class=\"ln\"><\u002Fdiv><\u002Fdiv>\n<div style=\"display: grid; grid-template-columns: 50px 1fr 44px 1fr; gap: 10px; align-items: baseline;\"><span class=\"note\">Если<\u002Fspan><div class=\"ln\"><\u002Fdiv><span class=\"note\">то я<\u002Fspan><div class=\"ln\"><\u002Fdiv><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<div class=\"note\" style=\"border-top: 1px solid var(--hair); padding-top: 11px;\">Удели этому блоку немного времени перед тем, как двигаться дальше. Не торопись, подумай, зафиксируй.<\u002Fdiv>\n<\u002Fdiv>\n<div class=\"ft\"><span>Шаг 11 · Поля<\u002Fspan><span>@levorules<\u002Fspan><span class=\"pg\"><\u002Fspan><\u002Fdiv>\n<\u002Fsection>\n\n<section class=\"page\" data-screen-label=\"27 Шаг 12 автономия\" style=\"--acc: oklch(0.47 0.1 325); --acc2: oklch(0.6 0.08 325);\">\n<div class=\"hd\"><span>Часть I · Черновик<\u002Fspan><span><b>Шаг 12<\u002Fb> · Автономия<\u002Fspan><\u002Fdiv>\n<div class=\"stepline\"><div class=\"gly\"><span style=\"display:grid;gap:3px;justify-items:start\"><span style=\"width:7px;height:1.5px;background:var(--acc)\"><\u002Fspan><span style=\"width:12px;height:1.5px;background:var(--acc)\"><\u002Fspan><span style=\"width:17px;height:1.5px;background:var(--acc)\"><\u002Fspan><\u002Fspan><\u002Fdiv><div class=\"step\" style=\"margin: 0;\">Шаг 12 · Автономия<\u002Fdiv><\u002Fdiv>\n<h1>Сколько самостоятельности давать?<\u002Fh1>\n<p class=\"lede\">Реши, выполняет ли сервитор функцию только во время прямого обращения или продолжает работу между сеансами. Автономность определяет объём самостоятельности внутри уже заданной задачи — она не расширяет область работы.<\u002Fp>\n<div class=\"stack\">\n<div style=\"display: grid; gap: 1px; background: var(--rule); border: 1px solid var(--rule);\">\n<div style=\"display: grid; grid-template-columns: 44px 200px 1fr; gap: 14px; align-items: baseline; background: oklch(0.968 0.014 85); padding: 11px 15px;\"><span class=\"num\">A0<\u002Fspan><strong>Разовое действие<\u002Fstrong><span style=\"color: var(--soft);\">Одна команда для конкретной ситуации. После выполнения работа заканчивается.<\u002Fspan><\u002Fdiv>\n<div style=\"display: grid; grid-template-columns: 44px 200px 1fr; gap: 14px; align-items: baseline; background: oklch(0.968 0.014 85); padding: 11px 15px;\"><span class=\"num\">A1<\u002Fspan><strong>Работа по вызову<\u002Fstrong><span style=\"color: var(--soft);\">Одна функция только после активации. Между обращениями не инициирует работу.<\u002Fspan><\u002Fdiv>\n<div style=\"display: grid; grid-template-columns: 44px 200px 1fr; gap: 14px; align-items: baseline; background: oklch(0.968 0.014 85); padding: 11px 15px;\"><span class=\"num\">A2<\u002Fspan><strong>Работа между вызовами<\u002Fstrong><span style=\"color: var(--soft);\">После активации продолжает одну функцию в заданный срок, но не меняет задачу и не решает за тебя.<\u002Fspan><\u002Fdiv>\n<div style=\"display: grid; grid-template-columns: 44px 200px 1fr; gap: 14px; align-items: baseline; background: oklch(0.968 0.014 85); padding: 11px 15px;\"><span class=\"num\">A3<\u002Fspan><strong>Ограниченная область задач<\u002Fstrong><span style=\"color: var(--soft);\">Несколько связанных ситуаций в одной области. Нужны особенно ясные границы и условия остановки.<\u002Fspan><\u002Fdiv>\n<div style=\"display: grid; grid-template-columns: 44px 200px 1fr; gap: 14px; align-items: baseline; background: oklch(0.968 0.014 85); padding: 11px 15px;\"><span class=\"num\">A4<\u002Fspan><strong>Групповая конструкция<\u002Fstrong><span style=\"color: var(--soft);\">Образ поддерживают несколько людей. Отдельный формат, в этом гайде подробно не рассматривается. Аймсорри.<\u002Fspan><\u002Fdiv>\n<\u002Fdiv>\n<div class=\"cols\">\n<div class=\"card\">\n<span class=\"lbl\">Для первого сервитора<\u002Fspan>\n<p style=\"margin: 0;\">Обычно достаточно A0 или A1. Начинать с A3 — это как нанять топ-менеджера раньше, чем ты решил, чем занимается компания.<\u002Fp>\n<\u002Fdiv>\n<div>\n<h2>Больше автономии — больше проверки<\u002Fh2>\n<p style=\"margin: 0;\">Высокий уровень не делает сервитора сильнее. Он просто оставляет больше ситуаций, в которых конструкция действует без нового обращения. Поэтому чем выше автономия, тем точнее должны быть срок работы, разрешённые способы, запреты, канал обратной связи и условия пересмотра.<\u002Fp>\n<\u002Fdiv>\n<\u002Fdiv>\n<div class=\"warn\">\n<span class=\"lbl\">Автономность не означает власть<\u002Fspan>\n<p style=\"margin: 0;\">Не выбирай высокий уровень ради ощущения, что сервитор стал «живее». Выбирай его только тогда, когда функция действительно должна выполняться между обращениями. <span class=\"hl\">Даже самый автономный сервитор остаётся конструкцией с одной функцией, а не новым руководителем твоей жизни.<\u002Fspan><\u002Fp>\n<\u002Fdiv>\n<\u002Fdiv>\n<div class=\"ft\"><span>Шаг 12 · Автономия<\u002Fspan><span>@levorules<\u002Fspan><span class=\"pg\"><\u002Fspan><\u002Fdiv>\n<\u002Fsection>\n\n<section class=\"page\" data-screen-label=\"28 Шаг 12 канал связи\" style=\"--acc: oklch(0.47 0.1 325); --acc2: oklch(0.6 0.08 325);\">\n<div class=\"hd\"><span>Часть I · Черновик<\u002Fspan><span><b>Шаг 12<\u002Fb> · Канал связи<\u002Fspan><\u002Fdiv>\n<div class=\"stepline\"><div class=\"gly\"><span style=\"display:grid;gap:3px;justify-items:start\"><span style=\"width:7px;height:1.5px;background:var(--acc)\"><\u002Fspan><span style=\"width:12px;height:1.5px;background:var(--acc)\"><\u002Fspan><span style=\"width:17px;height:1.5px;background:var(--acc)\"><\u002Fspan><\u002Fspan><\u002Fdiv><div class=\"step\" style=\"margin: 0;\">Шаг 12 · Канал связи<\u002Fdiv><\u002Fdiv>\n<h1>Что считать обратной связью?<\u002Fh1>\n<p class=\"lede\">Канал связи — это способ, которым ты будешь замечать и записывать возможную обратную связь. Выбери один основной. Дополнительный добавляй только тогда, когда понимаешь, зачем он нужен.<\u002Fp>\n<div class=\"stack\">\n<div class=\"cols\">\n<div>\n<h2>Возможные каналы<\u002Fh2>\n<ul>\n<li>отдельная запись в журнале;<\u002Fli>\n<li>мысль или образ во время активированного сеанса;<\u002Fli>\n<li>результат заранее выбранной дивинационной процедуры;<\u002Fli>\n<li>сон, если работа со снами прямо включена в правила;<\u002Fli>\n<li>телесный сигнал с заранее определённым значением.<\u002Fli>\n<\u002Ful>\n<p style=\"margin: 0;\">Не оставляй канал открытым для всего сразу: если сообщением можно объявить любую мысль, сон и номер автобуса, проверить связь невозможно.<\u002Fp>\n<\u002Fdiv>\n<div>\n<h2>Установи время для связи<\u002Fh2>\n<p>Заранее реши: может ли сервитор инициировать обращение; когда связь допустима и когда канал закрыт.<\u002Fp>\n<p style=\"margin: 0;\">Постоянно открытый канал превращает любую случайную мысль в повод начать что-нибудь «видеть». Если задача связана с рабочим проектом, нет причин устраивать сервитору ночные смены в твоей голове.<\u002Fp>\n<\u002Fdiv>\n<\u002Fdiv>\n<div class=\"rulebox\">\n<span class=\"lbl acc\">Ответ — ещё не приказ<\u002Fspan>\n<p style=\"margin: 0;\">Записанный образ, мысль или результат дивинации остаётся материалом для проверки. Он не становится распоряжением только потому, что показался своевременным: решение о действии принимаешь ты.<\u002Fp>\n<\u002Fdiv>\n<div class=\"warn\">\n<span class=\"lbl\">Типичная ошибка<\u002Fspan>\n<p style=\"margin: 0;\">Объявить любой сильный импульс, необычный сон или случайное событие сообщением сервитора. Так канал расширяется задним числом, а конструкция становится непроверяемой: если каждый шорох можно назвать ответом, ты уже не отличишь обратную связь от собственного ожидания.<\u002Fp>\n<\u002Fdiv>\n<div class=\"ex\">\n<span class=\"lbl acc\">Пример · Тенет<\u002Fspan>\n<p style=\"margin: 0;\">Тенет активируется только перед блоком. Основной канал — рабочая заметка: образ записывается, только если помогает точнее увидеть следующий шаг. Контакт сам он не инициирует и после фразы завершения не работает.<\u002Fp>\n<\u002Fdiv>\n<div class=\"note\" style=\"border-top: 1px solid var(--hair); padding-top: 11px;\">Если сервитор начинает требовать постоянного внимания, пугать или становиться эмоционально важнее результата — останови работу и закрой обращение.<\u002Fdiv>\n<\u002Fdiv>\n<div class=\"ft\"><span>Шаг 12 · Канал связи<\u002Fspan><span>@levorules<\u002Fspan><span class=\"pg\"><\u002Fspan><\u002Fdiv>\n<\u002Fsection>\n\n<section class=\"page\" data-screen-label=\"29 Шаг 12 поля\" style=\"--acc: oklch(0.47 0.1 325); --acc2: oklch(0.6 0.08 325);\">\n<div class=\"hd\"><span>Часть I · Черновик<\u002Fspan><span><b>Шаг 12<\u002Fb> · Поля<\u002Fspan><\u002Fdiv>\n<div class=\"stepline\"><div class=\"gly\"><span style=\"display:grid;gap:3px;justify-items:start\"><span style=\"width:7px;height:1.5px;background:var(--acc)\"><\u002Fspan><span style=\"width:12px;height:1.5px;background:var(--acc)\"><\u002Fspan><span style=\"width:17px;height:1.5px;background:var(--acc)\"><\u002Fspan><\u002Fspan><\u002Fdiv><div class=\"step\" style=\"margin: 0;\">Заполни<\u002Fdiv><\u002Fdiv>\n<h1>Уровень, канал и время связи<\u002Fh1>\n<p class=\"lede\">Если сервитор может обратиться когда угодно, через что угодно и сразу потребовать действия — канал связи пока не определён.<\u002Fp>\n<div class=\"stack\" style=\"gap: 16px;\">\n<div class=\"rulebox\">\n<span class=\"lbl acc\">Уровень автономии<\u002Fspan>\n<div class=\"chkrow\" style=\"margin-bottom: 12px;\">\n<label class=\"chk\"><i><\u002Fi><span>A0<\u002Fspan><\u002Flabel><label class=\"chk\"><i><\u002Fi><span>A1<\u002Fspan><\u002Flabel><label class=\"chk\"><i><\u002Fi><span>A2<\u002Fspan><\u002Flabel><label class=\"chk\"><i><\u002Fi><span>A3<\u002Fspan><\u002Flabel>\n<\u002Fdiv>\n<div class=\"f\" style=\"margin: 0;\"><span class=\"lbl\">Я выбрал этот уровень, потому что<\u002Fspan><div class=\"wr wr2\"><\u002Fdiv><div class=\"wr wr2\"><\u002Fdiv><\u002Fdiv>\n<\u002Fdiv>\n<div class=\"cols\">\n<div class=\"f\" style=\"margin: 0;\"><span class=\"lbl\">Сервитор работает<\u002Fspan><div class=\"chkrow\" style=\"padding-top: 4px;\"><label class=\"chk\"><i><\u002Fi><span>Только во время обращения<\u002Fspan><\u002Flabel><label class=\"chk\"><i><\u002Fi><span>Между обращениями<\u002Fspan><\u002Flabel><\u002Fdiv><\u002Fdiv>\n<div class=\"f\" style=\"margin: 0;\"><span class=\"lbl\">Может ли он инициировать контакт<\u002Fspan><div class=\"chkrow\" style=\"padding-top: 4px;\"><label class=\"chk\"><i><\u002Fi><span>Нет<\u002Fspan><\u002Flabel><label class=\"chk\"><i><\u002Fi><span>Да, при условиях ниже<\u002Fspan><\u002Flabel><\u002Fdiv><\u002Fdiv>\n<\u002Fdiv>\n<div class=\"f\"><span class=\"lbl\">Если да — по каким признакам я пойму, что контакт инициирован сервитором<\u002Fspan><div class=\"wr wr3\"><\u002Fdiv><\u002Fdiv>\n<div class=\"cols\">\n<div class=\"f\" style=\"margin: 0;\"><span class=\"lbl acc\">Основной канал связи<\u002Fspan><div class=\"ln\"><\u002Fdiv><\u002Fdiv>\n<div class=\"f\" style=\"margin: 0;\"><span class=\"lbl\">Дополнительный (если нужен)<\u002Fspan><div class=\"ln\"><\u002Fdiv><\u002Fdiv>\n<div class=\"f\" style=\"margin: 0;\"><span class=\"lbl\">Я принимаю как возможную обратную связь<\u002Fspan><div class=\"wr wr3\"><\u002Fdiv><\u002Fdiv>\n<div class=\"f\" style=\"margin: 0;\"><span class=\"lbl\">Я не считаю обратной связью<\u002Fspan><div class=\"wr wr3\"><\u002Fdiv><\u002Fdiv>\n<\u002Fdiv>\n<div class=\"cols3\">\n<div class=\"f\" style=\"margin: 0;\"><span class=\"lbl\">Связь допустима<\u002Fspan><div class=\"ln\"><\u002Fdiv><\u002Fdiv>\n<div class=\"f\" style=\"margin: 0;\"><span class=\"lbl\">Канал закрыт<\u002Fspan><div class=\"ln\"><\u002Fdiv><\u002Fdiv>\n<div class=\"f\" style=\"margin: 0;\"><span class=\"lbl\">Решения принимаю<\u002Fspan><div class=\"ln\"><\u002Fdiv><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<div class=\"ft\"><span>Шаг 12 · Поля<\u002Fspan><span>@levorules<\u002Fspan><span class=\"pg\"><\u002Fspan><\u002Fdiv>\n<\u002Fsection>\n\n<section class=\"page\" data-screen-label=\"30 Шаг 13 питание\" style=\"--acc: oklch(0.47 0.1 350); --acc2: oklch(0.6 0.08 350);\">\n<div class=\"hd\"><span>Часть I · Черновик<\u002Fspan><span><b>Шаг 13<\u002Fb> · Питание<\u002Fspan><\u002Fdiv>\n<div class=\"stepline\"><div class=\"gly\"><span style=\"width:17px;height:17px;border:1.5px dashed var(--acc);border-radius:50%;display:block\"><\u002Fspan><\u002Fdiv><div class=\"step\" style=\"margin: 0;\">Шаг 13 · Питание<\u002Fdiv><\u002Fdiv>\n<h1>Как поддерживать сервитора и не завести манипулятора<\u002Fh1>\n<p class=\"lede\">Питание — это заранее выбранное действие, которое поддерживает связь с сервитором и возвращает внимание к его функции. Если обслуживание помощника требует больше времени и сил, чем задача, <span class=\"hl\">ты незаметно создал себе ещё одного начальника<\u002Fspan>.<\u002Fp>\n<div class=\"stack\">\n<div>\n<span class=\"lbl\">Четыре параметра · задай их до запуска<\u002Fspan>\n<div style=\"display: grid; grid-template-columns: 1fr 1fr; gap: 1px; background: var(--rule); border: 1px solid var(--rule);\">\n<div style=\"background: oklch(0.968 0.014 85); padding: 12px 15px;\"><div class=\"num\" style=\"margin-bottom: 4px;\">01 · Источник<\u002Fdiv><span style=\"color: var(--soft);\">Какое действие считается питанием.<\u002Fspan><\u002Fdiv>\n<div style=\"background: oklch(0.968 0.014 85); padding: 12px 15px;\"><div class=\"num\" style=\"margin-bottom: 4px;\">02 · Ритм<\u002Fdiv><span style=\"color: var(--soft);\">После какого события или с какой частотой оно происходит.<\u002Fspan><\u002Fdiv>\n<div style=\"background: oklch(0.968 0.014 85); padding: 12px 15px;\"><div class=\"num\" style=\"margin-bottom: 4px;\">03 · Лимит<\u002Fdiv><span style=\"color: var(--soft);\">Сколько времени, ресурсов и внимания ты готов на это тратить.<\u002Fspan><\u002Fdiv>\n<div style=\"background: oklch(0.968 0.014 85); padding: 12px 15px;\"><div class=\"num\" style=\"margin-bottom: 4px;\">04 · Пропуск<\u002Fdiv><span style=\"color: var(--soft);\">Что происходит, если питание не состоялось.<\u002Fspan><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<div class=\"cols\">\n<div>\n<h2>Выбери понятный источник<\u002Fh2>\n<p>Несколько минут направленного внимания, короткая медитация, свеча или благовоние, символическое подношение, прикосновение к анкеру, повторение сигилы, завершённое обычное действие, зафиксированный результат работы.<\u002Fp>\n<p style=\"margin: 0;\">Не выбирай источник только потому, что он выглядит магичнее. Для рабочего проекта завершённый блок обычно логичнее часовой церемонии и внезапного желания заказать ещё один специальный подсвечник.<\u002Fp>\n<\u002Fdiv>\n<div>\n<h2>Определи событие, а не настроение<\u002Fh2>\n<p>Фраза «я питаю сервитора, когда чувствую, что ему это нужно» ничего не определяет: непонятно, кто решил, что это нужно, по каким признакам и когда можно остановиться.<\u002Fp>\n<p style=\"margin: 0;\">Привяжи питание к событию, которое можно назвать и записать: после завершённого блока, после полученного результата, во время плановой активации, раз в неделю при проверке журнала.<\u002Fp>\n<\u002Fdiv>\n<\u002Fdiv>\n<div class=\"rulebox\">\n<span class=\"lbl acc\">Сначала действие, потом подкрепление<\u002Fspan>\n<p style=\"margin: 0;\">Питание не должно заменять обычную работу. Если сервитор создан для проекта, сначала выполняется рабочий блок, затем отмечается результат и только после этого происходит короткое подкрепление. Иначе можно очень старательно питать конструкцию, которая якобы помогает. Кстати, в такой галлюцинации сервитор может быть крайне похож на нейросетку.<\u002Fp>\n<\u002Fdiv>\n<\u002Fdiv>\n<div class=\"ft\"><span>Шаг 13 · Питание<\u002Fspan><span>@levorules<\u002Fspan><span class=\"pg\"><\u002Fspan><\u002Fdiv>\n<\u002Fsection>\n\n<section class=\"page\" data-screen-label=\"31 Шаг 13 цена\" style=\"--acc: oklch(0.47 0.1 350); --acc2: oklch(0.6 0.08 350);\">\n<div class=\"hd\"><span>Часть I · Черновик<\u002Fspan><span><b>Шаг 13<\u002Fb> · Цена обслуживания<\u002Fspan><\u002Fdiv>\n<div class=\"stepline\"><div class=\"gly\"><span style=\"width:17px;height:17px;border:1.5px dashed var(--acc);border-radius:50%;display:block\"><\u002Fspan><\u002Fdiv><div class=\"step\" style=\"margin: 0;\">Шаг 13 · Цена обслуживания<\u002Fdiv><\u002Fdiv>\n<h1>Что происходит при пропуске?<\u002Fh1>\n<p class=\"lede\">Пропуск — это информация о том, что ритм оказался неудобным. <span class=\"hl\">Это повод пересмотреть правило, а не наказать себя.<\u002Fspan><\u002Fp>\n<div class=\"stack\">\n<div class=\"cols\">\n<div>\n<h2>Без героизма<\u002Fh2>\n<p>Если ты пропустил питание, сервитор не получает право требовать компенсацию, усиливать воздействие или привлекать внимание неприятными способами. Не нужно на следующий день выполнять двойной ритуал, отдавать больше времени или придумывать наказание самому себе.<\u002Fp>\n<p style=\"margin: 0;\">Заранее выбери простой вариант: перенести питание на следующее плановое время; пропустить без компенсации; временно приостановить работу; завершить конструкцию, если пропуски стали постоянными.<\u002Fp>\n<\u002Fdiv>\n<div>\n<div class=\"warn\">\n<span class=\"lbl\">Дурацкая ошибка<\u002Fspan>\n<p style=\"color: var(--ink); font-style: italic;\">Пообещать сервитору постоянное внимание или питание «всякий раз, когда он попросит».<\u002Fp>\n<p style=\"margin: 0;\">Такое правило не имеет ни ритма, ни лимита, ни понятного завершения. Любую усталость, тревогу или навязчивую мысль потом можно принять за требование конструкции.<\u002Fp>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<div class=\"rulebox\" style=\"border-color: var(--acc2);\">\n<span class=\"lbl acc\">Безопасность · это не обсуждается<\u002Fspan>\n<p>Кровь, самоповреждение, отказ от сна, еды, лекарств или необходимой медицинской помощи для питания не нужны. Подтверждённого преимущества у таких действий нет, а обычный риск вполне настоящий. Если для символа требуется красный цвет — человечество давно изобрело пигмент. Даже нескольких видов.<\u002Fp>\n<p style=\"margin: 0;\"><span class=\"hl\">Питание должно быть безопасным, ограниченным и добровольным.<\u002Fspan> Оно не должно вызывать страх, чувство долга или ощущение, что остановиться уже нельзя. Сервитор не должен напоминать о себе угрозами, неприятными ощущениями или чувством вины. Если практика начинает так восприниматься — останови обращение и пересмотри правила.<\u002Fp>\n<\u002Fdiv>\n<div class=\"ex\">\n<span class=\"lbl acc\">Пример · Тенет<\u002Fspan>\n<p>Питанием становится завершённый рабочий блок. После блока я записываю, какой фрагмент закончен, касаюсь латунного зажима и на несколько секунд представляю: боковой храповик поворачивается на один зуб, на корешке появляется один новый красный стежок. Вся последовательность занимает не больше двух минут.<\u002Fp>\n<p style=\"margin: 0;\">Если блок не состоялся, питания в этот день нет: пропуск не создаёт долга и не требует двойного действия. Раз в неделю я просматриваю журнал — если блоки регулярно пропускаются, пересматриваю расписание или приостанавливаю работу Тенета.<\u002Fp>\n<\u002Fdiv>\n<\u002Fdiv>\n<div class=\"ft\"><span>Шаг 13 · Цена обслуживания<\u002Fspan><span>@levorules<\u002Fspan><span class=\"pg\"><\u002Fspan><\u002Fdiv>\n<\u002Fsection>\n\n<section class=\"page\" data-screen-label=\"32 Шаг 13 поля\" style=\"--acc: oklch(0.47 0.1 350); --acc2: oklch(0.6 0.08 350);\">\n<div class=\"hd\"><span>Часть I · Черновик<\u002Fspan><span><b>Шаг 13<\u002Fb> · Поля<\u002Fspan><\u002Fdiv>\n<div class=\"stepline\"><div class=\"gly\"><span style=\"width:17px;height:17px;border:1.5px dashed var(--acc);border-radius:50%;display:block\"><\u002Fspan><\u002Fdiv><div class=\"step\" style=\"margin: 0;\">Заполни<\u002Fdiv><\u002Fdiv>\n<h1>Короткое правило питания<\u002Fh1>\n<p class=\"lede\">Если обслуживание требует больше внимания, чем сама задача — сократи ритуал или выбери другой источник.<\u002Fp>\n<div class=\"stack\" style=\"gap: 18px;\">\n<div class=\"cols\">\n<div class=\"f\" style=\"margin: 0;\"><span class=\"lbl acc\">Мой источник питания<\u002Fspan><div class=\"ln\"><\u002Fdiv><\u002Fdiv>\n<div class=\"f\" style=\"margin: 0;\"><span class=\"lbl\">Он связан с функцией, потому что<\u002Fspan><div class=\"ln\"><\u002Fdiv><\u002Fdiv>\n<div class=\"f\" style=\"margin: 0;\"><span class=\"lbl\">Питание происходит после<\u002Fspan><div class=\"ln\"><\u002Fdiv><\u002Fdiv>\n<div class=\"f\" style=\"margin: 0;\"><span class=\"lbl\">Частота<\u002Fspan><div class=\"ln\"><\u002Fdiv><\u002Fdiv>\n<div class=\"f\" style=\"margin: 0;\"><span class=\"lbl\">Одно действие занимает не больше<\u002Fspan><div class=\"ln\"><\u002Fdiv><\u002Fdiv>\n<div class=\"f\" style=\"margin: 0;\"><span class=\"lbl\">Лимит ресурсов<\u002Fspan><div class=\"ln\"><\u002Fdiv><\u002Fdiv>\n<\u002Fdiv>\n<div class=\"f\"><span class=\"lbl\">Если питание пропущено, то (без долга, наказания и двойной нагрузки)<\u002Fspan><div class=\"wr wr2\"><\u002Fdiv><div class=\"wr wr2\"><\u002Fdiv><\u002Fdiv>\n<div class=\"rulebox\">\n<span class=\"lbl acc\">Собранное правило<\u002Fspan>\n<div class=\"stack\" style=\"gap: 6px;\">\n<div style=\"display: grid; grid-template-columns: 60px 1fr; gap: 10px; align-items: baseline;\"><span class=\"note\">После<\u002Fspan><div class=\"ln\"><\u002Fdiv><\u002Fdiv>\n<div style=\"display: grid; grid-template-columns: 60px 1fr; gap: 10px; align-items: baseline;\"><span class=\"note\">я выполняю<\u002Fspan><div class=\"ln\"><\u002Fdiv><\u002Fdiv>\n<div style=\"display: grid; grid-template-columns: 60px 1fr; gap: 10px; align-items: baseline;\"><span class=\"note\">не дольше<\u002Fspan><div class=\"ln\"><\u002Fdiv><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<div class=\"rulebox\">\n<span class=\"lbl\">Проверь<\u002Fspan>\n<div class=\"cols\" style=\"gap: 10px 24px;\">\n<label class=\"chk\"><i><\u002Fi><span>Питание безопасно и добровольно.<\u002Fspan><\u002Flabel>\n<label class=\"chk\"><i><\u002Fi><span>Оно не заменяет обычную работу.<\u002Fspan><\u002Flabel>\n<label class=\"chk\"><i><\u002Fi><span>Пропуск не создаёт долга.<\u002Fspan><\u002Flabel>\n<label class=\"chk\"><i><\u002Fi><span>Ритуал короче, чем сама задача.<\u002Fspan><\u002Flabel>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<div class=\"ft\"><span>Шаг 13 · Поля<\u002Fspan><span>@levorules<\u002Fspan><span class=\"pg\"><\u002Fspan><\u002Fdiv>\n<\u002Fsection>\n\n<section class=\"page\" data-screen-label=\"33 Шаг 14 срок и тесты\" style=\"--acc: oklch(0.47 0.1 15); --acc2: oklch(0.6 0.08 15);\">\n<div class=\"hd\"><span>Часть I · Черновик<\u002Fspan><span><b>Шаг 14<\u002Fb> · Срок и тесты<\u002Fspan><\u002Fdiv>\n<div class=\"stepline\"><div class=\"gly\"><span style=\"width:16px;height:16px;border:1.5px solid var(--acc);border-left-width:5px;border-radius:50%;display:block\"><\u002Fspan><\u002Fdiv><div class=\"step\" style=\"margin: 0;\">Шаг 14 · Срок и тесты<\u002Fdiv><\u002Fdiv>\n<h1>Когда работа заканчивается?<\u002Fh1>\n<p class=\"lede\">Срок — это не предсказание того, сколько проживёт сервитор. Это граница, после которой ты останавливаешься и оцениваешь результат. Окончание задаётся до запуска.<\u002Fp>\n<div class=\"stack\">\n<div style=\"display: grid; grid-template-columns: repeat(4, 1fr); gap: 0; border-top: 1px solid var(--rule); border-bottom: 1px solid var(--rule); padding: 12px 0;\">\n<div style=\"border-right: 1px solid var(--hair); padding-right: 14px;\"><span class=\"lbl acc\">Старт<\u002Fspan><span style=\"color: var(--soft);\">Активация, первый рабочий блок<\u002Fspan><\u002Fdiv>\n<div style=\"border-right: 1px solid var(--hair); padding: 0 14px;\"><span class=\"lbl\">Первая неделя<\u002Fspan><span style=\"color: var(--soft);\">Три малых теста<\u002Fspan><\u002Fdiv>\n<div style=\"border-right: 1px solid var(--hair); padding: 0 14px;\"><span class=\"lbl\">Ревизия<\u002Fspan><span style=\"color: var(--soft);\">Проверка журнала по расписанию<\u002Fspan><\u002Fdiv>\n<div style=\"padding-left: 14px;\"><span class=\"lbl\">Окончание<\u002Fspan><span style=\"color: var(--soft);\">Дата, результат или решение не продлевать<\u002Fspan><\u002Fdiv>\n<\u002Fdiv>\n<div class=\"cols\">\n<div>\n<h2>Выбери понятный срок<\u002Fh2>\n<p>Фраза «пускай работает, пока нужен» ничего не значит: непонятно, кто решает, что необходимость закончилась, когда пересматриваются правила и что делать, если результата нет.<\u002Fp>\n<p>Сервитор может работать: до выполнения одного действия; до наступления определённой даты; в течение тестового периода; до получения заранее описанного результата; пока соблюдаются конкретные условия.<\u002Fp>\n<p style=\"margin: 0;\">Для первой конструкции лучше выбрать короткий срок. Нескольких недель обычно достаточно, чтобы проверить правила, заметить неудобства и не успеть превратить неработающую схему в традицию. Если задача рассчитана на месяцы, всё равно назначь ближайшую дату ревизии.<\u002Fp>\n<\u002Fdiv>\n<div>\n<h2>Сначала проведи малые тесты<\u002Fh2>\n<p>Не жди окончательного результата, чтобы впервые проверить конструкцию. Каждый тест отвечает на один вопрос и даёт наблюдаемый результат.<\u002Fp>\n<ul>\n<li><strong>Тест активации<\u002Fstrong> — можешь ли ты без подсказки начать и завершить обращение.<\u002Fli>\n<li><strong>Тест функции<\u002Fstrong> — происходит ли конкретное действие, ради которого создан сервитор.<\u002Fli>\n<li><strong>Тест границ<\u002Fstrong> — сохраняются ли запреты, лимиты и твоя ответственность за решения.<\u002Fli>\n<\u002Ful>\n<p style=\"margin: 0;\">Если сервитор возвращает внимание к ближайшему шагу — не жди публикации всего проекта. Проверь, удаётся ли в течение трёх блоков выбрать одну небольшую задачу и закончить конкретный фрагмент.<\u002Fp>\n<\u002Fdiv>\n<\u002Fdiv>\n<div class=\"rulebox\">\n<span class=\"lbl\">Что писать в журнал после каждого блока<\u002Fspan>\n<div class=\"cols3\" style=\"gap: 18px;\">\n<div><div class=\"num\" style=\"margin-bottom: 5px;\">01<\u002Fdiv><p style=\"margin: 0;\">Дата и факт: блок состоялся или нет.<\u002Fp><\u002Fdiv>\n<div><div class=\"num\" style=\"margin-bottom: 5px;\">02<\u002Fdiv><p style=\"margin: 0;\">Один конкретный результат: что закончено.<\u002Fp><\u002Fdiv>\n<div><div class=\"num\" style=\"margin-bottom: 5px;\">03<\u002Fdiv><p style=\"margin: 0;\">Что мешало и какой сценарий сработал.<\u002Fp><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<div class=\"warn\">\n<span class=\"lbl\">Важно<\u002Fspan>\n<p style=\"margin: 0;\"><span class=\"hl\">Не меняй одновременно имя, форму, команду, питание и половину запретов.<\u002Fspan> Иначе ты не поймёшь, какое решение помогло, а какое просто красиво лежало в паспорте.<\u002Fp>\n<\u002Fdiv>\n<\u002Fdiv>\n<div class=\"ft\"><span>Шаг 14 · Срок и тесты<\u002Fspan><span>@levorules<\u002Fspan><span class=\"pg\"><\u002Fspan><\u002Fdiv>\n<\u002Fsection>\n\n<section class=\"page\" data-screen-label=\"34 Шаг 14 завершение\" style=\"--acc: oklch(0.47 0.1 15); --acc2: oklch(0.6 0.08 15);\">\n<div class=\"hd\"><span>Часть I · Черновик<\u002Fspan><span><b>Шаг 14<\u002Fb> · Ревизия и завершение<\u002Fspan><\u002Fdiv>\n<div class=\"stepline\"><div class=\"gly\"><span style=\"width:16px;height:16px;border:1.5px solid var(--acc);border-left-width:5px;border-radius:50%;display:block\"><\u002Fspan><\u002Fdiv><div class=\"step\" style=\"margin: 0;\">Шаг 14 · Ревизия и завершение<\u002Fdiv><\u002Fdiv>\n<h1>Как закрыть работу?<\u002Fh1>\n<p class=\"lede\">Ревизия — заранее выбранный момент проверки записей: что действительно произошло, какие критерии выполнены, какие правила оказались неудобными, соблюдались ли границы, стоит ли продолжать.<\u002Fp>\n<div class=\"stack\">\n<div class=\"cols\">\n<div>\n<h2>Не суди по настроению<\u002Fh2>\n<p>Один удачный день ничего не доказывает, один плохой не отменяет накопленный результат. Смотри на журнал, выполненные действия и события, которые можно подтвердить.<\u002Fp>\n<div class=\"warn\" style=\"margin-top: 12px;\">\n<span class=\"lbl\">Частая ошибка<\u002Fspan>\n<p style=\"color: var(--ink); font-style: italic;\">Держать в голове: «Сервитор работает, пока не выполнит задачу».<\u002Fp>\n<p style=\"margin: 0;\">Если задача невозможна или потеряла смысл, конструкция формально остаётся активной навсегда, а отсутствие результата легко объявить «скрытой работой». Назначь дату ревизии и независимое от успеха условие остановки.<\u002Fp>\n<\u002Fdiv>\n<\u002Fdiv>\n<div>\n<h2>Продление — только отдельным решением<\u002Fh2>\n<p>Если срок закончился, сервитор не продолжает работу автоматически. Ты можешь завершить конструкцию, продлить её без изменений, переписать правило и назначить новый тест, приостановить работу или создать другую конструкцию для новой задачи.<\u002Fp>\n<p style=\"margin: 0;\">Продлению нужна новая дата ревизии. «Оставлю ещё ненадолго» — способ через год обнаружить легаси, документацию к которому писал нерадивый стажёр. Возможно, ты. Не продлевай работу из жалости к образу: сервитор создавался ради функции, а не бессрочной должности.<\u002Fp>\n<\u002Fdiv>\n<\u002Fdiv>\n<div class=\"cols\">\n<div class=\"rulebox\">\n<span class=\"lbl acc\">Плановое завершение<\u002Fspan>\n<p>Происходит, когда задача выполнена; наступила указанная дата или закончился пилот; функция больше не нужна; после ревизии ты решил не продлевать.<\u002Fp>\n<p style=\"margin: 0;\">Порядок: произнеси фразу окончательного завершения; зафиксируй дату и причину в журнале; прекрати активации и питание; отдели анкер от конструкции; убери, измени или уничтожь сигилу безопасным способом.<\u002Fp>\n<\u002Fdiv>\n<div class=\"rulebox\">\n<span class=\"lbl\">Срочная остановка<\u002Fspan>\n<p>Нужна, если сервитор воспринимается как источник угроз или наказания; усиливаются тревога или чувство вины; нарушаются сон, здоровье, безопасность; границы и собственные решения перестали различаться.<\u002Fp>\n<p style=\"margin: 0;\">Достаточно твоего решения. Не нужно ждать разрешения сервитора, подходящей фазы Луны или ещё какой-нибудь знаковой хрени.<\u002Fp>\n<\u002Fdiv>\n<\u002Fdiv>\n<div class=\"card\">\n<p style=\"margin: 0;\">Необязательно сжигать предмет и устраивать драматичное прощание. Можно удалить файл, перечеркнуть сигилу или убрать паспорт в архив. Записи о результатах сохрани: завершение не требует уничтожать память о работе. Важно вычеркнуть сервитора из головы. <span class=\"hl\"><strong>Завершение неработающей конструкции — часть управления.<\u002Fstrong><\u002Fspan><\u002Fp>\n<\u002Fdiv>\n<\u002Fdiv>\n<div class=\"ft\"><span>Шаг 14 · Ревизия и завершение<\u002Fspan><span>@levorules<\u002Fspan><span class=\"pg\"><\u002Fspan><\u002Fdiv>\n<\u002Fsection>\n\n\n\n<section class=\"page\" data-screen-label=\"35 Шаг 14 поля\" style=\"--acc: oklch(0.47 0.1 15); --acc2: oklch(0.6 0.08 15);\">\n<div class=\"hd\"><span>Часть I · Черновик<\u002Fspan><span><b>Шаг 14<\u002Fb> · Поля<\u002Fspan><\u002Fdiv>\n<div class=\"stepline\"><div class=\"gly\"><span style=\"width:16px;height:16px;border:1.5px solid var(--acc);border-left-width:5px;border-radius:50%;display:block\"><\u002Fspan><\u002Fdiv><div class=\"step\" style=\"margin: 0;\">Заполни<\u002Fdiv><\u002Fdiv>\n<h1>Срок, тесты, выход<\u002Fh1>\n<p class=\"lede\">Все поля должны оставаться понятными, даже если желаемый результат не появился.<\u002Fp>\n<div class=\"stack\" style=\"gap: 16px;\">\n<div class=\"cols3\">\n<div class=\"f\" style=\"margin: 0;\"><span class=\"lbl\">Начало работы<\u002Fspan><div class=\"ln\"><\u002Fdiv><\u002Fdiv>\n<div class=\"f\" style=\"margin: 0;\"><span class=\"lbl\">Первая ревизия<\u002Fspan><div class=\"ln\"><\u002Fdiv><\u002Fdiv>\n<div class=\"f\" style=\"margin: 0;\"><span class=\"lbl\">Окончание<\u002Fspan><div class=\"ln\"><\u002Fdiv><\u002Fdiv>\n<\u002Fdiv>\n<div class=\"rulebox\">\n<span class=\"lbl acc\">Три малых теста<\u002Fspan>\n<div class=\"stack\" style=\"gap: 10px;\">\n<div style=\"display: grid; grid-template-columns: 118px 1fr 1fr; gap: 12px; align-items: baseline;\"><span class=\"note\">Тест активации<\u002Fspan><div><span class=\"lbl\">Я проверяю<\u002Fspan><div class=\"ln\"><\u002Fdiv><\u002Fdiv><div><span class=\"lbl\">Успешный результат<\u002Fspan><div class=\"ln\"><\u002Fdiv><\u002Fdiv><\u002Fdiv>\n<div style=\"display: grid; grid-template-columns: 118px 1fr 1fr; gap: 12px; align-items: baseline;\"><span class=\"note\">Тест функции<\u002Fspan><div><span class=\"lbl\">Я проверяю<\u002Fspan><div class=\"ln\"><\u002Fdiv><\u002Fdiv><div><span class=\"lbl\">Успешный результат<\u002Fspan><div class=\"ln\"><\u002Fdiv><\u002Fdiv><\u002Fdiv>\n<div style=\"display: grid; grid-template-columns: 118px 1fr 1fr; gap: 12px; align-items: baseline;\"><span class=\"note\">Тест границ<\u002Fspan><
