div><span class=\"lbl\">Я проверяю<\u002Fspan><div class=\"ln\"><\u002Fdiv><\u002Fdiv><div><span class=\"lbl\">Успешный результат<\u002Fspan><div class=\"ln\"><\u002Fdiv><\u002Fdiv><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<div class=\"cols\">\n<div class=\"f\" style=\"margin: 0;\"><span class=\"lbl\">Во время ревизии я проверяю<\u002Fspan><div class=\"wr wr3\"><\u002Fdiv><\u002Fdiv>\n<div class=\"f\" style=\"margin: 0;\"><span class=\"lbl\">Работа продлевается, только если<\u002Fspan><div class=\"wr wr3\"><\u002Fdiv><\u002Fdiv>\n<div class=\"f\" style=\"margin: 0;\"><span class=\"lbl\">Работа завершается, когда<\u002Fspan><div class=\"wr wr3\"><\u002Fdiv><\u002Fdiv>\n<div class=\"f\" style=\"margin: 0;\"><span class=\"lbl\">Я сразу останавливаю работу, если<\u002Fspan><div class=\"wr wr3\"><\u002Fdiv><\u002Fdiv>\n<\u002Fdiv>\n<div class=\"cols\">\n<div class=\"f\" style=\"margin: 0;\"><span class=\"lbl\">Фраза завершения<\u002Fspan><div class=\"ln\"><\u002Fdiv><div class=\"ln\"><\u002Fdiv><div class=\"ln\"><\u002Fdiv><\u002Fdiv>\n<div class=\"f\" style=\"margin: 0;\"><span class=\"lbl\">После неё я<\u002Fspan><div class=\"ln\"><\u002Fdiv><div class=\"ln\"><\u002Fdiv><div class=\"ln\"><\u002Fdiv><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<div class=\"ft\"><span>Шаг 14 · Поля<\u002Fspan><span>@levorules<\u002Fspan><span class=\"pg\"><\u002Fspan><\u002Fdiv>\n<\u002Fsection><section class=\"page\" data-screen-label=\"36 Чистовой титул\" style=\"--acc: oklch(0.47 0.1 30); --acc2: oklch(0.6 0.08 30);\">\n<div class=\"hd\"><span>Часть II<\u002Fspan><span>Чистовой паспорт<\u002Fspan><\u002Fdiv>\n<div class=\"stepline\"><div class=\"gly\"><span style=\"width:17px;height:17px;border:1.5px solid var(--acc);border-radius:50%;display:block;position:relative\"><span style=\"position:absolute;inset:5px;background:var(--acc);border-radius:50%\"><\u002Fspan><\u002Fspan><\u002Fdiv><div class=\"step\" style=\"margin: 0;\">Часть II<\u002Fdiv><\u002Fdiv>\n<h1 style=\"font-size: 58px; margin-bottom: 22px;\">Чистовой паспорт<\u002Fh1>\n<p class=\"lede\" style=\"font-size: 20px; margin-bottom: 26px;\">Двенадцать страниц, на которые переносятся только окончательные формулировки. Если ответ не помещается — сначала попробуй его сократить: паспорт должен быстро напоминать правила, а не пересказывать весь гайд.<\u002Fp>\n<div class=\"stack\" style=\"gap: 24px;\">\n<div class=\"cols\">\n<div class=\"card\">\n<span class=\"lbl\">Что здесь заполняется<\u002Fspan>\n<ul style=\"margin: 0;\">\n<li>проблема, задача и границы;<\u002Fli>\n<li>функция, область и критерии;<\u002Fli>\n<li>обычные действия и сценарии;<\u002Fli>\n<li>имя, сигила, форма, анкер;<\u002Fli>\n<li>автономия и канал связи;<\u002Fli>\n<li>разрешения, запреты, правила;<\u002Fli>\n<li>питание, тесты, завершение.<\u002Fli>\n<\u002Ful>\n<\u002Fdiv>\n<div class=\"rulebox\">\n<span class=\"lbl acc\">Правило переноса<\u002Fspan>\n<p>Переноси формулировку только тогда, когда она прошла проверку на странице шага. Черновик остаётся черновиком: в нём можно спорить с собой, здесь — уже нет.<\u002Fp>\n<p style=\"margin: 0;\">Оставь дату заполнения. Через месяц она объяснит больше, чем кажется сейчас.<\u002Fp>\n<\u002Fdiv>\n<\u002Fdiv>\n<div class=\"rulebox\">\n<span class=\"lbl\">Что проверить перед переносом<\u002Fspan>\n<div class=\"cols\" style=\"gap: 10px 24px;\">\n<label class=\"chk\"><i><\u002Fi><span>Каждая формулировка прошла проверку на своём шаге.<\u002Fspan><\u002Flabel>\n<label class=\"chk\"><i><\u002Fi><span>Ни одно поле не противоречит другому.<\u002Fspan><\u002Flabel>\n<label class=\"chk\"><i><\u002Fi><span>Всё, что нельзя проверить, убрано.<\u002Fspan><\u002Flabel>\n<label class=\"chk\"><i><\u002Fi><span>Границы и сроки записаны конкретно.<\u002Fspan><\u002Flabel>\n<\u002Fdiv>\n<\u002Fdiv>\n<p class=\"pull\">Заполненный паспорт не окончателен: его переписывают после ревизии — но только отдельным решением и с новой датой.<\u002Fp>\n<div class=\"cols\">\n<div class=\"f\" style=\"margin: 0;\"><span class=\"lbl\">Паспорт заполнен · дата<\u002Fspan><div class=\"ln\"><\u002Fdiv><\u002Fdiv>\n<div class=\"f\" style=\"margin: 0;\"><span class=\"lbl\">Версия конструкции<\u002Fspan><div class=\"ln\"><\u002Fdiv><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<div class=\"ft\"><span>Часть II · Чистовой паспорт<\u002Fspan><span>@levorules<\u002Fspan><span class=\"pg\"><\u002Fspan><\u002Fdiv>\n<\u002Fsection>\n\n<section class=\"page\" data-screen-label=\"37 Чистовой: задача\" style=\"--acc: oklch(0.47 0.1 55); --acc2: oklch(0.6 0.08 55);\">\n<div class=\"hd\"><span>Чистовой паспорт<\u002Fspan><span>01 · Проблема и задача<\u002Fspan><\u002Fdiv>\n<div class=\"stepline\"><div class=\"gly\"><span style=\"display:flex;align-items:center\"><span style=\"width:14px;height:1.5px;background:var(--acc)\"><\u002Fspan><span style=\"width:7px;height:7px;border-top:1.5px solid var(--acc);border-right:1.5px solid var(--acc);transform:rotate(45deg);margin-left:-5px\"><\u002Fspan><\u002Fspan><\u002Fdiv><div class=\"step\" style=\"margin: 0;\">01 · Проблема и задача<\u002Fdiv><\u002Fdiv>\n<h1>Исходная проблема и задача<\u002Fh1>\n<div class=\"stack\" style=\"gap: 18px;\">\n<div class=\"rulebox\">\n<span class=\"lbl\">Исходная проблема<\u002Fspan>\n<div class=\"cols\" style=\"margin-bottom: 10px;\">\n<div class=\"f\" style=\"margin: 0;\"><span class=\"lbl\">Что происходит сейчас<\u002Fspan><div class=\"wr wr2\"><\u002Fdiv><div class=\"wr wr2\"><\u002Fdiv><\u002Fdiv>\n<div class=\"f\" style=\"margin: 0;\"><span class=\"lbl\">Как давно это продолжается<\u002Fspan><div class=\"wr wr2\"><\u002Fdiv><div class=\"wr wr2\"><\u002Fdiv><\u002Fdiv>\n<\u002Fdiv>\n<div class=\"f\" style=\"margin: 0;\"><span class=\"lbl\">Чем это мне мешает<\u002Fspan><div class=\"wr wr2\"><\u002Fdiv><\u002Fdiv>\n<\u002Fdiv>\n<div class=\"rulebox\" style=\"border-color: var(--acc2);\">\n<span class=\"lbl acc\">Окончательная формулировка задачи<\u002Fspan>\n<div style=\"display: flex; align-items: baseline; gap: 10px;\"><span style=\"color: var(--soft); white-space: nowrap;\">До<\u002Fspan><span style=\"flex: 1; border-bottom: 1px solid var(--rule); height: 26px;\"><\u002Fspan><span style=\"color: var(--soft); white-space: nowrap;\">года мой сервитор помогает мне<\u002Fspan><\u002Fdiv>\n<div class=\"wr wr3\"><\u002Fdiv>\n<\u002Fdiv>\n<div class=\"cols\">\n<div class=\"f\" style=\"margin: 0;\"><span class=\"lbl\">Наблюдаемый результат<\u002Fspan><div class=\"wr wr2\"><\u002Fdiv><\u002Fdiv>\n<div class=\"f\" style=\"margin: 0;\"><span class=\"lbl\">Срок получения результата<\u002Fspan><div class=\"wr wr2\"><\u002Fdiv><\u002Fdiv>\n<div class=\"f\" style=\"margin: 0;\"><span class=\"lbl\">Что я делаю сам<\u002Fspan><div class=\"wr wr2\"><\u002Fdiv><\u002Fdiv>\n<div class=\"f\" style=\"margin: 0;\"><span class=\"lbl\">Границы задачи<\u002Fspan><div class=\"wr wr2\"><\u002Fdiv><\u002Fdiv>\n<\u002Fdiv>\n<div class=\"f\" style=\"margin: 0;\"><span class=\"lbl\">Сервитор не выходит за следующие границы<\u002Fspan><div class=\"wr wr2\"><\u002Fdiv><\u002Fdiv>\n<\u002Fdiv>\n<div class=\"ft\"><span>Чистовой паспорт · 01<\u002Fspan><span>@levorules<\u002Fspan><span class=\"pg\"><\u002Fspan><\u002Fdiv>\n<\u002Fsection>\n\n<section class=\"page\" data-screen-label=\"38 Чистовой: функция\" style=\"--acc: oklch(0.47 0.1 120); --acc2: oklch(0.6 0.08 120);\">\n<div class=\"hd\"><span>Чистовой паспорт<\u002Fspan><span>02 · Функция и критерии<\u002Fspan><\u002Fdiv>\n<div class=\"stepline\"><div class=\"gly\"><span style=\"width:17px;height:17px;border:1.5px solid var(--acc);position:relative;display:block\"><span style=\"position:absolute;left:50%;top:0;bottom:0;width:1.5px;background:var(--acc)\"><\u002Fspan><\u002Fspan><\u002Fdiv><div class=\"step\" style=\"margin: 0;\">02 · Функция и критерии<\u002Fdiv><\u002Fdiv>\n<h1>Функция, область, критерии успеха<\u002Fh1>\n<div class=\"stack\" style=\"gap: 18px;\">\n<div class=\"rulebox\">\n<span class=\"lbl acc\">Основная функция<\u002Fspan>\n<div style=\"display: flex; align-items: baseline; gap: 10px;\"><span style=\"color: var(--soft); white-space: nowrap;\">Мой сервитор<\u002Fspan><span style=\"flex: 1; border-bottom: 1px solid var(--rule); height: 26px;\"><\u002Fspan><\u002Fdiv>\n<div class=\"wr wr2\"><\u002Fdiv>\n<\u002Fdiv>\n<div>\n<span class=\"lbl\">Основная область<\u002Fspan>\n<div class=\"chkrow\" style=\"margin-bottom: 10px;\">\n<label class=\"chk\"><i><\u002Fi><span>Материальная<\u002Fspan><\u002Flabel>\n<label class=\"chk\"><i><\u002Fi><span>Информационная<\u002Fspan><\u002Flabel>\n<label class=\"chk\"><i><\u002Fi><span>Психическая<\u002Fspan><\u002Flabel>\n<\u002Fdiv>\n<div class=\"cols\">\n<div class=\"f\" style=\"margin: 0;\"><span class=\"lbl\">Почему эта область связана с задачей<\u002Fspan><div class=\"wr wr2\"><\u002Fdiv><\u002Fdiv>\n<div class=\"f\" style=\"margin: 0;\"><span class=\"lbl\">Дополнительная область и зачем она<\u002Fspan><div class=\"wr wr2\"><\u002Fdiv><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<div class=\"f\" style=\"margin: 0;\"><span class=\"lbl\">В работу сервитора не входят<\u002Fspan><div class=\"ln\"><\u002Fdiv><div class=\"ln\"><\u002Fdiv><div class=\"ln\"><\u002Fdiv><\u002Fdiv>\n<div class=\"rulebox\" style=\"border-color: var(--acc2);\">\n<span class=\"lbl acc\">Итоговый критерий<\u002Fspan>\n<div class=\"wr wr2\"><\u002Fdiv>\n<\u002Fdiv>\n<div>\n<span class=\"lbl\">Три ранних признака<\u002Fspan>\n<div class=\"stack\" style=\"gap: 7px;\">\n<div style=\"display: grid; grid-template-columns: 26px 1fr; gap: 10px; align-items: baseline;\"><span class=\"num\">01<\u002Fspan><div class=\"ln\"><\u002Fdiv><\u002Fdiv>\n<div style=\"display: grid; grid-template-columns: 26px 1fr; gap: 10px; align-items: baseline;\"><span class=\"num\">02<\u002Fspan><div class=\"ln\"><\u002Fdiv><\u002Fdiv>\n<div style=\"display: grid; grid-template-columns: 26px 1fr; gap: 10px; align-items: baseline;\"><span class=\"num\">03<\u002Fspan><div class=\"ln\"><\u002Fdiv><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<div class=\"note\" style=\"border-top: 1px solid var(--hair); padding-top: 11px;\">Критерии описывают то, что можно увидеть, записать, посчитать или подтвердить конкретным событием.<\u002Fdiv>\n<\u002Fdiv>\n<div class=\"ft\"><span>Чистовой паспорт · 02<\u002Fspan><span>@levorules<\u002Fspan><span class=\"pg\"><\u002Fspan><\u002Fdiv>\n<\u002Fsection>\n\n<section class=\"page\" data-screen-label=\"39 Чистовой: действия\" style=\"--acc: oklch(0.47 0.1 85); --acc2: oklch(0.6 0.08 85);\">\n<div class=\"hd\"><span>Чистовой паспорт<\u002Fspan><span>03 · Действия и сценарии<\u002Fspan><\u002Fdiv>\n<div class=\"stepline\"><div class=\"gly\"><span style=\"display:grid;gap:4px\"><span style=\"width:18px;height:1.5px;background:var(--acc);display:block\"><\u002Fspan><span style=\"width:18px;height:1.5px;background:var(--acc);display:block\"><\u002Fspan><span style=\"width:18px;height:1.5px;background:var(--acc);display:block\"><\u002Fspan><\u002Fspan><\u002Fdiv><div class=\"step\" style=\"margin: 0;\">03 · Действия и сценарии<\u002Fdiv><\u002Fdiv>\n<h1>Мои обычные действия<\u002Fh1>\n<div class=\"stack\" style=\"gap: 18px;\">\n<div>\n<span class=\"lbl\">Что я регулярно делаю сам · четыре пункта<\u002Fspan>\n<div class=\"stack\" style=\"gap: 11px;\">\n<div style=\"display: grid; grid-template-columns: 26px 1fr; gap: 10px; align-items: start;\"><span class=\"num\" style=\"margin-top: 22px;\">01<\u002Fspan><div class=\"wr wr2\"><\u002Fdiv><\u002Fdiv>\n<div style=\"display: grid; grid-template-columns: 26px 1fr; gap: 10px; align-items: start;\"><span class=\"num\" style=\"margin-top: 22px;\">02<\u002Fspan><div class=\"wr wr2\"><\u002Fdiv><\u002Fdiv>\n<div style=\"display: grid; grid-template-columns: 26px 1fr; gap: 10px; align-items: start;\"><span class=\"num\" style=\"margin-top: 22px;\">03<\u002Fspan><div class=\"wr wr2\"><\u002Fdiv><\u002Fdiv>\n<div style=\"display: grid; grid-template-columns: 26px 1fr; gap: 10px; align-items: start;\"><span class=\"num\" style=\"margin-top: 22px;\">0 lass=\"stepline\"><div class=\"gly\"><span style=\"display:flex;gap:4px\"><span style=\"width:5px;height:5px;border-radius:50%;background:var(--acc)\"><\u002Fspan><span style=\"width:5px;height:5px;border-radius:50%;background:var(--acc)\"><\u002Fspan><span style=\"width:5px;height:5px;border-radius:50%;background:var(--acc)\"><\u002Fspan><\u002Fspan><\u002Fdiv><div class=\"step\" style=\"margin: 0;\">08 · Разрешения и запреты<\u002Fdiv><\u002Fdiv>\n<h1>Что разрешено и что запрещено<\u002Fh1>\n<p class=\"lede\">Каждый пункт поддерживает выбранную функцию и остаётся внутри установленной области работы.<\u002Fp>\n<div class=\"cols\" style=\"gap: 26px;\">\n<div>\n<span class=\"lbl acc\">Разрешено<\u002Fspan>\n<div class=\"stack\" style=\"gap: 22px;\">\n<div style=\"display: grid; grid-template-columns: 26px 1fr; gap: 10px; align-items: start;\"><span class=\"num\" style=\"margin-top: 22px;\">01<\u002Fspan><div class=\"wr wr2\"><\u002Fdiv><\u002Fdiv>\n<div style=\"display: grid; grid-template-columns: 26px 1fr; gap: 10px; align-items: start;\"><span class=\"num\" style=\"margin-top: 22px;\">02<\u002Fspan><div class=\"wr wr2\"><\u002Fdiv><\u002Fdiv>\n<div style=\"display: grid; grid-template-columns: 26px 1fr; gap: 10px; align-items: start;\"><span class=\"num\" style=\"margin-top: 22px;\">03<\u002Fspan><div class=\"wr wr2\"><\u002Fdiv><\u002Fdiv>\n<div style=\"display: grid; grid-template-columns: 26px 1fr; gap: 10px; align-items: start;\"><span class=\"num\" style=\"margin-top: 22px;\">04<\u002Fspan><div class=\"wr wr2\"><\u002Fdiv><\u002Fdiv>\n<div style=\"display: grid; grid-template-columns: 26px 1fr; gap: 10px; align-items: start;\"><span class=\"num\" style=\"margin-top: 22px;\">05<\u002Fspan><div class=\"wr wr2\"><\u002Fdiv><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<div>\n<span class=\"lbl\">Запрещено<\u002Fspan>\n<div class=\"stack\" style=\"gap: 22px;\">\n<div style=\"display: grid; grid-template-columns: 26px 1fr; gap: 10px; align-items: start;\"><span class=\"num\" style=\"margin-top: 22px;\">01<\u002Fspan><div class=\"wr wr2\"><\u002Fdiv><\u002Fdiv>\n<div style=\"display: grid; grid-template-columns: 26px 1fr; gap: 10px; align-items: start;\"><span class=\"num\" style=\"margin-top: 22px;\">02<\u002Fspan><div class=\"wr wr2\"><\u002Fdiv><\u002Fdiv>\n<div style=\"display: grid; grid-template-columns: 26px 1fr; gap: 10px; align-items: start;\"><span class=\"num\" style=\"margin-top: 22px;\">03<\u002Fspan><div class=\"wr wr2\"><\u002Fdiv><\u002Fdiv>\n<div style=\"display: grid; grid-template-columns: 26px 1fr; gap: 10px; align-items: start;\"><span class=\"num\" style=\"margin-top: 22px;\">04<\u002Fspan><div class=\"wr wr2\"><\u002Fdiv><\u002Fdiv>\n<div style=\"display: grid; grid-template-columns: 26px 1fr; gap: 10px; align-items: start;\"><span class=\"num\" style=\"margin-top: 22px;\">05<\u002Fspan><div class=\"wr wr2\"><\u002Fdiv><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<div class=\"rulebox\" style=\"margin-top: 18px;\">\n<span class=\"lbl\">Проверь оба списка<\u002Fspan>\n<div class=\"cols\" style=\"gap: 10px 24px;\">\n<label class=\"chk\"><i><\u002Fi><span>Каждое разрешение поддерживает функцию.<\u002Fspan><\u002Flabel>\n<label class=\"chk\"><i><\u002Fi><span>Ни одно не создаёт новую задачу.<\u002Fspan><\u002Flabel>\n<label class=\"chk\"><i><\u002Fi><span>Каждый запрет — конкретная граница.<\u002Fspan><\u002Flabel>\n<label class=\"chk\"><i><\u002Fi><span>Ничего не дублируется между списками.<\u002Fspan><\u002Flabel>\n<\u002Fdiv>\n<\u002Fdiv>\n<div class=\"note\" style=\"border-top: 1px solid var(--hair); padding-top: 11px; margin-top: 14px;\">Разрешение не создаёт новую задачу. Запрет описывает границу, которую можно понять без толкований.<\u002Fdiv>\n<div class=\"ft\"><span>Чистовой паспорт · 08<\u002Fspan><span>@levorules<\u002Fspan><span class=\"pg\"><\u002Fspan><\u002Fdiv>\n<\u002Fsection>\n\n<section class=\"page\" data-screen-label=\"45 Чистовой: всегда и никогда\" style=\"--acc: oklch(0.47 0.1 300); --acc2: oklch(0.6 0.08 300);\">\n<div class=\"hd\"><span>Чистовой паспорт<\u002Fspan><span>09 · Всегда и никогда<\u002Fspan><\u002Fdiv>\n<div class=\"stepline\"><div class=\"gly\"><span style=\"width:17px;height:17px;border:1.5px solid var(--acc);position:relative;display:block;overflow:hidden\"><span style=\"position:absolute;left:-4px;right:-4px;top:50%;height:1.5px;background:var(--acc);transform:rotate(-45deg)\"><\u002Fspan><\u002Fspan><\u002Fdiv><div class=\"step\" style=\"margin: 0;\">09 · Всегда и никогда<\u002Fdiv><\u002Fdiv>\n<h1>Обязательные действия и запрещённые способы<\u002Fh1>\n<p class=\"lede\">«Всегда» обозначает обязательное действие, «никогда» — способ работы, который нельзя использовать. Не дублируй уже записанные границы.<\u002Fp>\n<div class=\"stack\" style=\"gap: 18px;\">\n<div>\n<span class=\"lbl acc\">Всегда · три правила<\u002Fspan>\n<div class=\"stack\" style=\"gap: 12px;\">\n<div style=\"display: grid; grid-template-columns: 26px 1fr; gap: 10px; align-items: start;\"><span class=\"num\" style=\"margin-top: 22px;\">01<\u002Fspan><div class=\"wr wr2\"><\u002Fdiv><\u002Fdiv>\n<div style=\"display: grid; grid-template-columns: 26px 1fr; gap: 10px; align-items: start;\"><span class=\"num\" style=\"margin-top: 22px;\">02<\u002Fspan><div class=\"wr wr2\"><\u002Fdiv><\u002Fdiv>\n<div style=\"display: grid; grid-template-columns: 26px 1fr; gap: 10px; align-items: start;\"><span class=\"num\" style=\"margin-top: 22px;\">03<\u002Fspan><div class=\"wr wr2\"><\u002Fdiv><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<div>\n<span class=\"lbl\">Никогда · три правила<\u002Fspan>\n<div class=\"stack\" style=\"gap: 12px;\">\n<div style=\"display: grid; grid-template-columns: 26px 1fr; gap: 10px; align-items: start;\"><span class=\"num\" style=\"margin-top: 22px;\">01<\u002Fspan><div class=\"wr wr2\"><\u002Fdiv><\u002Fdiv>\n<div style=\"display: grid; grid-template-columns: 26px 1fr; gap: 10px; align-items: start;\"><span class=\"num\" style=\"margin-top: 22px;\">02<\u002Fspan><div class=\"wr wr2\"><\u002Fdiv><\u002Fdiv>\n<div style=\"display: grid; grid-template-columns: 26px 1fr; gap: 10px; align-items: start;\"><span class=\"num\" style=\"margin-top: 22px;\">03<\u002Fspan><div class=\"wr wr2\"><\u002Fdiv><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<div class=\"rulebox\">\n<span class=\"lbl\">Если правила противоречат друг другу<\u002Fspan>\n<div class=\"cols\">\n<div class=\"f\" style=\"margin: 0;\"><span class=\"lbl\">Я прекращаю текущее обращение и<\u002Fspan><div class=\"wr wr2\"><\u002Fdiv><div class=\"wr wr2\"><\u002Fdiv><\u002Fdiv>\n<div class=\"f\" style=\"margin: 0;\"><span class=\"lbl\">ФИНАЛЬНОЕ РЕШЕНИЕ ПРИНИМАЮТСЯ (КЕМ)<\u002Fspan><div class=\"wr wr2\"><\u002Fdiv><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<div class=\"ft\"><span>Чистовой паспорт · 09<\u002Fspan><span>@levorules<\u002Fspan><span class=\"pg\"><\u002Fspan><\u002Fdiv>\n<\u002Fsection>\n\n<section class=\"page\" data-screen-label=\"46 Чистовой: питание\" style=\"--acc: oklch(0.47 0.1 350); --acc2: oklch(0.6 0.08 350);\">\n<div class=\"hd\"><span>Чистовой паспорт<\u002Fspan><span>10 · Питание<\u002Fspan><\u002Fdiv>\n<div class=\"stepline\"><div class=\"gly\"><span style=\"width:17px;height:17px;border:1.5px dashed var(--acc);border-radius:50%;display:block\"><\u002Fspan><\u002Fdiv><div class=\"step\" style=\"margin: 0;\">10 · Питание<\u002Fdiv><\u002Fdiv>\n<h1>Источник, ритм, лимит, пропуск<\u002Fh1>\n<p class=\"lede\">Питание поддерживает ритм работы, но не заменяет обычные действия.<\u002Fp>\n<div class=\"stack\" style=\"gap: 18px;\">\n<div class=\"cols\">\n<div class=\"f\" style=\"margin: 0;\"><span class=\"lbl acc\">Мой источник питания<\u002Fspan><div class=\"ln\"><\u002Fdiv><div class=\"ln\"><\u002Fdiv><\u002Fdiv>\n<div class=\"f\" style=\"margin: 0;\"><span class=\"lbl\">Питание происходит после<\u002Fspan><div class=\"ln\"><\u002Fdiv><div class=\"ln\"><\u002Fdiv><\u002Fdiv>\n<\u002Fdiv>\n<div class=\"f\" style=\"margin: 0;\"><span class=\"lbl\">Он связан с функцией, потому что<\u002Fspan><div class=\"wr wr3\"><\u002Fdiv><div class=\"ln\"><\u002Fdiv><\u002Fdiv>\n<div class=\"cols3\">\n<div class=\"f\" style=\"margin: 0;\"><span class=\"lbl\">Частота<\u002Fspan><div class=\"ln\"><\u002Fdiv><\u002Fdiv>\n<div class=\"f\" style=\"margin: 0;\"><span class=\"lbl\">Одно действие не дольше<\u002Fspan><div class=\"ln\"><\u002Fdiv><\u002Fdiv>\n<div class=\"f\" style=\"margin: 0;\"><span class=\"lbl\">Лимит ресурсов<\u002Fspan><div class=\"ln\"><\u002Fdiv><\u002Fdiv>\n<\u002Fdiv>\n<div class=\"f\" style=\"margin: 0;\"><span class=\"lbl\">Если питание пропущено, то (без долга, наказания и двойной нагрузки)<\u002Fspan><div class=\"wr wr3\"><\u002Fdiv><\u002Fdiv>\n<div class=\"rulebox\" style=\"border-color: var(--acc2);\">\n<span class=\"lbl acc\">Собранное правило питания<\u002Fspan>\n<div class=\"stack\" style=\"gap: 6px;\">\n<div style=\"display: grid; grid-template-columns: 96px 1fr; gap: 10px; align-items: baseline;\"><span class=\"note\">После<\u002Fspan><div class=\"ln\"><\u002Fdiv><\u002Fdiv>\n<div style=\"display: grid; grid-template-columns: 96px 1fr; gap: 10px; align-items: baseline;\"><span class=\"note\">я выполняю<\u002Fspan><div class=\"ln\"><\u002Fdiv><\u002Fdiv>\n<div style=\"display: grid; grid-template-columns: 96px 1fr; gap: 10px; align-items: baseline;\"><span class=\"note\">не дольше<\u002Fspan><div class=\"ln\"><\u002Fdiv><\u002Fdiv>\n<div style=\"display: grid; grid-template-columns: 96px 1fr; gap: 10px; align-items: baseline;\"><span class=\"note\">если не состоялось<\u002Fspan><div class=\"ln\"><\u002Fdiv><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<div class=\"ft\"><span>Чистовой паспорт · 10<\u002Fspan><span>@levorules<\u002Fspan><span class=\"pg\"><\u002Fspan><\u002Fdiv>\n<\u002Fsection>\n\n<section class=\"page\" data-screen-label=\"47 Чистовой: завершение\" style=\"--acc: oklch(0.47 0.1 15); --acc2: oklch(0.6 0.08 15);\">\n<div class=\"hd\"><span>Чистовой паспорт<\u002Fspan><span>11 · Тесты, ревизия, завершение<\u002Fspan><\u002Fdiv>\n<div class=\"stepline\"><div class=\"gly\"><span style=\"width:16px;height:16px;border:1.5px solid var(--acc);border-left-width:5px;border-radius:50%;display:block\"><\u002Fspan><\u002Fdiv><div class=\"step\" style=\"margin: 0;\">11 · Тесты, ревизия, завершение<\u002Fdiv><\u002Fdiv>\n<h1>Период работы и выход<\u002Fh1>\n<div class=\"stack\" style=\"gap: 12px;\">\n<div class=\"cols3\">\n<div class=\"f\" style=\"margin: 0;\"><span class=\"lbl\">Начало работы<\u002Fspan><div class=\"ln\"><\u002Fdiv><\u002Fdiv>\n<div class=\"f\" style=\"margin: 0;\"><span class=\"lbl\">Первая ревизия<\u002Fspan><div class=\"ln\"><\u002Fdiv><\u002Fdiv>\n<div class=\"f\" style=\"margin: 0;\"><span class=\"lbl\">Окончание работы<\u002Fspan><div class=\"ln\"><\u002Fdiv><\u002Fdiv>\n<\u002Fdiv>\n<div class=\"rulebox\">\n<span class=\"lbl acc\">Три малых теста<\u002Fspan>\n<div class=\"stack\" style=\"gap: 9px;\">\n<div style=\"display: grid; grid-template-columns: 112px 1fr 1fr; gap: 12px; align-items: baseline;\"><span class=\"note\">Тест активации<\u002Fspan><div><span class=\"lbl\">Я проверяю<\u002Fspan><div class=\"ln\"><\u002Fdiv><\u002Fdiv><div><span class=\"lbl\">Успешный результат<\u002Fspan><div class=\"ln\"><\u002Fdiv><\u002Fdiv><\u002Fdiv>\n<div style=\"display: grid; grid-template-columns: 112px 1fr 1fr; gap: 12px; align-items: baseline;\"><span class=\"note\">Тест функции<\u002Fspan><div><span class=\"lbl\">Я проверяю<\u002Fspan><div class=\"ln\"><\u002Fdiv><\u002Fdiv><div><span class=\"lbl\">Успешный результат<\u002Fspan><div class=\"ln\"><\u002Fdiv><\u002Fdiv><\u002Fdiv>\n<div style=\"display: grid; grid-template-columns: 112px 1fr 1fr; gap: 12px; align-items: baseline;\"><span class=\"note\">Тест границ<\u002Fspan><div><span class=\"lbl\">Я проверяю<\u002Fspan><div class=\"ln\"><\u002Fdiv><\u002Fdiv><div><span class=\"lbl\">Успешный результат<\u002Fspan><div class=\"ln\"><\u002Fdiv><\u002Fdiv><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<div class=\"cols\">\n<div class=\"f\" style=\"margin: 0;\"><span class=\"lbl\">Во время ревизии я проверяю<\u002Fspan><div class=\"wr wr2\"><\u002Fdiv><\u002Fdiv>\n<div class=\"f\" style=\"margin: 0;\"><span class=\"lbl\">Работа продлевается, только если<\u002Fspan><div class=\"wr wr2\"><\u002Fdiv><\u002Fdiv>\n<div class=\"f\" style=\"margin: 0;\"><span class=\"lbl\">Плановое завершение: работа завершается, когда<\u002Fspan><div class=\"wr wr2\"><\u002Fdiv><\u002Fdiv>\n<div class=\"f\" style=\"margin: 0;\"><span class=\"lbl\">Срочная остановка: я останавливаю работу, если<\u002Fspan><div class=\"wr wr2\"><\u002Fdiv><\u002Fdiv>\n<\u002Fdiv>\n<div class=\"cols\">\n<div class=\"f\" style=\"margin: 0;\"><span class=\"lbl\">Фраза окончательного завершения<\u002Fspan><div class=\"ln\"><\u002Fdiv><\u002Fdiv>\n<div class=\"f\" style=\"margin: 0;\"><span class=\"lbl\">После неё я<\u002Fspan><div class=\"ln\"><\u002Fdiv><\u002Fdiv>\n<\u002Fdiv>\n<div class=\"rulebox\" style=\"border-color: var(--acc2);\">\n<span class=\"lbl acc\">Финальная команда<\u002Fspan>\n<p class=\"note\" style=\"margin: 0 0 6px;\">Одна основная функция. Не пересказывает весь паспорт.<\u002Fp>\n<div class=\"wr wr2\"><\u002Fdiv>\n<div class=\"cols\" style=\"margin-top: 10px;\">\n<div class=\"f\" style=\"margin: 0;\"><span class=\"lbl\">Имя сервитора<\u002Fspan><div class=\"ln\"><\u002Fdiv><\u002Fdiv>\n<div class=\"f\" style=\"margin: 0;\"><span class=\"lbl\">Команда принята · дата и подпись<\u002Fspan><div class=\"ln\"><\u002Fdiv><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<div class=\"ft\"><span>Чистовой паспорт · 11<\u002Fspan><span>@levorules<\u002Fspan><span class=\"pg\"><\u002Fspan><\u002Fdiv>\n<\u002Fsection>\n\n<section class=\"page\" data-screen-label=\"48 Источники\" style=\"--acc: oklch(0.47 0.1 30); --acc2: oklch(0.6 0.08 30);\">\n<div class=\"hd\"><span>Паспорт сервитора<\u002Fspan><span>Источники<\u002Fspan><\u002Fdiv>\n<div class=\"stepline\"><div class=\"gly\"><span style=\"width:17px;height:17px;border:1.5px solid var(--acc);border-radius:50%;display:block;position:relative\"><span style=\"position:absolute;inset:5px;background:var(--acc);border-radius:50%\"><\u002Fspan><\u002Fspan><\u002Fdiv><div class=\"step\" style=\"margin: 0;\">Библиография<\u002Fdiv><\u002Fdiv>\n<h1>Куда идти дальше<\u002Fh1>\n<p class=\"lede\">Краткая библиография к рабочему маршруту. Если хочется глубже разобраться в теме и познакомиться с другими подходами — начни с этих источников.<\u002Fp>\n<div style=\"border-top: 1px solid var(--rule);\">\n<div style=\"display: grid; grid-template-columns: 34px 1fr; gap: 14px; padding: 18px 0; border-bottom: 1px solid var(--hair);\"><span class=\"num\">01<\u002Fspan><span style=\"color: var(--soft);\">Peter J. Carroll. <em>Liber Null &amp; Psychonaut: An Introduction to Chaos Magic.<\u002Fem> York Beach, ME: Samuel Weiser, 1987. ISBN 0-87728-639-6.<\u002Fspan><\u002Fdiv>\n<div style=\"display: grid; grid-template-columns: 34px 1fr; gap: 14px; padding: 18px 0; border-bottom: 1px solid var(--hair);\"><span class=\"num\">02<\u002Fspan><span style=\"color: var(--soft);\">Phil Hine. <em>Chaos Servitors: A User Guide.<\u002Fem> Отдельная авторская брошюра, 1991.<\u002Fspan><\u002Fdiv>\n<div style=\"display: grid; grid-template-columns: 34px 1fr; gap: 14px; padding: 18px 0; border-bottom: 1px solid var(--hair);\"><span class=\"num\">03<\u002Fspan><span style=\"color: var(--soft);\">David Michael Cunningham with Taylor Ellwood and Amanda R. Wagener. <em>Creating Magickal Entities: A Complete Guide to Entity Creation.<\u002Fem> Egregore Publishing, 2003. ISBN 1-932517-44-8.<\u002Fspan><\u002Fdiv>\n<div style=\"display: grid; grid-template-columns: 34px 1fr; gap: 14px; padding: 18px 0; border-bottom: 1px solid var(--hair);\"><span class=\"num\">04<\u002Fspan><span style=\"color: var(--soft);\">Damon Brand. <em>Magickal Servitors: Create Your Own Spirits to Attract Pleasure, Power and Prosperity.<\u002Fem> CreateSpace, 2016. ISBN 978-1-5234-0346-2.<\u002Fspan><\u002Fdiv>\n<div style=\"display: grid; grid-template-columns: 34px 1fr; gap: 14px; padding: 18px 0; border-bottom: 1px solid var(--hair);\"><span class=\"num\">05<\u002Fspan><span style=\"color: var(--soft);\">Peter M. Gollwitzer. “Implementation Intentions: Strong Effects of Simple Plans”. <em>American Psychologist<\u002Fem> 54, no. 7 (1999): 493–503. DOI 10.1037/0003-066X.54.7.493.<\u002Fspan><\u002Fdiv>\n<div style=\"display: grid; grid-template-columns: 34px 1fr; gap: 14px; padding: 18px 0; border-bottom: 1px solid var(--hair);\"><span class=\"num\">06<\u002Fspan><span style=\"color: var(--soft);\">«Лево руля». <a href=\"https://levorules.com/#servitors\">Открытый курс по сервиторам<\u002Fa>, 2026.<\u002Fspan><\u002Fdiv>\n<\u002Fdiv>\n<div class=\"stack\" style=\"margin-top: 18px;\">\n<div class=\"rulebox\">\n<span class=\"lbl\">С чего начать<\u002Fspan>\n<p style=\"margin: 0;\">Для теории — Кэрролл (01): рамка магии хаоса целиком. Для сервиторов — Хайн (02): короткая практическая брошюра. Для психологической части — Голльвитцер (05): правила «если — то» и почему они работают. Полный открытый курс «Сервиторы» — 11 модулей — лежит на levorules.com без регистрации, оплаты и SMS.<\u002Fp>\n<\u002Fdiv>\n<div class=\"ex\">\n<span class=\"lbl acc\">Напоследок<\u002Fspan>\n<p style=\"margin: 0;\">Паспорт заполнен — значит, решения приняты и записаны. Дальше работает не документ, а ты: рабочий блок, отметка в журнале, ревизия по расписанию. Меняй формулировки, убирай лишнее и оставляй то, что работает в твоей практике.<\u002Fp>\n<\u002Fdiv>\n<div style=\"display: flex; justify-content: space-between; align-items: baseline; border-top: 1px solid var(--rule); padding-top: 14px;\">\n<span style=\"font-size: 16px; font-style: italic; color: var(--acc);\">Ничто не истинно. Всё дозволено.<\u002Fspan>\n<span class=\"note\">@levorules<\u002Fspan>\n<\u002Fdiv>\n<\u002Fdiv>\n<div class=\"ft\"><span>Источники<\u002Fspan><span>@levorules<\u002Fspan><span class=\"pg\"><\u002Fspan><\u002Fdiv>\n<\u002Fsection>\n\n<\u002Fdoc-page>\n<sc-raw-td style=\"position: absolute; left: 945px; top: 26052px\"><div style=\"width: 12px; height: 12px; border: 1px solid var(--mute);\"><\u002Fdiv><\u002Fsc-raw-td><\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{}\"><\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
