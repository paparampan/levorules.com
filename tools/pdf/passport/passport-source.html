document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

.page strong { font-weight: 600; color: var(--ink); }\n.page em { font-style: italic; }\n.step { font: 600 11.5px/1 'JetBrains Mono', monospace; letter-spacing: 0.16em; text-transform: uppercase; color: var(--acc); margin: 0 0 14px; }\n.lede { font-size: 16.5px; line-height: 1.48; color: var(--soft); margin: 0 0 18px; max-width: 46em; text-wrap: pretty; }\n.lbl { display: block; font: 500 11px/1.3 'JetBrains Mono', monospace; letter-spacing: 0.1em;\n  text-transform: uppercase; color: var(--mute); margin-bottom: 6px; }\n.lbl.acc { color: var(--acc); }\n.cols { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; }\n.cols3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 16px; }\n.stack { display: grid; gap: 14px; }\n.card { background: var(--tint); padding: 15px 17px; }\n.ex { background: var(--tint); border-left: 2px solid var(--acc); padding: 14px 17px; }\n.warn { border-left: 2px solid var(--rule); padding: 2px 0 2px 15px; }\n.rulebox { border: 1px solid var(--rule); padding: 15px 17px; }\n.note { font: 400 13px/1.45 'JetBrains Mono', monospace; color: var(--mute); }\n.stepline { display: flex; align-items: center; gap: 11px; margin: 0 0 10px; }\n.gly { width: 26px; height: 26px; display: flex; align-items: center; justify-content: center; flex: none; }\n.hl { background: color-mix(in oklch, var(--acc) 17%, transparent); padding: 0 3px; border-radius: 1px; color: var(--ink); }\n.pull { font-size: 19px; line-height: 1.36; color: var(--ink); border-left: 2px solid var(--acc);\n  padding-left: 15px; margin: 0 0 12px; text-wrap: pretty; }\n.pg::after { content: counter(pg) \" / 49\"; }\n.f { margin-bottom: 13px; }\n.ln { border-bottom: 1px solid var(--rule); height: 40px; }\n.wr { background-image: repeating-linear-gradient(to bottom, transparent 0 38px, var(--rule) 38px 39px); }\n.wr2 { height: 78px; }\n.wr3 { height: 117px; }\n.wr4 { height: 156px; }\n.wr5 { height: 195px; }\n.chk { display: inline-flex; align-items: flex-start; gap: 8px; font-size: 14.5px; color: var(--soft); line-height: 1.4; }\n.chk i { width: 12px; height: 12px; border: 1px solid var(--mute); display: block; flex: none; margin-top: 4px; }\n.chkrow { display: flex; flex-wrap: wrap; gap: 8px 22px; }\n.num { font: 600 11px/1 'JetBrains Mono', monospace; color: var(--acc); letter-spacing: 0.08em; }\n.draw { border: 1px solid var(--rule); background: oklch(0.982 0.008 85); }\n.page table { width: 100%; border-collapse: collapse; font-size: 14.5px; color: var(--soft); }\n.page th { text-align: left; font: 500 11px/1.3 'JetBrains Mono', monospace; letter-spacing: 0.09em;\n  text-transform: uppercase; color: var(--mute); padding: 0 12px 7px 0; border-bottom: 1px solid var(--rule); }\n.page td { padding: 9px 12px 9px 0; border-bottom: 1px solid var(--hair); vertical-align: top; line-height: 1.45; }\n<\u002Fstyle>\n<script src=\"7e802cc5-689f-41ff-93a5-671ef31143fa\"><\u002Fscript>\n<\u002Fhelmet>\n<doc-page size=\"a4\" style=\"position: absolute; left: 330px; top: 84px\">\n\n<section class=\"page\" data-screen-label=\"01 Обложка\" style=\"--acc: #b30000; --acc2: #d43a2a; background: oklch(0.17 0.012 40); color: oklch(0.95 0.012 85); padding: 58px 58px 46px;\">\n<div style=\"display: flex; justify-content: space-between; align-items: baseline; font: 500 10px/1 'JetBrains Mono', monospace; letter-spacing: 0.2em; text-transform: uppercase; color: oklch(0.8 0.015 85);\">\n<span>Лево руля · антидогматический оккультизм<\u002Fspan>\n<span><a href=\"https://t.me/levorules\">@levorules<\u002Fa><\u002Fspan>\n<\u002Fdiv>\n<div style=\"display: flex; align-items: center; gap: 16px; margin: 34px 0 0;\">\n<span style=\"width: 40px; height: 40px; border: 2px solid #b30000; border-radius: 50%; display: block; position: relative; flex: none;\"><span style=\"position: absolute; left: 50%; top: 6px; bottom: 6px; width: 2px; background: #b30000; transform: translateX(-50%);\"><\u002Fspan><\u002Fspan>\n<span style=\"height: 2px; flex: 1; background: #b30000;\"><\u002Fspan>\n<\u002Fdiv>\n<div style=\"margin-top: 22px; font: 500 11.5px/1.7 'JetBrains Mono', monospace; letter-spacing: 0.22em; text-transform: uppercase; color: oklch(0.66 0.015 85); display: grid; gap: 2px;\">\n<span>Практический гайд · чеклист<\u002Fspan>\n<span>14 решений · поля для заполнения · чистовой паспорт<\u002Fspan>\n<\u002Fdiv>\n<h1 style=\"font-family: 'JetBrains Mono', monospace; font-size: 66px; font-weight: 600; line-height: 1.0; letter-spacing: -0.03em; text-transform: uppercase; margin: 30px 0 0; color: oklch(0.96 0.012 85);\">Паспорт<br>сервитора<\u002Fh1>\n<p style=\"font-size: 19px; line-height: 1.5; color: oklch(0.8 0.015 85); max-width: 36ch; margin: 26px 0 0;\">Последовательный маршрут от исходной проблемы до завершения работы: что решать, в каком порядке и по каким признакам проверять результат.<\u002Fp>\n<div style=\"margin: 44px 0 0; display: grid; grid-template-columns: 1fr 1fr; gap: 1px; background: oklch(0.3 0.012 40); border: 1px solid oklch(0.3 0.012 40);\">\n<div style=\"background: oklch(0.17 0.012 40); padding: 15px 17px;\"><span style=\"display: block; font: 500 10px/1.3 'JetBrains Mono', monospace; letter-spacing: 0.16em; text-transform: uppercase; color: #d43a2a; margin-bottom: 7px;\">Часть I · Черновик<\u002Fspan><span style=\"color: oklch(0.78 0.015 85); font-size: 15px; line-height: 1.5;\">14 шагов: разбор решения и страница полей.<\u002Fspan><\u002Fdiv>\n<div style=\"background: oklch(0.17 0.012 40); padding: 15px 17px;\"><span style=\"display: block; font: 500 10px/1.3 'JetBrains Mono', monospace; letter-spacing: 0.16em; text-transform: uppercase; color: #d43a2a; margin-bottom: 7px;\">Часть II · Чистовой<\u002Fspan><span style=\"color: oklch(0.78 0.015 85); font-size: 15px; line-height: 1.5;\">12 страниц окончательных формулировок.<\u002Fspan><\u002Fdiv>\n<\u002Fdiv>\n<div style=\"margin-top: auto; display: grid; gap: 18px;\">\n<div style=\"font: 500 16px/1.4 'JetBrains Mono', monospace; letter-spacing: 0.06em; text-transform: uppercase; color: oklch(0.63 0.19 32);\">Ничто не истинно.<br>Всё дозволено.<\u002Fdiv>\n<div style=\"border-top: 1px solid oklch(0.32 0.012 40); padding-top: 15px; display: flex; justify-content: space-between; align-items: baseline; font: 400 10px/1.4 'JetBrains Mono', monospace; letter-spacing: 0.14em; text-transform: uppercase; color: oklch(0.66 0.015 85);\">\n<span>Магия хаоса<\u002Fspan>\n<span>49 страниц · 2026<\u002Fspan>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n\n<section class=\"page\" data-screen-label=\"02 Спасибо\" data-x=\"\" style=\"--acc: oklch(0.47 0.1 30); --acc2: oklch(0.6 0.08 30); font-size: 16.5px;\">\n<div class=\"hd\"><span>Паспорт сервитора<\u002Fspan><span>Перед началом<\u002Fspan><\u002Fdiv>\n<div class=\"stepline\"><div class=\"gly\"><span style=\"width:17px;height:17px;border:1.5px solid var(--acc);border-radius:50%;display:block\"><\u002Fspan><\u002Fdiv><div class=\"step\" style=\"margin: 0;\">Вступление<\u002Fdiv><\u002Fdiv>\n<h1 style=\"font-size: 38px;\">Спасибо за поддержку<\u002Fh1>\n<p class=\"lede\" style=\"font-size: 19.5px; margin-bottom: 24px;\">Искренне благодарю тебя за поддержку покупкой этого гайд. Твой интерес — лучшая для меня мотивация работать над новыми материалами.<\u002Fp>\n<div class=\"stack\" style=\"gap: 18px;\">\n<div>\n<h2>Зачем этот паспорт<\u002Fh2>\n<p>Я собрал его как рабочий инструмент, чтобы тебе не приходилось восстанавливать последовательность решений по разрозненным заметкам и роликам. Здесь всё идёт в том порядке, в котором решения действительно принимаются: форма вырастает из функции, правила — из задачи, а тесты — из результата, который ты решил считать успехом. Меняй формулировки, убирай лишнее и оставляй то, что работает в твоей практике.<\u002Fp>\n<\u002Fdiv>\n<div class=\"ex\">\n<span class=\"lbl acc\">Основание<\u002Fspan>\n<p style=\"margin: 0;\">Материал основан не только на личном опыте, но и на важнейших источниках магии хаоса. Список ключевых текстов, рекомендуемых к прочтению, идёт в самом конце.<\u002Fp>\n<\u002Fdiv>\n<div class=\"rulebox\">\n<span class=\"lbl\">Что внутри<\u002Fspan>\n<div style=\"display: grid; gap: 9px;\">\n<div style=\"display: grid; grid-template-columns: 190px 1fr; gap: 14px;\"><strong>Часть I · Черновик<\u002Fstrong><span style=\"color: var(--soft);\">14 шагов: разбор решения и страница полей для предварительного заполнения.<\u002Fspan><\u002Fdiv>\n<div style=\"display: grid; grid-template-columns: 190px 1fr; gap: 14px;\"><strong>Часть II · Чистовой<\u002Fstrong><span style=\"color: var(--soft);\">12 страниц, куда переносятся только окончательные формулировки.<\u002Fspan><\u002Fdiv>\n<div style=\"display: grid; grid-template-columns: 190px 1fr; gap: 14px;\"><strong>Источники<\u002Fstrong><span style=\"color: var(--soft);\">Краткая библиография: с чего продолжать самостоятельно.<\u002Fspan><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<div class=\"rulebox\">\n<span class=\"lbl\">Важная ремарка<\u002Fspan>\n<p>Я не гарантирую тебе магического результата, потому что твою работу контролируешь ты сам. Гайд не является медицинской, юридической или финансовой рекомендацией: в вопросах здоровья, закона, денег и безопасности нужны профильные специалисты.<\u002Fp>\n<p class=\"pull\" style=\"margin: 4px 0 0;\">Магия работает. Но чудес не бывает.<\u002Fp>\n<\u002Fdiv>\n<\u002Fdiv>\n<div class=\"ft\"><span>Вступление<\u002Fspan><span>@levorules<\u002Fspan><span class=\"pg\"><\u002Fspan><\u002Fdiv>\n<\u002Fsection>\n\n<section class=\"page\" data-screen-label=\"03 Маршрут\" style=\"--acc: oklch(0.47 0.1 30); --acc2: oklch(0.6 0.08 30);\">\n<div class=\"hd\"><span>Паспорт сервитора<\u002Fspan><span>Карта гайда<\u002Fspan><\u002Fdiv>\n<div class=\"stepline\"><div class=\"gly\"><span style=\"display:flex;gap:4px\"><span style=\"width:5px;height:5px;border-radius:50%;background:var(--acc)\"><\u002Fspan><span style=\"width:5px;height:5px;border-radius:50%;background:var(--acc)\"><\u002Fspan><span style=\"width:5px;height:5px;border-radius:50%;background:var(--acc)\"><\u002Fspan><\u002Fspan><\u002Fdiv><div class=\"step\" style=\"margin: 0;\">Что у тебя в руках<\u002Fdiv><\u002Fdiv>\n<h1>Маршрут: четырнадцать решений<\u002Fh1>\n<p class=\"lede\">Каждое следующее решение опирается на предыдущее. В первый раз пройди гайд по порядку. Потом возвращайся к отдельным разделам по мере необходимости.<\u002Fp>\n<div style=\"display: grid; grid-template-columns: 1fr 1fr; gap: 0 30px; border-top: 1px solid var(--rule); margin-bottom: 24px;\">\n<div style=\"display: grid; grid-template-columns: 34px 1fr; gap: 0 12px; align-items: baseline; padding: 9px 0; border-bottom: 1px solid var(--hair);\"><span class=\"num\">01<\u002Fspan><span>Точка старта: описать проблему<\u002Fspan><\u002Fdiv>\n<div style=\"display: grid; grid-template-columns: 34px 1fr; gap: 0 12px; align-items: baseline; padding: 9px 0; border-bottom: 1px solid var(--hair);\"><span class=\"num\">08<\u002Fspan><span>Анкер и активация<\u002Fspan><\u002Fdiv>\n<div style=\"display: grid; grid-template-columns: 34px 1fr; gap: 0 12px; align-items: baseline; padding: 9px 0; border-bottom: 1px solid var(--hair);\"><span class=\"num\">02<\u002Fspan><span>Задача: что должно произойти<\u002Fspan><\u002Fdiv>\n<div style=\"display: grid; grid-template-columns: 34px 1fr; gap: 0 12px; align-items: baseline; padding: 9px 0; border-bottom: 1px solid var(--hair);\"><span class=\"num\">09<\u002Fspan><span>Главная команда<\u002Fspan><\u002Fdiv>\n<div style=\"display: grid; grid-template-columns: 34px 1fr; gap: 0 12px; align-items: baseline; padding: 9px 0; border-bottom: 1px solid var(--hair);\"><span class=\"num\">03<\u002Fspan><span>Критерии успеха<\u002Fspan><\u002Fdiv>\n<div style=\"display: grid; grid-template-columns: 34px 1fr; gap: 0 12px; align-items: baseline; padding: 9px 0; border-bottom: 1px solid var(--hair);\"><span class=\"num\">10<\u002Fspan><span>Разрешения<\u002Fspan><\u002Fdiv>\n<div style=\"display: grid; grid-template-columns: 34px 1fr; gap: 0 12px; align-items: baseline; padding: 9px 0; border-bottom: 1px solid var(--hair);\"><span class=\"num\">04<\u002Fspan><span>Функция и область работы<\u002Fspan><\u002Fdiv>\n<div style=\"display: grid; grid-template-columns: 34px 1fr; gap: 0 12px; align-items: baseline; padding: 9px 0; border-bottom: 1px solid var(--hair);\"><span class=\"num\">11<\u002Fspan><span>Запреты и сценарии «если — то»<\u002Fspan><\u002Fdiv>\n<div style=\"display: grid; grid-template-columns: 34px 1fr; gap: 0 12px; align-items: baseline; padding: 9px 0; border-bottom: 1px solid var(--hair);\"><span class=\"num\">05<\u002Fspan><span>Имя<\u002Fspan><\u002Fdiv>\n<div style=\"display: grid; grid-template-columns: 34px 1fr; gap: 0 12px; align-items: baseline; padding: 9px 0; border-bottom: 1px solid var(--hair);\"><span class=\"num\">12<\u002Fspan><span>Автономия и канал связи<\u002Fspan><\u002Fdiv>\n<div style=\"display: grid; grid-template-columns: 34px 1fr; gap: 0 12px; align-items: baseline; padding: 9px 0; border-bottom: 1px solid var(--hair);\"><span class=\"num\">06<\u002Fspan><span>Сигила<\u002Fspan><\u002Fdiv>\n<div style=\"display: grid; grid-template-columns: 34px 1fr; gap: 0 12px; align-items: baseline; padding: 9px 0; border-bottom: 1px solid var(--hair);\"><span class=\"num\">13<\u002Fspan><span>Питание и его цена<\u002Fspan><\u002Fdiv>\n<div style=\"display: grid; grid-template-columns: 34px 1fr; gap: 0 12px; align-items: baseline; padding: 9px 0; border-bottom: 1px solid var(--hair);\"><span class=\"num\">07<\u002Fspan><span>Форма<\u002Fspan><\u002Fdiv>\n<div style=\"display: grid; grid-template-columns: 34px 1fr; gap: 0 12px; align-items: baseline; padding: 9px 0; border-bottom: 1px solid var(--hair);\"><span class=\"num\">14<\u002Fspan><span>Срок, тесты, завершение<\u002Fspan><\u002Fdiv>\n<\u002Fdiv>\n<div class=\"cols\" style=\"margin-bottom: 22px;\">\n<div>\n<h2>Две части гайда<\u002Fh2>\n<p><strong>Черновик<\u002Fstrong> — четырнадцать шагов: теория на одной странице, поля для решений на следующей. Формулировки здесь будут меняться, и это нормально.<\u002Fp>\n<p><strong>Чистовой паспорт<\u002Fstrong> — двенадцать страниц в конце. Туда переносятся только окончательные решения, чтобы конструкцию можно было проверить за минуту.<\u002Fp>\n<\u002Fdiv>\n<div class=\"card\">\n<span class=\"lbl\">Работай с черновиком<\u002Fspan>\n<p>Выбери одну реальную задачу и заведи для неё отдельную заметку. Пока не пытайся сформулировать всё идеально. Достаточно записать: что происходит сейчас, как давно это продолжается и чем это тебе мешает.<\u002Fp>\n<p style=\"margin: 0;\">Паспорт — не каменная табличка. Его можно уточнять, сокращать и переписывать.<\u002Fp>\n<\u002Fdiv>\n<\u002Fdiv>\n<div class=\"warn\">\n<span class=\"lbl\">Сквозной пример<\u002Fspan>\n<p style=\"margin: 0;\">На страницах гайда одна конструкция по имени <strong>Тенет<\u002Fstrong> развивается от исходной проблемы до завершения работы. Смотри не на имя и внешний вид, а на то, почему каждый следующий элемент построен именно так. Это пример связи между решениями, а не готовый сервитор для копирования.<\u002Fp>\n<\u002Fdiv>\n<div class=\"ft\"><span>Карта гайда<\u002Fspan><span>@levorules<\u002Fspan><span class=\"pg\"><\u002Fspan><\u002Fdiv>\n<\u002Fsection>\n\n<section class=\"page\" data-screen-label=\"04 Как работать\" style=\"--acc: oklch(0.47 0.1 30); --acc2: oklch(0.6 0.08 30);\">\n<div class=\"hd\"><span>Паспорт сервитора<\u002Fspan><span>Как работать<\u002Fspan><\u002Fdiv>\n<div class=\"stepline\"><div class=\"gly\"><span style=\"display:grid;gap:4px\"><span style=\"width:18px;height:1.5px;background:var(--acc);display:block\"><\u002Fspan><span style=\"width:18px;height:1.5px;background:var(--acc);display:block\"><\u002Fspan><span style=\"width:18px;height:1.5px;background:var(--acc);display:block\"><\u002Fspan><\u002Fspan><\u002Fdiv><div class=\"step\" style=\"margin: 0;\">Правила игры<\u002Fdiv><\u002Fdiv>\n<h1>Сервитор должен быть твоим<\u002Fh1>\n<p class=\"lede\" style=\"font-size: 18px; margin-bottom: 24px;\">По ходу работы ты будешь разбираться и корректировать написанное. И это уже само по себе — магический акт.<\u002Fp>\n<div class=\"stack\" style=\"gap: 22px;\">\n<div class=\"cols\">\n<div>\n<h2>Что такое сервитор<\u002Fh2>\n<p>Конструкция с одной функцией: намеренно созданная сущность, которой ты передаёшь ограниченную работу — возвращать внимание, отслеживать, напоминать, помогать завершать. Не больше.<\u002Fp>\n<p>Психологически это внешняя опора для решения, которое ты уже принял. Магически — самостоятельная конструкция, с которой ты выстраиваешь отношения. Гайд написан так, что работает в обеих рамках, и специально не заставляет тебя выбирать.<\u002Fp>\n<\u002Fdiv>\n<div>\n<h2>Чем сервитор не является<\u002Fh2>\n<p>Богом, руководителем твоей жизни,&nbsp; источником чудес. Всё, что в паспорте не записано как разрешённое, находится вне его работы.<\u002Fp>\n<p>Если конструкция начинает требовать постоянного внимания, пугать или становиться эмоционально важнее результата — это не признак силы. Это повод остановить обращение и пересмотреть правила.<\u002Fp>\n<\u002Fdiv>\n<\u002Fdiv>\n<div class=\"rulebox\">\n<span class=\"lbl\">Четыре вещи, которые понадобятся<\u002Fspan>\n<div style=\"display: grid; grid-template-columns: repeat(4, 1fr); gap: 18px;\">\n<div><div class=\"num\" style=\"margin-bottom: 6px;\">01<\u002Fdiv><p style=\"margin: 0;\">Отдельная заметка в твоём телефоне или блокнот для черновика и рабочего журнала.<\u002Fp><\u002Fdiv>\n<div><div class=\"num\" style=\"margin-bottom: 6px;\">02<\u002Fdiv><p style=\"margin: 0;\">Одна реальная задача, ограниченная во времени. Не всё и сразу..<\u002Fp><\u002Fdiv>\n<div><div class=\"num\" style=\"margin-bottom: 6px;\">03<\u002Fdiv><p style=\"margin: 0;\">Несколько недель на пилот и готовность переписывать неудобные правила.<\u002Fp><\u002Fdiv>\n<div><div class=\"num\" style=\"margin-bottom: 6px;\">04<\u002Fdiv><p style=\"margin: 0;\">Согласие остановить работу, если конструкция начнёт мешать, а не помогать.<\u002Fp><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<div class=\"cols\">\n<div class=\"ex\">\n<span class=\"lbl acc\">Как читать страницы шагов<\u002Fspan>\n<p>Первая страница шага — разбор: зачем это решение, как его принять, какая ошибка встречается чаще всего и как выглядит решение в примере с Тенетом.<\u002Fp>\n<p style=\"margin: 0;\">Вторая — только поля. Пиши прямо в них или переноси в свою заметку.<\u002Fp>\n<\u002Fdiv>\n<div class=\"warn\">\n<span class=\"lbl\">Практика требует времени<\u002Fspan>\n<p>Не пытайся пройти весь паспорт за один вечер. Формулировки предыдущего шага почти всегда меняются после того, как ты проходишь следующий.<\u002Fp>\n<p style=\"margin: 0;\">Успехов!<\u002Fp>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<div class=\"ft\"><span>Как работать<\u002Fspan><span>@levorules<\u002Fspan><span class=\"pg\"><\u002Fspan><\u002Fdiv>\n<\u002Fsection>\n\n<section class=\"page\" data-screen-label=\"04b Содержание\" style=\"--acc: oklch(0.47 0.1 30); --acc2: oklch(0.6 0.08 30);\">\n<div class=\"hd\"><span>Паспорт сервитора<\u002Fspan><span>Содержание<\u002Fspan><\u002Fdiv>\n<div class=\"stepline\"><div class=\"gly\"><span style=\"width:15px;height:15px;border:1.5px solid var(--acc);border-radius:50%;display:block;position:relative\"><span style=\"position:absolute;inset:4.5px;background:var(--acc);border-radius:50%\"><\u002Fspan><\u002Fspan><\u002Fdiv><div class=\"step\" style=\"margin: 0;\">Содержание<\u002Fdiv><\u002Fdiv>\n<h1>Где что лежит<\u002Fh1>\n<p class=\"lede\">У каждого шага свой знак и свой цвет: они повторяются в шапке страницы и в подвале.<\u002Fp>\n<div class=\"cols\" style=\"gap: 30px;\">\n<div>\n<span class=\"lbl\">Часть I · Черновик<\u002Fspan>\n<div style=\"--acc: oklch(0.47 0.1 30); display: grid; grid-template-columns: 26px 1fr auto; gap: 12px; align-items: center; padding: 12px 0; border-bottom: 1px solid var(--hair);\"><div class=\"gly\"><span style=\"width:15px;height:15px;border:1.5px solid var(--acc);border-radius:50%;display:block\"><\u002Fspan><\u002Fdiv><span style=\"color: var(--soft);\">01 · Точка старта<\u002Fspan><span class=\"num\" style=\"color: var(--acc);\">6<\u002Fspan><\u002Fdiv>\n<div style=\"--acc: oklch(0.47 0.1 55); display: grid; grid-template-columns: 26px 1fr auto; gap: 12px; align-items: center; padding: 12px 0; border-bottom: 1px solid var(--hair);\"><div class=\"gly\"><span style=\"display:flex;align-items:center\"><span style=\"width:12px;height:1.5px;background:var(--acc)\"><\u002Fspan><span style=\"width:6px;height:6px;border-top:1.5px solid var(--acc);border-right:1.5px solid var(--acc);transform:rotate(45deg);margin-left:-4px\"><\u002Fspan><\u002Fspan><\u002Fdiv><span style=\"color: var(--soft);\">02 · Задача<\u002Fspan><span class=\"num\" style=\"color: var(--acc);\">8<\u002Fspan><\u002Fdiv>\n<div style=\"--acc: oklch(0.47 0.1 85); display: grid; grid-template-columns: 26px 1fr auto; gap: 12px; align-items: center; padding: 12px 0; border-bottom: 1px solid var(--hair);\"><div class=\"gly\"><span style=\"display:grid;gap:3px\"><span style=\"width:16px;height:1.5px;background:var(--acc);display:block\"><\u002Fspan><span style=\"width:16px;height:1.5px;background:var(--acc);display:block\"><\u002Fspan><span style=\"width:16px;height:1.5px;background:var(--acc);display:block\"><\u002Fspan><\u002Fspan><\u002Fdiv><span style=\"color: var(--soft);\">03 · Критерии<\u002Fspan><span class=\"num\" style=\"color: var(--acc);\">10<\u002Fspan><\u002Fdiv>\n<div style=\"--acc: oklch(0.47 0.1 120); display: grid; grid-template-columns: 26px 1fr auto; gap: 12px; align-items: center; padding: 12px 0; border-bottom: 1px solid var(--hair);\"><div class=\"gly\"><span style=\"width:15px;height:15px;border:1.5px solid var(--acc);position:relative;display:block\"><span style=\"position:absolute;left:50%;top:0;bottom:0;width:1.5px;background:var(--acc)\"><\u002Fspan><\u002Fspan><\u002Fdiv><span style=\"color: var(--soft);\">04 · Функция и область<\u002Fspan><span class=\"num\" style=\"color: var(--acc);\">12<\u002Fspan><\u002Fdiv>\n<div style=\"--acc: oklch(0.47 0.1 150); display: grid; grid-template-columns: 26px 1fr auto; gap: 12px; align-items: center; padding: 12px 0; border-bottom: 1px solid var(--hair);\"><div class=\"gly\"><span style=\"width:14px;height:14px;border:1.5px solid var(--acc);border-radius:50%;position:relative;display:block\"><span style=\"position:absolute;left:50%;top:-4px;bottom:-4px;width:1.5px;background:var(--acc);transform:translateX(-50%)\"><\u002Fspan><\u002Fspan><\u002Fdiv><span style=\"color: var(--soft);\">05 · Имя<\u002Fspan><span class=\"num\" style=\"color: var(--acc);\">14<\u002Fspan><\u002Fdiv>\n<div style=\"--acc: oklch(0.47 0.1 175); display: grid; grid-template-columns: 26px 1fr auto; gap: 12px; align-items: center; padding: 12px 0; border-bottom: 1px solid var(--hair);\"><div class=\"gly\"><span style=\"width:11px;height:11px;border:1.5px solid var(--acc);transform:rotate(45deg);display:block\"><\u002Fspan><\u002Fdiv><span style=\"color: var(--soft);\">06 · Сигила<\u002Fspan><span class=\"num\" style=\"color: var(--acc);\">16<\u002Fspan><\u002Fdiv>\n<div style=\"--acc: oklch(0.47 0.1 200); display: grid; grid-template-columns: 26px 1fr auto; gap: 12px; align-items: center; padding: 12px 0; border-bottom: 1px solid var(--hair);\"><div class=\"gly\"><span style=\"display:flex\"><span style=\"width:11px;height:11px;border:1.5px solid var(--acc);border-radius:50%\"><\u002Fspan><span style=\"width:11px;height:11px;border:1.5px solid var(--acc);border-radius:50%;margin-left:-4px\"><\u002Fspan><\u002Fspan><\u002Fdiv><span style=\"color: var(--soft);\">07 · Форма<\u002Fspan><span class=\"num\" style=\"color: var(--acc);\">18<\u002Fspan><\u002Fdiv>\n<div style=\"--acc: oklch(0.47 0.1 225); display: grid; grid-template-columns: 26px 1fr auto; gap: 12px; align-items: center; padding: 12px 0; border-bottom: 1px solid var(--hair);\"><div class=\"gly\"><span style=\"width:16px;height:16px;border:1.5px solid var(--acc);display:flex;align-items:center;justify-content:center\"><span style=\"width:6px;height:6px;background:var(--acc)\"><\u002Fspan><\u002Fspan><\u002Fdiv><span style=\"color: var(--soft);\">08 · Анкер и активация<\u002Fspan><span class=\"num\" style=\"color: var(--acc);\">20<\u002Fspan><\u002Fdiv>\n<div style=\"--acc: oklch(0.47 0.1 250); display: grid; grid-template-columns: 26px 1fr auto; gap: 12px; align-items: center; padding: 12px 0; border-bottom: 1px solid var(--hair);\"><div class=\"gly\"><span style=\"display:flex;align-items:center;gap:4px\"><span style=\"width:10px;height:1.5px;background:var(--acc)\"><\u002Fspan><span style=\"width:6px;height:6px;border-radius:50%;background:var(--acc)\"><\u002Fspan><\u002Fspan><\u002Fdiv><span style=\"color: var(--soft);\">09 · Команда<\u002Fspan><span class=\"num\" style=\"color: var(--acc);\">22<\u002Fspan><\u002Fdiv>\n<div style=\"--acc: oklch(0.47 0.1 275); display: grid; grid-template-columns: 26px 1fr auto; gap: 12px; align-items: center; padding: 12px 0; border-bottom: 1px solid var(--hair);\"><div class=\"gly\"><span style=\"display:flex;gap:3px\"><span style=\"width:4px;height:4px;border-radius:50%;background:var(--acc)\"><\u002Fspan><span style=\"width:4px;height:4px;border-radius:50%;background:var(--acc)\"><\u002Fspan><span style=\"width:4px;height:4px;border-radius:50%;background:var(--acc)\"><\u002Fspan><\u002Fspan><\u002Fdiv><span style=\"color: var(--soft);\">10 · Разрешения<\u002Fspan><span class=\"num\" style=\"color: var(--acc);\">24<\u002Fspan><\u002Fdiv>\n<div style=\"--acc: oklch(0.47 0.1 300); display: grid; grid-template-columns: 26px 1fr auto; gap: 12px; align-items: center; padding: 12px 0; border-bottom: 1px solid var(--hair);\"><div class=\"gly\"><span style=\"width:15px;height:15px;border:1.5px solid var(--acc);position:relative;display:block;overflow:hidden\"><span style=\"position:absolute;left:-4px;right:-4px;top:50%;height:1.5px;background:var(--acc);transform:rotate(-45deg)\"><\u002Fspan><\u002Fspan><\u002Fdiv><span style=\"color: var(--soft);\">11 · Запреты и сценарии<\u002Fspan><span class=\"num\" style=\"color: var(--acc);\">26<\u002Fspan><\u002Fdiv>\n<div style=\"--acc: oklch(0.47 0.1 325); display: grid; grid-template-columns: 26px 1fr auto; gap: 12px; align-items: center; padding: 12px 0; border-bottom: 1px solid var(--hair);\"><div class=\"gly\"><span style=\"display:grid;gap:3px;justify-items:start\"><span style=\"width:6px;height:1.5px;background:var(--acc)\"><\u002Fspan><span style=\"width:11px;height:1.5px;background:var(--acc)\"><\u002Fspan><span style=\"width:15px;height:1.5px;background:var(--acc)\"><\u002Fspan><\u002Fspan><\u002Fdiv><span style=\"color: var(--soft);\">12 · Автономия и связь<\u002Fspan><span class=\"num\" style=\"color: var(--acc);\">28<\u002Fspan><\u002Fdiv>\n<div style=\"--acc: oklch(0.47 0.1 350); display: grid; grid-template-columns: 26px 1fr auto; gap: 12px; align-items: center; padding: 12px 0; border-bottom: 1px solid var(--hair);\"><div class=\"gly\"><span style=\"width:15px;height:15px;border:1.5px dashed var(--acc);border-radius:50%;display:block\"><\u002Fspan><\u002Fdiv><span style=\"color: var(--soft);\">13 · Питание<\u002Fspan><span class=\"num\" style=\"color: var(--acc);\">31<\u002Fspan><\u002Fdiv>\n<div style=\"--acc: oklch(0.47 0.1 15); display: grid; grid-template-columns: 26px 1fr auto; gap: 12px; align-items: center; padding: 12px 0; border-bottom: 1px solid var(--hair);\"><div class=\"gly\"><span style=\"width:14px;height:14px;border:1.5px solid var(--acc);border-left-width:4px;border-radius:50%;display:block\"><\u002Fspan><\u002Fdiv><span style=\"color: var(--soft);\">14 · Срок и завершение<\u002Fspan><span class=\"num\" style=\"color: var(--acc);\">34<\u002Fspan><\u002Fdiv>\n<p class=\"note\" style=\"margin: 10px 0 0;\">За теорией каждого шага идёт страница с полями для предварительного заполнения.<\u002Fp>\n<\u002Fdiv>\n<div>\n<span class=\"lbl\">Часть II · Чистовой паспорт<\u002Fspan>\n<div style=\"--acc: oklch(0.47 0.1 30); display: grid; grid-template-columns: 26px 1fr auto; gap: 12px; align-items: center; padding: 12px 0; border-bottom: 1px solid var(--hair);\"><div class=\"gly\"><span style=\"width:15px;height:15px;border:1.5px solid var(--acc);border-radius:50%;display:block;position:relative\"><span style=\"position:absolute;inset:4.5px;background:var(--acc);border-radius:50%\"><\u002Fspan><\u002Fspan><\u002Fdiv><span style=\"color: var(--soft);\">Как переносить решения<\u002Fspan><span class=\"num\" style=\"color: var(--acc);\">37<\u002Fspan><\u002Fdiv>\n<div style=\"--acc: oklch(0.47 0.1 55); display: grid; grid-template-columns: 26px 1fr auto; gap: 12px; align-items: center; padding: 12px 0; border-bottom: 1px solid var(--hair);\"><div class=\"gly\"><span style=\"display:flex;align-items:center\"><span style=\"width:12px;height:1.5px;background:var(--acc)\"><\u002Fspan><span style=\"width:6px;height:6px;border-top:1.5px solid var(--acc);border-right:1.5px solid var(--acc);transform:rotate(45deg);margin-left:-4px\"><\u002Fspan><\u002Fspan><\u002Fdiv><span style=\"color: var(--soft);\">01 · Проблема и задача<\u002Fspan><span class=\"num\" style=\"color: var(--acc);\">38<\u002Fspan><\u002Fdiv>\n<div style=\"--acc: oklch(0.47 0.1 120); display: grid; grid-template-columns: 26px 1fr auto; gap: 12px; align-items: center; padding: 12px 0; border-bottom: 1px solid var(--hair);\"><div class=\"gly\"><span style=\"width:15px;height:15px;border:1.5px solid var(--acc);position:relative;display:block\"><span style=\"position:absolute;left:50%;top:0;bottom:0;width:1.5px;background:var(--acc)\"><\u002Fspan><\u002Fspan><\u002Fdiv><span style=\"color: var(--soft);\">02 · Функция и критерии<\u002Fspan><span class=\"num\" style=\"color: var(--acc);\">39<\u002Fspan><\u002Fdiv>\n<div style=\"--acc: oklch(0.47 0.1 85); display: grid; grid-template-columns: 26px 1fr auto; gap: 12px; align-items: center; padding: 12px 0; border-bottom: 1px solid var(--hair);\"><div class=\"gly\"><span style=\"display:grid;gap:3px\"><span style=\"width:16px;height:1.5px;background:var(--acc);display:block\"><\u002Fspan><span style=\"width:16px;height:1.5px;background:var(--acc);display:block\"><\u002Fspan><span style=\"width:16px;height:1.5px;background:var(--acc);display:block\"><\u002Fspan><\u002Fspan><\u002Fdiv><span style=\"color: var(--soft);\">03 · Действия и сценарии<\u002Fspan><span class=\"num\" style=\"color: var(--acc);\">40<\u002Fspan><\u002Fdiv>\n<div style=\"--acc: oklch(0.47 0.1 150); display: grid; grid-template-columns: 26px 1fr auto; gap: 12px; align-items: center; padding: 12px 0; border-bottom: 1px solid var(--hair);\"><div class=\"gly\"><span style=\"width:14px;height:14px;border:1.5px solid var(--acc);border-radius:50%;position:relative;display:block\"><span style=\"position:absolute;left:50%;top:-4px;bottom:-4px;width:1.5px;background:var(--acc);transform:translateX(-50%)\"><\u002Fspan><\u002Fspan><\u002Fdiv><span style=\"color: var(--soft);\">04 · Имя и сигила<\u002Fspan><span class=\"num\" style=\"color: var(--acc);\">41<\u002Fspan><\u002Fdiv>\n<div style=\"--acc: oklch(0.47 0.1 200); display: grid; grid-template-columns: 26px 1fr auto; gap: 12px; align-items: center; padding: 12px 0; border-bottom: 1px solid var(--hair);\"><div class=\"gly\"><span style=\"display:flex\"><span style=\"width:11px;height:11px;border:1.5px solid var(--acc);border-radius:50%\"><\u002Fspan><span style=\"width:11px;height:11px;border:1.5px solid var(--acc);border-radius:50%;margin-left:-4px\"><\u002Fspan><\u002Fspan><\u002Fdiv><span style=\"color: var(--soft);\">05 · Форма<\u002Fspan><span class=\"num\" style=\"color: var(--acc);\">42<\u002Fspan><\u002Fdiv>\n<div style=\"--acc: oklch(0.47 0.1 225); display: grid; grid-template-columns: 26px 1fr auto; gap: 12px; align-items: center; padding: 12px 0; border-bottom: 1px solid var(--hair);\"><div class=\"gly\"><span style=\"width:16px;height:16px;border:1.5px solid var(--acc);display:flex;align-items:center;justify-content:center\"><span style=\"width:6px;height:6px;background:var(--acc)\"><\u002Fspan><\u002Fspan><\u002Fdiv><span style=\"color: var(--soft);\">06 · Анкер и активация<\u002Fspan><span class=\"num\" style=\"color: var(--acc);\">43<\u002Fspan><\u002Fdiv>\n<div style=\"--acc: oklch(0.47 0.1 325); display: grid; grid-template-columns: 26px 1fr auto; gap: 12px; align-items: center; padding: 12px 0; border-bottom: 1px solid var(--hair);\"><div class=\"gly\"><span style=\"display:grid;gap:3px;justify-items:start\"><span style=\"width:6px;height:1.5px;background:var(--acc)\"><\u002Fspan><span style=\"width:11px;height:1.5px;background:var(--acc)\"><\u002Fspan><span style=\"width:15px;height:1.5px;background:var(--acc)\"><\u002Fspan><\u002Fspan><\u002Fdiv><span style=\"color: var(--soft);\">07 · Автономия и связь<\u002Fspan><span class=\"num\" style=\"color: var(--acc);\">44<\u002Fspan><\u002Fdiv>\n<div style=\"--acc: oklch(0.47 0.1 275); display: grid; grid-template-columns: 26px 1fr auto; gap: 12px; align-items: center; padding: 12px 0; border-bottom: 1px solid var(--hair);\"><div class=\"gly\"><span style=\"display:flex;gap:3px\"><span style=\"width:4px;height:4px;border-radius:50%;background:var(--acc)\"><\u002Fspan><span style=\"width:4px;height:4px;border-radius:50%;background:var(--acc)\"><\u002Fspan><span style=\"width:4px;height:4px;border-radius:50%;background:var(--acc)\"><\u002Fspan><\u002Fspan><\u002Fdiv><span style=\"color: var(--soft);\">08 · Разрешения и запреты<\u002Fspan><span class=\"num\" style=\"color: var(--acc);\">45<\u002Fspan><\u002Fdiv>\n<div style=\"--acc: oklch(0.47 0.1 300); display: grid; grid-template-columns: 26px 1fr auto; gap: 12px; align-items: center; padding: 12px 0; border-bottom: 1px solid var(--hair);\"><div class=\"gly\"><span style=\"width:15px;height:15px;border:1.5px solid var(--acc);position:relative;display:block;overflow:hidden\"><span style=\"position:absolute;left:-4px;right:-4px;top:50%;height:1.5px;background:var(--acc);transform:rotate(-45deg)\"><\u002Fspan><\u002Fspan><\u002Fdiv><span style=\"color: var(--soft);\">09 · Всегда и никогда<\u002Fspan><span class=\"num\" style=\"color: var(--acc);\">46<\u002Fspan><\u002Fdiv>\n<div style=\"--acc: oklch(0.47 0.1 350); display: grid; grid-template-columns: 26px 1fr auto; gap: 12px; align-items: center; padding: 12px 0; border-bottom: 1px solid var(--hair);\"><div class=\"gly\"><span style=\"width:15px;height:15px;border:1.5px dashed var(--acc);border-radius:50%;display:block\"><\u002Fspan><\u002Fdiv><span style=\"color: var(--soft);\">10 · Питание<\u002Fspan><span class=\"num\" style=\"color: var(--acc);\">47<\u002Fspan><\u002Fdiv>\n<div style=\"--acc: oklch(0.47 0.1 15); display: grid; grid-template-columns: 26px 1fr auto; gap: 12px; align-items: center; padding: 12px 0; border-bottom: 1px solid var(--hair);\"><div class=\"gly\"><span style=\"width:14px;height:14px;border:1.5px solid var(--acc);border-left-width:4px;border-radius:50%;display:block\"><\u002Fspan><\u002Fdiv><span style=\"color: var(--soft);\">11 · Тесты и завершение<\u002Fspan><span class=\"num\" style=\"color: var(--acc);\">48<\u002Fspan><\u002Fdiv>\n<div style=\"--acc: oklch(0.47 0.1 30); display: grid; grid-template-columns: 26px 1fr auto; gap: 12px; align-items: center; padding: 12px 0; border-bottom: 1px solid var(--hair);\"><div class=\"gly\"><span style=\"width:15px;height:15px;border:1.5px solid var(--acc);border-radius:50%;display:block;position:relative\"><span style=\"position:absolute;inset:4.5px;background:var(--acc);border-radius:50%\"><\u002Fspan><\u002Fspan><\u002Fdiv><span style=\"color: var(--soft);\">Источники<\u002Fspan><span class=\"num\" style=\"color: var(--acc);\">49<\u002Fspan><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<div class=\"ft\"><span>Содержание<\u002Fspan><span>@levorules<\u002Fspan><span class=\"pg\"><\u002Fspan><\u002Fdiv>\n<\u002Fsection>\n\n<section class=\"page\" data-screen-label=\"05 Шаг 01 теория\" style=\"--acc: oklch(0.47 0.1 30); --acc2: oklch(0.6 0.08 30);\">\n<div class=\"hd\"><span>Часть I · Черновик<\u002Fspan><span><b>Шаг 01<\u002Fb> · Точка старта<\u002Fspan><\u002Fdiv>\n<div class=\"stepline\"><div class=\"gly\"><span style=\"width:17px;height:17px;border:1.5px solid var(--acc);border-radius:50%;display:block\"><\u002Fspan><\u002Fdiv><div class=\"step\" style=\"margin: 0;\">Шаг 01 · Точка старта<\u002Fdiv><\u002Fdiv>\n<h1>С чего начинается сервитор<\u002Fh1>\n<p class=\"lede\">Создание сервитора начинается с определения ситуации, которая тебя не устраивает. Пока не нужно придумывать имя, сигилу, характер или внешний вид. Сначала разберись, что именно происходит в реальности.<\u002Fp>\n<div class=\"stack\">\n<div class=\"cols\">\n<div>\n<h2>Сначала опиши проблему<\u002Fh2>\n<p>Опиши происходящее без магических объяснений и без попытки сразу найти решение. Тебе нужны три вещи:<\u002Fp>\n<ul>\n<li>что происходит сейчас;<\u002Fli>\n<li>как давно это продолжается;<\u002Fli>\n<li>чем это тебе мешает.<\u002Fli>\n<\u002Ful>\n<p>На этом этапе не обязательно знать, каким будет результат. Достаточно увидеть ситуацию, с которой ты действительно собираешься работать.<\u002Fp>\n<\u002Fdiv>\n<div>\n<h2>В чём именно ошибка желания<\u002Fh2>\n<p>Фраза «я хочу наконец реализовать свой потенциал» описывает желание, но почти ничего не говорит о проблеме. Непонятно, что ты откладываешь, как давно это продолжается и по каким признакам станет ясно, что ситуация изменилась.<\u002Fp>\n<div class=\"warn\" style=\"margin-top: 14px;\">\n<span class=\"lbl\">Очень частая ошибка<\u002Fspan>\n<p style=\"margin: 0;\">Сначала придумать эффектное существо, дать ему имя и способности, а потом искать, чем его занять. В таком порядке легко влюбиться в образ и подогнать под него любую проблему. <span class=\"hl\">Внешность начинает диктовать функцию, хотя должно быть ровно наоборот.<\u002Fspan><\u002Fp>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<div class=\"ex\">\n<span class=\"lbl acc\">Пример · Тенет<\u002Fspan>\n<p>«Уже несколько месяцев я возвращаюсь к личному проекту, но вместо первой рабочей версии снова переделываю начало. У меня накопились разрозненные фрагменты, но показать другим людям пока нечего. Из-за этого я не получаю обратной связи и всё сильнее сомневаюсь, что проект вообще можно закончить».<\u002Fp>\n<p style=\"margin: 0;\"><strong>Здесь ещё нет задачи для будущего сервитора.<\u002Fstrong> Зато уже видна конкретная проблема: бесконечная доработка не приводит к готовой версии.<\u002Fp>\n<\u002Fdiv>\n<div class=\"rulebox\">\n<span class=\"lbl\">Чего на этом шаге делать не нужно<\u002Fspan>\n<div class=\"cols3\" style=\"gap: 18px;\">\n<div><p style=\"margin: 0;\">Придумывать имя, сигилу или внешний вид.<\u002Fp><\u002Fdiv>\n<div><p style=\"margin: 0;\">Искать причину происходящего в магии или порче.<\u002Fp><\u002Fdiv>\n<div><p style=\"margin: 0;\">Писать команду и обещать себе результат.<\u002Fp><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<div class=\"note\" style=\"border-top: 1px solid var(--hair); padding-top: 12px;\">Не пытайся сразу написать команду сервитору. На следующей странице ты превратишь эту запись в ограниченную и проверяемую задачу.<\u002Fdiv>\n<\u002Fdiv>\n<div class=\"ft\"><span>Шаг 01 · Точка старта<\u002Fspan><span>@levorules<\u002Fspan><span class=\"pg\"><\u002Fspan><\u002Fdiv>\n<\u002Fsection>\n\n<section class=\"page\" data-screen-label=\"06 Шаг 01 поля\" style=\"--acc: oklch(0.47 0.1 30); --acc2: oklch(0.6 0.08 30);\">\n<div class=\"hd\"><span>Часть I · Черновик<\u002Fspan><span><b>Шаг 01<\u002Fb> · Поля<\u002Fspan><\u002Fdiv>\n<div class=\"stepline\"><div class=\"gly\"><span style=\"width:17px;height:17px;border:1.5px solid var(--acc);border-radius:50%;display:block\"><\u002Fspan><\u002Fdiv><div class=\"step\" style=\"margin: 0;\">Заполни<\u002Fdiv><\u002Fdiv>\n<h1>Опиши ситуацию тремя предложениями<\u002Fh1>\n<p class=\"lede\">Без магических объяснений и без решения. Только то, что можно увидеть со стороны.<\u002Fp>\n<div class=\"stack\" style=\"gap: 22px;\">\n<div class=\"f\"><span class=\"lbl\">Сейчас происходит (что именно?)<\u002Fspan><div class=\"wr wr3\"><\u002Fdiv><\u002Fdiv>\n<div class=\"cols\">\n<div class=\"f\"><span class=\"lbl\">Это продолжается (как давно?)<\u002Fspan><div class=\"wr wr2\"><\u002Fdiv><\u002Fdiv>\n<div class=\"f\"><span class=\"lbl\">Мне это мешает тем, что<\u002Fspan><div class=\"wr wr2\"><\u002Fdiv><\u002Fdiv>\n<\u002Fdiv>\n<div class=\"f\"><span class=\"lbl\">Что я уже пробовал и почему это не сработало<\u002Fspan><div class=\"wr wr3\"><\u002Fdiv><\u002Fdiv>\n<div class=\"rulebox\">\n<span class=\"lbl\">Проверь запись<\u002Fspan>\n<div class=\"stack\" style=\"gap: 9px;\">\n<label class=\"chk\"><i><\u002Fi><span>В записи нет магических объяснений происходящего.<\u002Fspan><\u002Flabel>\n<label class=\"chk\"><i><\u002Fi><span>Описана ситуация, а не желание и не готовое решение.<\u002Fspan><\u002Flabel>\n<label class=\"chk\"><i><\u002Fi><span>Понятно, как давно это длится и чему именно мешает.<\u002Fspan><\u002Flabel>\n<label class=\"chk\"><i><\u002Fi><span>Это одна проблема, а не список из нескольких.<\u002Fspan><\u002Flabel>\n<\u002Fdiv>\n<\u002Fdiv>\n<div class=\"f\"><span class=\"lbl\">Если проблем оказалось несколько — выбери одну и запиши её здесь<\u002Fspan><div class=\"ln\"><\u002Fdiv><\u002Fdiv>\n<\u002Fdiv>\n<div class=\"ft\"><span>Шаг 01 · Поля<\u002Fspan><span>@levorules<\u002Fspan><span class=\"pg\"><\u002Fspan><\u002Fdiv>\n<\u002Fsection>\n\n<section class=\"page\" data-screen-label=\"07 Шаг 02 теория\" style=\"--acc: oklch(0.47 0.1 55); --acc2: oklch(0.6 0.08 55);\">\n<div class=\"hd\"><span>Часть I · Черновик<\u002Fspan><span><b>Шаг 02<\u002Fb> · Задача<\u002Fspan><\u002Fdiv>\n<div class=\"stepline\"><div class=\"gly\"><span style=\"display:flex;align-items:center\"><span style=\"width:14px;height:1.5px;background:var(--acc)\"><\u002Fspan><span style=\"width:7px;height:7px;border-top:1.5px solid var(--acc);border-right:1.5px solid var(--acc);transform:rotate(45deg);margin-left:-5px\"><\u002Fspan><\u002Fspan><\u002Fdiv><div class=\"step\" style=\"margin: 0;\">Шаг 02 · Задача<\u002Fdiv><\u002Fdiv>\n<h1>Что именно должно произойти?<\u002Fh1>\n<p class=\"lede\">На прошлом шаге ты описал ситуацию, которая тебя не устраивает. Теперь нужно решить, что именно должно измениться.<\u002Fp>\n<div class=\"stack\">\n<div style=\"display: grid; grid-template-columns: 1fr 34px 1fr; align-items: center; gap: 0; border-top: 1px solid var(--rule); border-bottom: 1px solid var(--rule); padding: 14px 0;\">\n\n<div><span class=\"lbl\">Проблема<\u002Fspan><span style=\"font-size: 15.5px; color: var(--soft);\">Что именно тебя не устраивает в реальной ситуации сейчас<\u002Fspan><\u002Fdiv><div style=\"text-align: center; color: var(--acc); font-size: 18px;\">→<\u002Fdiv>\n<div><span class=\"lbl acc\">Задача<\u002Fspan><span style=\"font-size: 15.5px; color: var(--soft);\">Что именно должно измениться, к какому сроку и по каким границам<\u002Fspan><\u002Fdiv>\n<\u002Fdiv>\n<div class=\"cols\">\n<div>\n<h2>Четыре опоры формулировки<\u002Fh2>\n<p>Рабочая формулировка отвечает на четыре вопроса: какой результат ты хочешь получить; к какому сроку; что ты будешь делать сам; где проходят границы допустимого.<\u002Fp>\n<p>Не прописывай каждый возможный шаг — тебе нужна ясная задача, а не подробный сценарий на случай любого изменения. Но и доверенность на всю жизнь сервитору выдавать не надо: оставь ему пространство для работы в пределах одной функции.<\u002Fp>\n<\u002Fdiv>\n<div>\n<h2>Следи за масштабом<\u002Fh2>\n<p>Если одна задача одновременно обещает деньги, новую работу, любовь, здоровье и духовное величие — остановись. <span class=\"hl\">Это не задача, а сказочная мечта.<\u002Fspan><\u002Fp>\n<p>Мечтать не вредно, однако для реализации требуется декомпозиция мечты. Раздели такую конструкцию на отдельные задачи и выбери одну, с которой готов работать сейчас.<\u002Fp>\n<\u002Fdiv>\n<\u002Fdiv>\n<div class=\"cols\">\n<div class=\"warn\">\n<span class=\"lbl\">Частая ошибка<\u002Fspan>\n<p style=\"color: var(--ink); font-style: italic;\">«Сервитор избавляет меня от лени и меняет всю мою жизнь».<\u002Fp>\n<p style=\"margin: 0;\">Такое ты не проверишь. Лень — сомнительный диагноз. Мешать могут усталость, страх оценки, слишком большая задача или непонятный следующий шаг.<\u002Fp>\n<\u002Fdiv>\n<div class=\"ex\">\n<span class=\"lbl acc\">Пример · Тенет<\u002Fspan>\n<p>«До 1 сентября 2026 года этот сервитор помогает мне закончить и опубликовать первую рабочую версию личного проекта. Перед каждым из трёх еженедельных рабочих блоков он возвращает моё внимание к ближайшему выполнимому шагу. Решения принимаю я. Сервитор не вмешивается в здоровье, сон и отношения и не заменяет моих действий».<\u002Fp>\n<p style=\"margin: 0;\">Здесь есть срок, проверяемый итог, обычные действия и границы.<\u002Fp>\n<\u002Fdiv>\n<\u002Fdiv>\n<div class=\"note\" style=\"border-top: 1px solid var(--hair); padding-top: 12px;\">Прочитай формулировку вслух. Если смысл приходится долго объяснять — сократи и перепиши.<\u002Fdiv>\n<\u002Fdiv>\n<div class=\"ft\"><span>Шаг 02 · Задача<\u002Fspan><span>@levorules<\u002Fspan><span class=\"pg\"><\u002Fspan><\u002Fdiv>\n<\u002Fsection>\n\n<section class=\"page\" data-screen-label=\"08 Шаг 02 поля\" style=\"--acc: oklch(0.47 0.1 55); --acc2: oklch(0.6 0.08 55);\">\n<div class=\"hd\"><span>Часть I · Черновик<\u002Fspan><span><b>Шаг 02<\u002Fb> · Поля<\u002Fspan><\u002Fdiv>\n<div class=\"stepline\"><div class=\"gly\"><span style=\"display:flex;align-items:center\"><span style=\"width:14px;height:1.5px;background:var(--acc)\"><\u002Fspan><span style=\"width:7px;height:7px;border-top:1.5px solid var(--acc);border-right:1.5px solid var(--acc);transform:rotate(45deg);margin-left:-5px\"><\u002Fspan><\u002Fspan><\u002Fdiv><div class=\"step\" style=\"margin: 0;\">Заполни<\u002Fdiv><\u002Fdiv>\n<h1>Собери задачу из четырёх частей<\u002Fh1>\n<p class=\"lede\">Сначала четыре пункта по отдельности, затем одна связная формулировка.<\u002Fp>\n<div class=\"stack\" style=\"gap: 20px;\">\n<div class=\"cols\">\n<div class=\"f\"><span class=\"lbl\">01 · Результат<\u002Fspan><div class=\"wr wr2\"><\u002Fdiv><\u002Fdiv>\n<div class=\"f\"><span class=\"lbl\">02 · Срок<\u002Fspan><div class=\"wr wr2\"><\u002Fdiv><\u002Fdiv>\n<div class=\"f\"><span class=\"lbl\">03 · Что я делаю сам<\u002Fspan><div class=\"wr wr2\"><\u002Fdiv><\u002Fdiv>\n<div class=\"f\"><span class=\"lbl\">04 · Границы допустимого<\u002Fspan><div class=\"wr wr2\"><\u002Fdiv><\u002Fdiv>\n<\u002Fdiv>\n<div class=\"rulebox\">\n<span class=\"lbl acc\">Теперь собери их в одну формулировку<\u002Fspan>\n<div style=\"display: flex; align-items: baseline; gap: 10px; margin-bottom: 4px;\"><span style=\"font-size: 15.5px; color: var(--soft); white-space: nowrap;\">До<\u002Fspan><span style=\"flex: 1; border-bottom: 1px solid var(--rule); height: 26px;\"><\u002Fspan><span style=\"font-size: 15.5px; color: var(--soft); white-space: nowrap;\">года мой сервитор помогает мне<\u002Fspan><\u002Fdiv>\n<div class=\"wr wr3\"><\u002Fdiv>\n<\u002Fdiv>\n<div class=\"cols\">\n<div class=\"f\"><span class=\"lbl\">СЕРВИТОР НЕ ВЫХОДИТ ЗА СЛЕДУЮЩИЕ КОНКРЕТНЫЕ ГРАНИЦЫ<\u002Fspan><div class=\"wr wr2\"><\u002Fdiv><\u002Fdiv>\n<div class=\"f\"><span class=\"lbl\">ЕСЛИ РАЗМЕЧТАЛСЯ, ИЗ КАКИХ ЗАДАЧ СОСТОИТ ЭТА МЕЧТА<\u002Fspan><div class=\"wr wr2\"><\u002Fdiv><\u002Fdiv>\n<\u002Fdiv>\n<div class=\"rulebox\">\n<span class=\"lbl\">Проверь перед продолжением<\u002Fspan>\n<div class=\"cols\" style=\"gap: 10px 24px;\">\n\n<label class=\"chk\"><i><\u002Fi><span>Срок указан конкретной датой или событием.<\u002Fspan><\u002Flabel><label class=\"chk\"><i><\u002Fi><span>Задача описывает один результат.<\u002Fspan><\u002Flabel>\n<label class=\"chk\"><i><\u002Fi><span>Понятно, что делаю именно я, а не мой сервитор.<\u002Fspan><\u002Flabel>\n<label class=\"chk\"><i><\u002Fi><span>Формулировки прочитаны вслух и не требуют пояснений.<\u002Fspan><\u002Flabel>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<div class=\"ft\"><span>Шаг 02 · Поля<\u002Fspan><span>@levorules<\u002Fspan><span class=\"pg\"><\u002Fspan><\u002Fdiv>\n<\u002Fsection>\n\n<section class=\"page\" data-screen-label=\"09 Шаг 03 теория\" style=\"--acc: oklch(0.47 0.1 85); --acc2: oklch(0.6 0.08 85);\">\n<div class=\"hd\"><span>Часть I · Черновик<\u002Fspan><span><b>Шаг 03<\u002Fb> · Критерии<\u002Fspan><\u002Fdiv>\n<div class=\"stepline\"><div class=\"gly\"><span style=\"display:grid;gap:4px\"><span style=\"width:18px;height:1.5px;background:var(--acc);display:block\"><\u002Fspan><span style=\"width:18px;height:1.5px;background:var(--acc);display:block\"><\u002Fspan><span style=\"width:18px;height:1.5px;background:var(--acc);display:block\"><\u002Fspan><\u002Fspan><\u002Fdiv><div class=\"step\" style=\"margin: 0;\">Шаг 03 · Критерии<\u002Fdiv><\u002Fdiv>\n<h1>Как понять, что задача выполнена?<\u002Fh1>\n<p class=\"lede\">Определи признаки результата до начала работы, иначе позже появится соблазн объявить успехом любое приятное совпадение, необычный сон или внезапный прилив вдохновения.<\u002Fp>\n<div class=\"stack\">\n<div>\n<span class=\"lbl\">Три слоя проверки — не смешивай их<\u002Fspan>\n<div style=\"display: grid; gap: 1px; background: var(--rule); border: 1px solid var(--rule);\">\n<div style=\"display: grid; grid-template-columns: 40px 190px 1fr; gap: 16px; align-items: baseline; background: oklch(0.968 0.014 85); padding: 12px 15px;\"><span class=\"num\">01<\u002Fspan><strong>Итог<\u002Fstrong><span style=\"color: var(--soft);\">Что должно измениться в реальности. Один, наблюдаемый, датированный.<\u002Fspan><\u002Fdiv>\n<div style=\"display: grid; grid-template-columns: 40px 190px 1fr; gap: 16px; align-items: baseline; background: oklch(0.968 0.014 85); padding: 12px 15px;\"><span class=\"num\">02<\u002Fspan><strong>Ранние признаки<\u002Fstrong><span style=\"color: var(--soft);\">Что покажет движение к результату раньше, чем он наступит.<\u002Fspan><\u002Fdiv>\n<div style=\"display: grid; grid-template-columns: 40px 190px 1fr; gap: 16px; align-items: baseline; background: oklch(0.968 0.014 85); padding: 12px 15px;\"><span class=\"num\">03<\u002Fspan><strong>Твои действия<\u002Fstrong><span style=\"color: var(--soft);\">Что ты регулярно делаешь сам. Показывает, что работа идёт.<\u002Fspan><\u002Fdiv>\n<\u002Fdiv>\n\n<\u002Fdiv>\n<div class=\"cols\">\n<div>\n<h2>Критерий должен быть наблюдаемым<\u002Fh2>\n<p>Его можно записать, посчитать или подтвердить конкретным событием.<\u002Fp>\n<div class=\"warn\" style=\"margin-top: 12px;\">\n<span class=\"lbl\">Очень частая ошибка<\u002Fspan>\n<p style=\"color: var(--ink); font-style: italic;\">«Я почувствовал прилив энергии, увидел несколько совпадений и понял, что сервитор работает».<\u002Fp>\n<p style=\"margin: 0;\">Это можно записать как наблюдение, но нельзя назначать результатом задним числом. Если задача состояла в запуске проекта, главным критерием остаётся проект, который действительно стартовал и доступен другим людям.<\u002Fp>\n<\u002Fdiv>\n<\u002Fdiv>\n<div>\n<h2>Добавь правила «если — то»<\u002Fh2>\n<p>Они работают ровно потому, что решение принято до того, как ты начал испытывать трудности.<\u002Fp>\n<div class=\"card\" style=\"margin-top: 12px;\">\n<p><strong>Если<\u002Fstrong> снова начинаешь переделывать начало проекта, <strong>то<\u002Fstrong> открывай список незавершённых частей и выбирай ту, которая ближе всего к завершению.<\u002Fp>\n<p style=\"margin: 0;\"><strong>Если<\u002Fstrong> пропускаешь рабочий блок, <strong>то<\u002Fstrong> переноси его на ближайшее свободное время.<\u002Fp>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<div class=\"ex\">\n<span class=\"lbl acc\">Пример · Тенет<\u002Fspan>\n<p><strong>Итог:<\u002Fstrong> до 1 сентября 202_ года первая рабочая версия проекта опубликована и доступна по ссылке. <strong>Ранние признаки:<\u002Fstrong> собрана цельная версия; её посмотрел хотя бы один человек; исправлены ошибки, которые мешали публикации.<\u002Fp>\n<p style=\"margin: 0;\"><strong>Обычные действия:<\u002Fstrong> три раза в неделю я выделяю рабочий блок; перед началом выбираю ближайший выполнимый шаг; в конце фиксирую, что было закончено — так движение видно по завершённым действиям, а не по впечатлениям.<\u002Fp>\n<\u002Fdiv>\n<\u002Fdiv>\n<div class=\"ft\"><span>Шаг 03 · Критерии<\u002Fspan><span>@levorules<\u002Fspan><span class=\"pg\"><\u002Fspan><\u002Fdiv>\n<\u002Fsection>\n\n<section class=\"page\" data-screen-label=\"10 Шаг 03 поля\" style=\"--acc: oklch(0.47 0.1 85); --acc2: oklch(0.6 0.08 85);\">\n<div class=\"hd\"><span>Часть I · Черновик<\u002Fspan><span><b>Шаг 03<\u002Fb> · Поля<\u002Fspan><\u002Fdiv>\n<div class=\"stepline\"><div class=\"gly\"><span style=\"display:grid;gap:4px\"><span style=\"width:18px;height:1.5px;background:var(--acc);display:block\"><\u002Fspan><span style=\"width:18px;height:1.5px;background:var(--acc);display:block\"><\u002Fspan><span style=\"width:18px;height:1.5px;background:var(--acc);display:block\"><\u002Fspan><\u002Fspan><\u002Fdiv><div class=\"step\" style=\"margin: 0;\">Заполни<\u002Fdiv><\u002Fdiv>\n<h1>Критерии и правила «если — то»<\u002Fh1>\n<p class=\"lede\">Убери всё, что невозможно отличить от настроения, надежды или случайного совпадения.<\u002Fp>\n\n<div class=\"stack\" style=\"gap: 20px;\">\n<div class=\"f\"><span class=\"lbl acc\">Итоговый критерий · что изменится в реальности и к какой дате<\u002Fspan><div class=\"wr wr2\"><\u002Fdiv><\u002Fdiv>\n<div>\n<span class=\"lbl\">Три ранних признака<\u002Fspan>\n<div class=\"stack\" style=\"gap: 4px;\">\n<div style=\"display: grid; grid-template-columns: 26px 1fr; align-items: baseline; gap: 10px;\"><span class=\"num\">01<\u002Fspan><div class=\"ln\"><\u002Fdiv><\u002Fdiv>\n<div style=\"display: grid; grid-template-columns: 26px 1fr; align-items: baseline; gap: 10px;\"><span class=\"num\">02<\u002Fspan><div class=\"ln\"><\u002Fdiv><\u002Fdiv>\n<div style=\"display: grid; grid-template-columns: 26px 1fr; align-items: baseline; gap: 10px;\"><span class=\"num\">03<\u002Fspan><div class=\"ln\"><\u002Fdiv><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<div>\n<span class=\"lbl\">Три действия, которые я выполняю сам<\u002Fspan>\n<div class=\"stack\" style=\"gap: 4px;\">\n<div style=\"display: grid; grid-template-columns: 26px 1fr; align-items: baseline; gap: 10px;\"><span class=\"num\">01<\u002Fspan><div class=\"ln\"><\u002Fdiv><\u002Fdiv>\n<div style=\"display: grid; grid-template-columns: 26px 1fr; align-items: baseline; gap: 10px;\"><span class=\"num\">02<\u002Fspan><div class=\"ln\"><\u002Fdiv><\u002Fdiv>\n<div style=\"display: grid; grid-template-columns: 26px 1fr; align-items: baseline; gap: 10px;\"><span class=\"num\">03<\u002Fspan><div class=\"ln\"><\u002Fdiv><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<div class=\"rulebox\">\n<span class=\"lbl acc\">Два правила «если — то»<\u002Fspan>\n<div class=\"stack\" style=\"gap: 12px;\">\n<div>\n<div style=\"display: flex; align-items: baseline; gap: 10px;\"><span style=\"font-size: 15.5px; color: var(--soft);\">Если<\u002Fspan><span style=\"flex: 1; border-bottom: 1px solid var(--rule); height: 26px;\"><\u002Fspan><\u002Fdiv>\n<div style=\"display: flex; align-items: baseline; gap: 10px;\"><span style=\"font-size: 15.5px; color: var(--soft);\">то я<\u002Fspan><span style=\"flex: 1; border-bottom: 1px solid var(--rule); height: 26px;\"><\u002Fspan><\u002Fdiv>\n<\u002Fdiv>\n<div>\n<div style=\"display: flex; align-items: baseline; gap: 10px;\"><span style=\"font-size: 15.5px; color: var(--soft);\">Если<\u002Fspan><span style=\"flex: 1; border-bottom: 1px solid var(--rule); height: 26px;\"><\u002Fspan><\u002Fdiv>\n<div style=\"display: flex; align-items: baseline; gap: 10px;\"><span style=\"font-size: 15.5px; color: var(--soft);\">то я<\u002Fspan><span style=\"flex: 1; border-bottom: 1px solid var(--rule); height: 26px;\"><\u002Fspan><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<div class=\"f\"><span class=\"lbl\">Что я НЕ буду считать доказательством результата<\u002Fspan><div class=\"ln\"><\u002Fdiv><\u002Fdiv>\n<\u002Fdiv><div class=\"ln\"><\u002Fdiv><div class=\"ft\"><span>Шаг 03 · Поля<\u002Fspan><span>@levorules<\u002Fspan><span class=\"pg\"><\u002Fspan><\u002Fdiv>\n<\u002Fsection>\n\n<section class=\"page\" data-screen-label=\"11 Шаг 04 теория\" style=\"--acc: oklch(0.47 0.1 120); --acc2: oklch(0.6 0.08 120);\">\n<div class=\"hd\"><span>Часть I · Черновик<\u002Fspan><span><b>Шаг 04<\u002Fb> · Функция и область<\u002Fspan><\u002Fdiv>\n<div class=\"stepline\"><div class=\"gly\"><span style=\"width:17px;height:17px;border:1.5px solid var(--acc);position:relative;display:block\"><span style=\"position:absolute;left:50%;top:0;bottom:0;width:1.5px;background:var(--acc)\"><\u002Fspan><\u002Fspan><\u002Fdiv><div class=\"step\" style=\"margin: 0;\">Шаг 04 · Функция и область<\u002Fdiv><\u002Fdiv>\n<h1>Что именно делает сервитор?<\u002Fh1>\n<p class=\"lede\">Задача и критерии определены. Теперь нужно решить, что именно будет делать сервитор и где происходит его работа. Это два разных вопроса, и смешивать их не стоит.<\u002Fp>\n<div class=\"stack\">\n<div style=\"display: grid; grid-template-columns: 1fr 1fr; gap: 1px; background: var(--rule); border: 1px solid var(--rule);\">\n<div style=\"background: oklch(0.968 0.014 85); padding: 13px 15px;\"><span class=\"lbl acc\">Функция — что делает?<\u002Fspan><span style=\"color: var(--soft);\">Короткий глагол: находит, напоминает, отслеживает, возвращает внимание, отсекает лишнее, помогает завершать начатое.<\u002Fspan><\u002Fdiv>\n<div style=\"background: oklch(0.968 0.014 85); padding: 13px 15px;\"><span class=\"lbl\">Область — где происходит?<\u002Fspan><span style=\"color: var(--soft);\">Слой реальности, в котором работа идёт. «Творчество», «деньги», «отношения» — это области, но ещё не функции.<\u002Fspan><\u002Fdiv>\n<\u002Fdiv>\n<div>\n<span class=\"lbl\">Три основные области<\u002Fspan>\n<div class=\"cols3\">\n<div class=\"card\"><div class=\"num\" style=\"margin-bottom: 6px;\">01 · Материальная<\u002Fdiv><p style=\"margin: 0;\">Вещи, деньги, тело и наблюдаемые события.<\u002Fp><\u002Fdiv>\n<div class=\"card\"><div class=\"num\" style=\"margin-bottom: 6px;\">02 · Информационная<\u002Fdiv><p style=\"margin: 0;\">Документы, сообщения, знания, медиа, цифровая среда.<\u002Fp><\u002Fdiv>\n<div class=\"card\"><div class=\"num\" style=\"margin-bottom: 6px;\">03 · Психическая<\u002Fdiv><p style=\"margin: 0;\">Внимание, состояния и привычки самого практика.<\u002Fp><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<div class=\"cols\">\n<div>\n<h2>Одна задача — одна функция<\u002Fh2>\n<p>Несколько действий допустимы, если они составляют один рабочий механизм. Например: сервитор возвращает внимание к ближайшему шагу, <em>чтобы<\u002Fem> рабочий блок завершался готовым фрагментом.<\u002Fp>\n<p>Одна задача может затрагивать несколько областей — выбери основную. Дополнительную добавляй только тогда, когда без неё функция действительно не работает.<\u002Fp>\n<p style=\"margin: 0;\">Область не расширяет полномочия автоматически: работа с вниманием во время проекта не даёт права вмешиваться в сон или здоровье.<\u002Fp>\n<\u002Fdiv>\n<div>\n<div class=\"warn\">\n<span class=\"lbl\">Очень частая ошибка<\u002Fspan>\n<p style=\"color: var(--ink); font-style: italic;\">«Сервитор помогает мне с проектом, деньгами, дисциплиной, отношениями, уверенностью и поиском предназначения».<\u002Fp>\n<p style=\"margin: 0;\">Это не функция, а целый отдел с руководителем, который сам не знает, чего хочет. Раздели список на задачи и оставь то, что ведёт к результату.<\u002Fp>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<div class=\"ex\">\n<span class=\"lbl acc\">Пример · Тенет<\u002Fspan>\n<p><strong>Функция:<\u002Fstrong> перед каждым рабочим блоком возвращать внимание к ближайшему выполнимому шагу, чтобы работа завершалась конкретным результатом.<\u002Fp>\n<p style=\"margin: 0;\"><strong>Область:<\u002Fstrong> основная — психическая (внимание и привычка снова переделывать начатое); дополнительная — информационная (список задач, структура проекта). Деньги, отношения, здоровье и другие проекты в эту работу не входят.<\u002Fp>\n<\u002Fdiv>\n<\u002Fdiv>\n<div class=\"ft\"><span>Шаг 04 · Функция и область<\u002Fspan><span>@levorules<\u002Fspan><span class=\"pg\"><\u002Fspan><\u002Fdiv>\n<\u002Fsection>\n\n<section class=\"page\" data-screen-label=\"12 Шаг 04 поля\" style=\"--acc: oklch(0.47 0.1 120); --acc2: oklch(0.6 0.08 120);\">\n<div class=\"hd\"><span>Часть I · Черновик<\u002Fspan><span><b>Шаг 04<\u002Fb> · Поля<\u002Fspan><\u002Fdiv>\n<div class=\"stepline\"><div class=\"gly\"><span style=\"width:17px;height:17px;border:1.5px solid var(--acc);position:relative;display:block\"><span style=\"position:absolute;left:50%;top:0;bottom:0;width:1.5px;background:var(--acc)\"><\u002Fspan><\u002Fspan><\u002Fdiv><div class=\"step\" style=\"margin: 0;\">Заполни<\u002Fdiv><\u002Fdiv>\n<h1>Функция, область и границы<\u002Fh1>\n<p class=\"lede\">Если сервитор отвечает сразу за половину твоей жизни — вернись назад и сузь функцию.<\u002Fp>\n<div class=\"stack\" style=\"gap: 20px;\">\n<div class=\"rulebox\">\n<span class=\"lbl acc\">Основная функция<\u002Fspan>\n<div style=\"display: flex; align-items: baseline; gap: 10px;\"><span style=\"color: var(--soft); white-space: nowrap;\">Мой сервитор<\u002Fspan><span style=\"flex: 1; border-bottom: 1px solid var(--rule); height: 26px;\"><\u002Fspan><\u002Fdiv>\n<div class=\"wr wr2\"><\u002Fdiv>\n<\u002Fdiv>\n<div>\n<span class=\"lbl\">Основная область<\u002Fspan>\n<div class=\"chkrow\" style=\"margin-bottom: 12px;\">\n<label class=\"chk\"><i><\u002Fi><span>Материальная<\u002Fspan><\u002Flabel>\n<label class=\"chk\"><i><\u002Fi><span>Информационная<\u002Fspan><\u002Flabel>\n<label class=\"chk\"><i><\u002Fi><span>Психическая<\u002Fspan><\u002Flabel>\n<\u002Fdiv>\n<div class=\"f\"><span class=\"lbl\">Почему эта область связана с задачей<\u002Fspan><div class=\"wr wr2\"><\u002Fdiv><\u002Fdi
