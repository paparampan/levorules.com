# Cloudflare Worker + Static Assets — site root is served as static files.
# Required name must match the Worker project already created in CF dashboard.
name = "levorules-com"
compatibility_date = "2024-10-01"

# Serve only the production artifact assembled by `npm run build`.
# Never point this at the repository root: it contains .git, node_modules,
# source JSX, build tools and design drafts.
[assets]
directory = "./public"
