<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 784" width="400" height="784" role="img" aria-label="Лестница действий. Всегда: остановить магическую работу на 3–7 дней, душ и уборка, вода, еда и сон, знакомое закрытие практики, разговор с близким. Умеренная тревога или неприятные сны — наблюдать несколько дней. Не проходит или мешает спать и работать — психолог, психотерапевт или врач, не дожидаясь конца паузы. Впервые голоса, галлюцинации, спутанность — медицинская оценка в тот же день. Голоса приказывают навредить или есть риск — неотложная помощь."><defs><marker id="f09-esli-stalo-ne-po-sebe-ah-bone" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#E8E2D3"/></marker><marker id="f09-esli-stalo-ne-po-sebe-ah-dim" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8C8879"/></marker><marker id="f09-esli-stalo-ne-po-sebe-ah-purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C050FF"/></marker><marker id="f09-esli-stalo-ne-po-sebe-ah-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#FF5A5A"/></marker><marker id="f09-esli-stalo-ne-po-sebe-ah-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#FFB800"/></marker></defs><rect width="400" height="784" fill="#0A0A0A"/><text x="20" y="28" font-family="'Space Mono', 'JetBrains Mono', ui-monospace, monospace" font-size="10.5" fill="#C050FF" letter-spacing="1.2"><tspan x="20" dy="0">▸ СХЕМА · § 3.6</tspan></text><text x="20" y="56" font-family="Oswald, Impact, 'Arial Narrow', sans-serif" font-size="21" fill="#E8E2D3" font-weight="500" letter-spacing="0.3"><tspan x="20" dy="0">ЕСЛИ СТАЛО НЕ ПО СЕБЕ</tspan></text><rect x="16" y="72" width="368" height="137" rx="2" fill="#141414" stroke="#E8E2D3" stroke-width="1"/><text x="30" y="94" font-family="'Space Mono', 'JetBrains Mono', ui-monospace, monospace" font-size="10" fill="#E8E2D3" letter-spacing="1"><tspan x="30" dy="0">СНАЧАЛА — ВСЕГДА</tspan></text><text x="30" y="116" font-family="'IBM Plex Sans', 'Segoe UI', system-ui, sans-serif" font-size="12.5" fill="#E8E2D3"><tspan x="30" dy="0">▸ остановить магическую работу на 3–7 дней</tspan></text><text x="30" y="135" font-family="'IBM Plex Sans', 'Segoe UI', system-ui, sans-serif" font-size="12.5" fill="#E8E2D3"><tspan x="30" dy="0">▸ душ, свежая одежда, уборка места</tspan></text><text x="30" y="154" font-family="'IBM Plex Sans', 'Segoe UI', system-ui, sans-serif" font-size="12.5" fill="#E8E2D3"><tspan x="30" dy="0">▸ вода, обычная еда, сон, спокойное дыхание</tspan></text><text x="30" y="173" font-family="'IBM Plex Sans', 'Segoe UI', system-ui, sans-serif" font-size="12.5" fill="#E8E2D3"><tspan x="30" dy="0">▸ знакомое мягкое закрытие практики</tspan></text><text x="30" y="192" font-family="'IBM Plex Sans', 'Segoe UI', system-ui, sans-serif" font-size="12.5" fill="#E8E2D3"><tspan x="30" dy="0">▸ разговор с живым человеком, которому доверяешь</tspan></text><line x1="200" y1="211" x2="200" y2="231" stroke="#8C8879" stroke-width="1.4" marker-end="url(#f09-esli-stalo-ne-po-sebe-ah-dim)" stroke-linecap="butt"/><rect x="16" y="235" width="368" height="94" rx="2" fill="#FFB800" fill-opacity="0.06" stroke="#FFB800" stroke-width="1"/><rect x="16" y="235" width="5" height="94" fill="#FFB800"/><text x="32" y="255" font-family="'Space Mono', 'JetBrains Mono', ui-monospace, monospace" font-size="10" fill="#FFB800" letter-spacing="1"><tspan x="32" dy="0">ЕСЛИ</tspan></text><text x="32" y="273" font-family="'IBM Plex Sans', 'Segoe UI', system-ui, sans-serif" font-size="12.5" fill="#E8E2D3"><tspan x="32" dy="0">умеренная тревога, навязчивое внимание, неприятные</tspan><tspan x="32" dy="16">сны</tspan></text><text x="32" y="313" font-family="Oswald, Impact, 'Arial Narrow', sans-serif" font-size="15" fill="#FFB800" font-weight="500" letter-spacing="0.2"><tspan x="32" dy="0">→ понаблюдать несколько дней</tspan></text><line x1="200" y1="331" x2="200" y2="351" stroke="#8C8879" stroke-width="1.4" marker-end="url(#f09-esli-stalo-ne-po-sebe-ah-dim)" stroke-linecap="butt"/><rect x="16" y="355" width="368" height="97" rx="2" fill="#FFB800" fill-opacity="0.06" stroke="#FFB800" stroke-width="1"/><rect x="16" y="355" width="5" height="97" fill="#FFB800"/><text x="32" y="375" font-family="'Space Mono', 'JetBrains Mono', ui-monospace, monospace" font-size="10" fill="#FFB800" letter-spacing="1"><tspan x="32" dy="0">ЕСЛИ</tspan></text><text x="32" y="393" font-family="'IBM Plex Sans', 'Segoe UI', system-ui, sans-serif" font-size="12.5" fill="#E8E2D3"><tspan x="32" dy="0">не ослабевает, мешает спать или работать</tspan></text><text x="32" y="417" font-family="Oswald, Impact, 'Arial Narrow', sans-serif" font-size="15" fill="#FFB800" font-weight="500" letter-spacing="0.2"><tspan x="32" dy="0">→ психолог, психотерапевт или врач — не</tspan><tspan x="32" dy="19">дожидаясь конца паузы</tspan></text><line x1="200" y1="454" x2="200" y2="474" stroke="#8C8879" stroke-width="1.4" marker-end="url(#f09-esli-stalo-ne-po-sebe-ah-dim)" stroke-linecap="butt"/><rect x="16" y="478" width="368" height="110" rx="2" fill="#FF5A5A" fill-opacity="0.06" stroke="#FF5A5A" stroke-width="1"/><rect x="16" y="478" width="5" height="110" fill="#FF5A5A"/><text x="32" y="498" font-family="'Space Mono', 'JetBrains Mono', ui-monospace, monospace" font-size="10" fill="#FF5A5A" letter-spacing="1"><tspan x="32" dy="0">ЕСЛИ</tspan></text><text x="32" y="516" font-family="'IBM Plex Sans', 'Segoe UI', system-ui, sans-serif" font-size="12.5" fill="#E8E2D3"><tspan x="32" dy="0">впервые голоса или галлюцинации, заметная</tspan><tspan x="32" dy="16">спутанность, резкое возбуждение, убеждённость в</tspan><tspan x="32" dy="16">преследовании</tspan></text><text x="32" y="572" font-family="Oswald, Impact, 'Arial Narrow', sans-serif" font-size="15" fill="#FF5A5A" font-weight="500" letter-spacing="0.2"><tspan x="32" dy="0">→ медицинская оценка в тот же день</tspan></text><line x1="200" y1="590" x2="200" y2="610" stroke="#8C8879" stroke-width="1.4" marker-end="url(#f09-esli-stalo-ne-po-sebe-ah-dim)" stroke-linecap="butt"/><rect x="16" y="614" width="368" height="94" rx="2" fill="#FF5A5A" fill-opacity="0.16" stroke="#FF5A5A" stroke-width="2"/><rect x="16" y="614" width="5" height="94" fill="#FF5A5A"/><text x="32" y="634" font-family="'Space Mono', 'JetBrains Mono', ui-monospace, monospace" font-size="10" fill="#FF5A5A" letter-spacing="1"><tspan x="32" dy="0">ЕСЛИ</tspan></text><text x="32" y="652" font-family="'IBM Plex Sans', 'Segoe UI', system-ui, sans-serif" font-size="12.5" fill="#E8E2D3"><tspan x="32" dy="0">голоса приказывают причинить вред, есть риск для</tspan><tspan x="32" dy="16">себя или других, состояние быстро ухудшается</tspan></text><rect x="26" y="674" width="348" height="26" rx="1" fill="#FF5A5A" stroke="none" stroke-width="1"/><text x="32" y="692" font-family="Oswald, Impact, 'Arial Narrow', sans-serif" font-size="15" fill="#0A0A0A" font-weight="500" letter-spacing="0.2"><tspan x="32" dy="0">→ неотложная помощь</tspan></text><text x="20" y="732" font-family="'IBM Plex Sans', 'Segoe UI', system-ui, sans-serif" font-size="12" fill="#8C8879"><tspan x="20" dy="0">Наставник-маг может поддержать понятным языком, но</tspan><tspan x="20" dy="16">только после медицинской помощи или вместе с ней, а не</tspan><tspan x="20" dy="16">вместо неё.</tspan></text></svg>