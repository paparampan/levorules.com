<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 528" width="400" height="528" role="img" aria-label="Дерево: оператор вызывает диспетчера; диспетчер распределяет задачи между направлениями «Клиенты», «Финансы» и «Защита» и получает от них результат. Под двумя направлениями — узлы третьего уровня, отмеченные как необязательные для первого опыта. Прямой вызов направления — только в особых случаях. Риски: нечёткие границы между направлениями и незаметный сбой одного сервитора."><defs><marker id="f17-set-servitorov-ah-bone" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#E8E2D3"/></marker><marker id="f17-set-servitorov-ah-dim" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8C8879"/></marker><marker id="f17-set-servitorov-ah-purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C050FF"/></marker><marker id="f17-set-servitorov-ah-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#FF5A5A"/></marker><marker id="f17-set-servitorov-ah-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#FFB800"/></marker></defs><rect width="400" height="528" fill="#0A0A0A"/><text x="20" y="28" font-family="'Space Mono', 'JetBrains Mono', ui-monospace, monospace" font-size="10.5" fill="#C050FF" letter-spacing="1.2"><tspan x="20" dy="0">▸ СХЕМА · § 6.2</tspan></text><text x="20" y="56" font-family="Oswald, Impact, 'Arial Narrow', sans-serif" font-size="21" fill="#E8E2D3" font-weight="500" letter-spacing="0.3"><tspan x="20" dy="0">СЕТЬ СЕРВИТОРОВ</tspan></text><rect x="140" y="78" width="120" height="34" rx="2" fill="#141414" stroke="#E8E2D3" stroke-width="1"/><text x="200" y="100" font-family="Oswald, Impact, 'Arial Narrow', sans-serif" font-size="15" fill="#E8E2D3" font-weight="500" text-anchor="middle" letter-spacing="0.5"><tspan x="200" dy="0">ОПЕРАТОР</tspan></text><rect x="100" y="164" width="200" height="52" rx="2" fill="#C050FF" fill-opacity="0.18" stroke="#C050FF" stroke-width="2"/><text x="200" y="187" font-family="Oswald, Impact, 'Arial Narrow', sans-serif" font-size="16" fill="#E8E2D3" font-weight="500" text-anchor="middle" letter-spacing="0.5"><tspan x="200" dy="0">ДИСПЕТЧЕР</tspan></text><text x="200" y="205" font-family="'IBM Plex Sans', 'Segoe UI', system-ui, sans-serif" font-size="11" fill="#8C8879" text-anchor="middle"><tspan x="200" dy="0">создаётся последним</tspan></text><line x1="200" y1="112" x2="200" y2="162" stroke="#C050FF" stroke-width="2" marker-end="url(#f17-set-servitorov-ah-purple)" stroke-linecap="butt"/><text x="210" y="142" font-family="'Space Mono', 'JetBrains Mono', ui-monospace, monospace" font-size="9.5" fill="#8C8879"><tspan x="210" dy="0">обычный вызов</tspan></text><line x1="200" y1="216" x2="72" y2="282" stroke="#C050FF" stroke-width="1.6" marker-end="url(#f17-set-servitorov-ah-purple)" stroke-linecap="butt"/><rect x="16" y="284" width="112" height="40" rx="2" fill="#141414" stroke="#3D3D3D" stroke-width="1"/><text x="72" y="309" font-family="Oswald, Impact, 'Arial Narrow', sans-serif" font-size="13.5" fill="#E8E2D3" font-weight="500" text-anchor="middle" letter-spacing="0.4"><tspan x="72" dy="0">КЛИЕНТЫ</tspan></text><line x1="200" y1="216" x2="200" y2="282" stroke="#C050FF" stroke-width="1.6" marker-end="url(#f17-set-servitorov-ah-purple)" stroke-linecap="butt"/><rect x="144" y="284" width="112" height="40" rx="2" fill="#141414" stroke="#3D3D3D" stroke-width="1"/><text x="200" y="309" font-family="Oswald, Impact, 'Arial Narrow', sans-serif" font-size="13.5" fill="#E8E2D3" font-weight="500" text-anchor="middle" letter-spacing="0.4"><tspan x="200" dy="0">ФИНАНСЫ</tspan></text><line x1="200" y1="216" x2="328" y2="282" stroke="#C050FF" stroke-width="1.6" marker-end="url(#f17-set-servitorov-ah-purple)" stroke-linecap="butt"/><rect x="272" y="284" width="112" height="40" rx="2" fill="#141414" stroke="#3D3D3D" stroke-width="1"/><text x="328" y="309" font-family="Oswald, Impact, 'Arial Narrow', sans-serif" font-size="13.5" fill="#E8E2D3" font-weight="500" text-anchor="middle" letter-spacing="0.4"><tspan x="328" dy="0">ЗАЩИТА</tspan></text><text x="132" y="260" font-family="'Space Mono', 'JetBrains Mono', ui-monospace, monospace" font-size="9.5" fill="#C050FF"><tspan x="132" dy="0">распределяет</tspan></text><path d="M30,284 C30,256 60,194 98,194" fill="none" stroke="#8C8879" stroke-width="1.3" stroke-dasharray="4 4" marker-end="url(#f17-set-servitorov-ah-dim)" stroke-linecap="round" stroke-linejoin="round"/><text x="46" y="250" font-family="'Space Mono', 'JetBrains Mono', ui-monospace, monospace" font-size="9" fill="#8C8879"><tspan x="46" dy="0">результат</tspan></text><path d="M260,95 L364,95 Q374,95 374,105 L374,280" fill="none" stroke="#8C8879" stroke-width="1.3" stroke-dasharray="2 4" marker-end="url(#f17-set-servitorov-ah-dim)" stroke-linecap="round" stroke-linejoin="round"/><text x="366" y="186" font-family="'Space Mono', 'JetBrains Mono', ui-monospace, monospace" font-size="9" fill="#8C8879" text-anchor="end"><tspan x="366" dy="0">прямой</tspan><tspan x="366" dy="12">вызов —</tspan><tspan x="366" dy="12">в особых</tspan><tspan x="366" dy="12">случаях</tspan></text><line x1="72" y1="324" x2="72" y2="360" stroke="#8C8879" stroke-width="1.2" stroke-dasharray="3 3" marker-end="url(#f17-set-servitorov-ah-dim)" stroke-linecap="butt"/><rect x="30" y="362" width="84" height="30" rx="2" fill="none" stroke="#3D3D3D" stroke-width="1" stroke-dasharray="4 3"/><text x="72" y="382" font-family="'IBM Plex Sans', 'Segoe UI', system-ui, sans-serif" font-size="11.5" fill="#8C8879" text-anchor="middle"><tspan x="72" dy="0">узел</tspan></text><line x1="200" y1="324" x2="200" y2="360" stroke="#8C8879" stroke-width="1.2" stroke-dasharray="3 3" marker-end="url(#f17-set-servitorov-ah-dim)" stroke-linecap="butt"/><rect x="158" y="362" width="84" height="30" rx="2" fill="none" stroke="#3D3D3D" stroke-width="1" stroke-dasharray="4 3"/><text x="200" y="382" font-family="'IBM Plex Sans', 'Segoe UI', system-ui, sans-serif" font-size="11.5" fill="#8C8879" text-anchor="middle"><tspan x="200" dy="0">узел</tspan></text><text x="272" y="374" font-family="'Space Mono', 'JetBrains Mono', ui-monospace, monospace" font-size="9" fill="#8C8879"><tspan x="272" dy="0">3-й уровень:</tspan><tspan x="272" dy="12">для первого опыта</tspan><tspan x="272" dy="12">не нужен</tspan></text><line x1="20" y1="414" x2="380" y2="414" stroke="#2A2A2A" stroke-width="1" stroke-linecap="butt"/><rect x="20" y="427" width="8" height="8" fill="#FF5A5A"/><text x="38" y="436" font-family="'IBM Plex Sans', 'Segoe UI', system-ui, sans-serif" font-size="12" fill="#E8E2D3"><tspan x="38" dy="0">нечёткие границы между направлениями → внутренние</tspan><tspan x="38" dy="16">конфликты</tspan></text><rect x="20" y="463" width="8" height="8" fill="#FF5A5A"/><text x="38" y="472" font-family="'IBM Plex Sans', 'Segoe UI', system-ui, sans-serif" font-size="12" fill="#E8E2D3"><tspan x="38" dy="0">один сервитор заброшен, а схема делает вид, что всё в</tspan><tspan x="38" dy="16">порядке</tspan></text><rect x="20" y="499" width="8" height="8" fill="#C050FF"/><text x="38" y="508" font-family="'IBM Plex Sans', 'Segoe UI', system-ui, sans-serif" font-size="12" fill="#E8E2D3"><tspan x="38" dy="0">первый опыт: два сервитора под диспетчером, два уровня</tspan></text></svg>