<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 802" width="400" height="802" role="img" aria-label="Лестница из пяти уровней автономии от A0 «разовая команда» до A4 «прото-эгрегор» с примерами и ритмом кормления. Уровни A0 и A1 отмечены как стартовые. Риск отдать решения образу растёт сверху вниз. После A4 — граница: нет единого центра управления, начинается эгрегор."><defs><marker id="f06-shkala-avtonomii-ah-bone" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#E8E2D3"/></marker><marker id="f06-shkala-avtonomii-ah-dim" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8C8879"/></marker><marker id="f06-shkala-avtonomii-ah-purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C050FF"/></marker><marker id="f06-shkala-avtonomii-ah-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#FF5A5A"/></marker><marker id="f06-shkala-avtonomii-ah-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#FFB800"/></marker></defs><rect width="400" height="802" fill="#0A0A0A"/><text x="20" y="28" font-family="'Space Mono', 'JetBrains Mono', ui-monospace, monospace" font-size="10.5" fill="#C050FF" letter-spacing="1.2"><tspan x="20" dy="0">▸ СХЕМА · § 2.4</tspan></text><text x="20" y="56" font-family="Oswald, Impact, 'Arial Narrow', sans-serif" font-size="21" fill="#E8E2D3" font-weight="500" letter-spacing="0.3"><tspan x="20" dy="0">ШКАЛА АВТОНОМИИ</tspan></text><text x="20" y="78" font-family="'Space Mono', 'JetBrains Mono', ui-monospace, monospace" font-size="9.5" fill="#8C8879" letter-spacing="0.8"><tspan x="20" dy="0">РИСК ПРИНЯТЬ СВОЙ ИМПУЛЬС ЗА ВОЛЮ СУЩЕСТВА</tspan></text><rect x="36" y="92" width="348" height="255" rx="2" fill="#C050FF" fill-opacity="0.08" stroke="#C050FF" stroke-width="1"/><text x="376" y="108" font-family="'Space Mono', 'JetBrains Mono', ui-monospace, monospace" font-size="9.5" fill="#C050FF" text-anchor="end" letter-spacing="1"><tspan x="376" dy="0">НАЧИНАТЬ ЗДЕСЬ</tspan></text><text x="48" y="118" font-family="Oswald, Impact, 'Arial Narrow', sans-serif" font-size="24" fill="#C050FF" font-weight="500"><tspan x="48" dy="0">A0</tspan></text><text x="96" y="114" font-family="Oswald, Impact, 'Arial Narrow', sans-serif" font-size="14" fill="#E8E2D3" font-weight="500" letter-spacing="0.3"><tspan x="96" dy="0">РАЗОВАЯ КОМАНДА</tspan></text><text x="96" y="132" font-family="'IBM Plex Sans', 'Segoe UI', system-ui, sans-serif" font-size="12" fill="#E8E2D3"><tspan x="96" dy="0">Одно намерение на одно событие, потом работа</tspan><tspan x="96" dy="16">заканчивается.</tspan></text><text x="96" y="166" font-family="'IBM Plex Sans', 'Segoe UI', system-ui, sans-serif" font-size="11.5" fill="#8C8879" font-style="italic"><tspan x="96" dy="0">напр.: сохранить спокойствие на завтрашней</tspan><tspan x="96" dy="15">встрече</tspan></text><text x="96" y="199" font-family="'Space Mono', 'JetBrains Mono', ui-monospace, monospace" font-size="9.5" fill="#8C8879"><tspan x="96" dy="0">ритм: отдельное кормление не нужно</tspan></text><text x="48" y="239" font-family="Oswald, Impact, 'Arial Narrow', sans-serif" font-size="24" fill="#C050FF" font-weight="500"><tspan x="48" dy="0">A1</tspan></text><text x="96" y="235" font-family="Oswald, Impact, 'Arial Narrow', sans-serif" font-size="14" fill="#E8E2D3" font-weight="500" letter-spacing="0.3"><tspan x="96" dy="0">УПРАВЛЯЕМАЯ ПОДПРОГРАММА</tspan></text><text x="96" y="253" font-family="'IBM Plex Sans', 'Segoe UI', system-ui, sans-serif" font-size="12" fill="#E8E2D3"><tspan x="96" dy="0">Недели или месяцы, одна задача, вызов по</tspan><tspan x="96" dy="16">мере надобности.</tspan></text><text x="96" y="287" font-family="'IBM Plex Sans', 'Segoe UI', system-ui, sans-serif" font-size="11.5" fill="#8C8879" font-style="italic"><tspan x="96" dy="0">напр.: возвращать спокойствие в квартиру</tspan><tspan x="96" dy="15">после тяжёлых визитов</tspan></text><text x="96" y="320" font-family="'Space Mono', 'JetBrains Mono', ui-monospace, monospace" font-size="9.5" fill="#8C8879"><tspan x="96" dy="0">ритм: короткие обращения, полное кормление раз в</tspan><tspan x="96" dy="13">неделю</tspan></text><line x1="36" y1="347" x2="384" y2="347" stroke="#2A2A2A" stroke-width="1" stroke-linecap="butt"/><text x="48" y="373" font-family="Oswald, Impact, 'Arial Narrow', sans-serif" font-size="24" fill="#E8E2D3" font-weight="500"><tspan x="48" dy="0">A2</tspan></text><text x="96" y="369" font-family="Oswald, Impact, 'Arial Narrow', sans-serif" font-size="14" fill="#E8E2D3" font-weight="500" letter-spacing="0.3"><tspan x="96" dy="0">АКТИВНЫЙ АГЕНТ</tspan></text><text x="96" y="387" font-family="'IBM Plex Sans', 'Segoe UI', system-ui, sans-serif" font-size="12" fill="#E8E2D3"><tspan x="96" dy="0">Считается, что работает между вызовами;</tspan><tspan x="96" dy="16">результат сверяется с дневником.</tspan></text><text x="96" y="421" font-family="'IBM Plex Sans', 'Segoe UI', system-ui, sans-serif" font-size="11.5" fill="#8C8879" font-style="italic"><tspan x="96" dy="0">напр.: напоминает замечать темы и поводы для</tspan><tspan x="96" dy="15">канала</tspan></text><text x="96" y="454" font-family="'Space Mono', 'JetBrains Mono', ui-monospace, monospace" font-size="9.5" fill="#8C8879"><tspan x="96" dy="0">ритм: контакт несколько раз в неделю, проверка</tspan><tspan x="96" dy="13">раз в месяц</tspan></text><line x1="36" y1="481" x2="384" y2="481" stroke="#2A2A2A" stroke-width="1" stroke-linecap="butt"/><text x="48" y="507" font-family="Oswald, Impact, 'Arial Narrow', sans-serif" font-size="24" fill="#E8E2D3" font-weight="500"><tspan x="48" dy="0">A3</tspan></text><text x="96" y="503" font-family="Oswald, Impact, 'Arial Narrow', sans-serif" font-size="14" fill="#E8E2D3" font-weight="500" letter-spacing="0.3"><tspan x="96" dy="0">ПОЛУАВТОНОМНОЕ СУЩЕСТВО</tspan></text><text x="96" y="521" font-family="'IBM Plex Sans', 'Segoe UI', system-ui, sans-serif" font-size="12" fill="#E8E2D3"><tspan x="96" dy="0">Характер и целая область вместо одной</tspan><tspan x="96" dy="16">задачи; последнее слово за человеком.</tspan></text><text x="96" y="555" font-family="'IBM Plex Sans', 'Segoe UI', system-ui, sans-serif" font-size="11.5" fill="#8C8879" font-style="italic"><tspan x="96" dy="0">напр.: секретарь всего проекта</tspan></text><text x="96" y="573" font-family="'Space Mono', 'JetBrains Mono', ui-monospace, monospace" font-size="9.5" fill="#8C8879"><tspan x="96" dy="0">ритм: как у A2, проверка особенно строгая</tspan></text><line x1="36" y1="587" x2="384" y2="587" stroke="#2A2A2A" stroke-width="1" stroke-linecap="butt"/><text x="48" y="613" font-family="Oswald, Impact, 'Arial Narrow', sans-serif" font-size="24" fill="#E8E2D3" font-weight="500"><tspan x="48" dy="0">A4</tspan></text><text x="96" y="609" font-family="Oswald, Impact, 'Arial Narrow', sans-serif" font-size="14" fill="#E8E2D3" font-weight="500" letter-spacing="0.3"><tspan x="96" dy="0">ПРОТО-ЭГРЕГОР</tspan></text><text x="96" y="627" font-family="'IBM Plex Sans', 'Segoe UI', system-ui, sans-serif" font-size="12" fill="#E8E2D3"><tspan x="96" dy="0">Образ живёт в группе: его кормят и толкуют</tspan><tspan x="96" dy="16">разные люди.</tspan></text><text x="96" y="661" font-family="'IBM Plex Sans', 'Segoe UI', system-ui, sans-serif" font-size="11.5" fill="#8C8879" font-style="italic"><tspan x="96" dy="0">напр.: символ бренда с историей, которую</tspan><tspan x="96" dy="15">придумало сообщество</tspan></text><text x="96" y="694" font-family="'Space Mono', 'JetBrains Mono', ui-monospace, monospace" font-size="9.5" fill="#8C8879"><tspan x="96" dy="0">ритм: ритм задают участники</tspan></text><defs><linearGradient id="f06-shkala-avtonomii-risk" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8C8879" stop-opacity="0.5"/><stop offset="1" stop-color="#FF5A5A"/></linearGradient></defs><rect x="20" y="92" width="6" height="616" fill="url(#f06-shkala-avtonomii-risk)"/><path d="M23,706 l-6,-10 h12 z" fill="#FF5A5A" stroke="none" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><line x1="16" y1="724" x2="384" y2="724" stroke="#FF5A5A" stroke-width="1.5" stroke-dasharray="6 4" stroke-linecap="butt"/><text x="20" y="748" font-family="'Space Mono', 'JetBrains Mono', ui-monospace, monospace" font-size="10" fill="#FF5A5A" letter-spacing="1"><tspan x="20" dy="0">ГРАНИЦА</tspan></text><text x="92" y="748" font-family="'IBM Plex Sans', 'Segoe UI', system-ui, sans-serif" font-size="12" fill="#E8E2D3"><tspan x="92" dy="0">Единого центра управления больше нет: дальше</tspan><tspan x="92" dy="16">эгрегор, а не личный инструмент практика</tspan><tspan x="92" dy="16">(§ 6.1).</tspan></text></svg>