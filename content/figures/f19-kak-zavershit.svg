<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 754" width="400" height="754" role="img" aria-label="Дерево решений. Есть страх, навязчивость или потеря контроля — срочная деактивация. Если нет, что с задачей: выполнена, срок вышел или потеряла смысл — при ярком характере образа и отсутствии привязки к дому, человеку или проекту отпуск, иначе обычная деактивация; задача та же, но результата нет — сначала разбор по параграфу 5.4, если не помог — обычная деактивация; задача изменилась — трансмутация, если новая задача в той же области, сервитор работает и это первая или вторая переделка, иначе завершить и собрать нового."><defs><marker id="f19-kak-zavershit-ah-bone" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#E8E2D3"/></marker><marker id="f19-kak-zavershit-ah-dim" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8C8879"/></marker><marker id="f19-kak-zavershit-ah-purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C050FF"/></marker><marker id="f19-kak-zavershit-ah-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#FF5A5A"/></marker><marker id="f19-kak-zavershit-ah-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#FFB800"/></marker></defs><rect width="400" height="754" fill="#0A0A0A"/><text x="20" y="28" font-family="'Space Mono', 'JetBrains Mono', ui-monospace, monospace" font-size="10.5" fill="#C050FF" letter-spacing="1.2"><tspan x="20" dy="0">▸ СХЕМА · МОДУЛЬ 7</tspan></text><text x="20" y="56" font-family="Oswald, Impact, 'Arial Narrow', sans-serif" font-size="21" fill="#E8E2D3" font-weight="500" letter-spacing="0.3"><tspan x="20" dy="0">КАК ЗАВЕРШИТЬ ПРАКТИКУ</tspan></text><rect x="16" y="72" width="368" height="57" rx="2" fill="#141414" stroke="#E8E2D3" stroke-width="1.2"/><text x="30" y="96" font-family="'IBM Plex Sans', 'Segoe UI', system-ui, sans-serif" font-size="13" fill="#E8E2D3"><tspan x="30" dy="0">Есть страх, навязчивость или ощущение потери</tspan><tspan x="30" dy="17">контроля?</tspan></text><line x1="300" y1="129" x2="300" y2="149" stroke="#FF5A5A" stroke-width="1.5" marker-end="url(#f19-kak-zavershit-ah-red)" stroke-linecap="butt"/><text x="308" y="143" font-family="'Space Mono', 'JetBrains Mono', ui-monospace, monospace" font-size="10" fill="#FF5A5A"><tspan x="308" dy="0">да</tspan></text><line x1="60" y1="129" x2="60" y2="149" stroke="#8C8879" stroke-width="1.5" stroke-linecap="butt"/><rect x="150" y="151" width="234" height="82" rx="2" fill="#FF5A5A" fill-opacity="0.1" stroke="#FF5A5A" stroke-width="1.5"/><text x="160" y="171" font-family="Oswald, Impact, 'Arial Narrow', sans-serif" font-size="13.5" fill="#FF5A5A" font-weight="500" letter-spacing="0.3"><tspan x="160" dy="0">СРОЧНАЯ ДЕАКТИВАЦИЯ</tspan></text><text x="374" y="171" font-family="'Space Mono', 'JetBrains Mono', ui-monospace, monospace" font-size="9.5" fill="#8C8879" text-anchor="end"><tspan x="374" dy="0">§ 7.2</tspan></text><text x="160" y="191" font-family="'IBM Plex Sans', 'Segoe UI', system-ui, sans-serif" font-size="11" fill="#8C8879"><tspan x="160" dy="0">без истории об «отпуске»; потом</tspan><tspan x="160" dy="14">пауза; при голосах и спутанности —</tspan><tspan x="160" dy="14">помощь (§ 3.6)</tspan></text><line x1="60" y1="149" x2="60" y2="251" stroke="#8C8879" stroke-width="1.5" marker-end="url(#f19-kak-zavershit-ah-dim)" stroke-linecap="butt"/><text x="68" y="165" font-family="'Space Mono', 'JetBrains Mono', ui-monospace, monospace" font-size="10" fill="#8C8879"><tspan x="68" dy="0">нет</tspan></text><rect x="16" y="255" width="368" height="40" rx="2" fill="#141414" stroke="#E8E2D3" stroke-width="1.2"/><text x="30" y="279" font-family="'IBM Plex Sans', 'Segoe UI', system-ui, sans-serif" font-size="13" fill="#E8E2D3"><tspan x="30" dy="0">Что с задачей?</tspan></text><rect x="16" y="307" width="3" height="144" fill="#3D3D3D"/><text x="30" y="327" font-family="'IBM Plex Sans', 'Segoe UI', system-ui, sans-serif" font-size="12" fill="#E8E2D3"><tspan x="30" dy="0">выполнена, срок</tspan><tspan x="30" dy="15">вышел или</tspan><tspan x="30" dy="15">потеряла смысл</tspan></text><text x="160" y="320" font-family="'IBM Plex Sans', 'Segoe UI', system-ui, sans-serif" font-size="11.5" fill="#8C8879"><tspan x="160" dy="0">Яркий характер, есть симпатия, и</tspan><tspan x="160" dy="15">образ не привязан к дому, человеку</tspan><tspan x="160" dy="15">или проекту?</tspan></text><rect x="156" y="362" width="228" height="32" rx="2" fill="#C050FF" fill-opacity="0.1" stroke="#C050FF" stroke-width="1.5"/><text x="166" y="382" font-family="Oswald, Impact, 'Arial Narrow', sans-serif" font-size="13.5" fill="#C050FF" font-weight="500" letter-spacing="0.3"><tspan x="166" dy="0">да → ОТПУСК</tspan></text><text x="374" y="382" font-family="'Space Mono', 'JetBrains Mono', ui-monospace, monospace" font-size="9.5" fill="#8C8879" text-anchor="end"><tspan x="374" dy="0">§ 7.4</tspan></text><rect x="156" y="402" width="228" height="49" rx="2" fill="#E8E2D3" fill-opacity="0.1" stroke="#E8E2D3" stroke-width="1.5"/><text x="166" y="422" font-family="Oswald, Impact, 'Arial Narrow', sans-serif" font-size="13.5" fill="#E8E2D3" font-weight="500" letter-spacing="0.3"><tspan x="166" dy="0">нет → ОБЫЧНАЯ</tspan><tspan x="166" dy="17">ДЕАКТИВАЦИЯ</tspan></text><text x="374" y="422" font-family="'Space Mono', 'JetBrains Mono', ui-monospace, monospace" font-size="9.5" fill="#8C8879" text-anchor="end"><tspan x="374" dy="0">§ 7.2</tspan></text><line x1="140" y1="321" x2="150" y2="321" stroke="#8C8879" stroke-width="1.5" marker-end="url(#f19-kak-zavershit-ah-dim)" stroke-linecap="butt"/><rect x="16" y="467" width="3" height="68" fill="#3D3D3D"/><text x="30" y="487" font-family="'IBM Plex Sans', 'Segoe UI', system-ui, sans-serif" font-size="12" fill="#E8E2D3"><tspan x="30" dy="0">та же, но заранее</tspan><tspan x="30" dy="15">названного</tspan><tspan x="30" dy="15">результата нет</tspan></text><rect x="156" y="467" width="228" height="68" rx="2" fill="#E8E2D3" fill-opacity="0.1" stroke="#E8E2D3" stroke-width="1.5"/><text x="166" y="487" font-family="Oswald, Impact, 'Arial Narrow', sans-serif" font-size="13.5" fill="#E8E2D3" font-weight="500" letter-spacing="0.3"><tspan x="166" dy="0">СНАЧАЛА РАЗБОР</tspan></text><text x="374" y="487" font-family="'Space Mono', 'JetBrains Mono', ui-monospace, monospace" font-size="9.5" fill="#8C8879" text-anchor="end"><tspan x="374" dy="0">§ 5.4</tspan></text><text x="166" y="507" font-family="'IBM Plex Sans', 'Segoe UI', system-ui, sans-serif" font-size="11" fill="#8C8879"><tspan x="166" dy="0">коррекция или перепрошивка; не</tspan><tspan x="166" dy="14">помогло — обычная деактивация</tspan></text><line x1="140" y1="481" x2="150" y2="481" stroke="#8C8879" stroke-width="1.5" marker-end="url(#f19-kak-zavershit-ah-dim)" stroke-linecap="butt"/><rect x="16" y="551" width="3" height="144" fill="#3D3D3D"/><text x="30" y="571" font-family="'IBM Plex Sans', 'Segoe UI', system-ui, sans-serif" font-size="12" fill="#E8E2D3"><tspan x="30" dy="0">изменилась</tspan></text><text x="160" y="564" font-family="'IBM Plex Sans', 'Segoe UI', system-ui, sans-serif" font-size="11.5" fill="#8C8879"><tspan x="160" dy="0">Новая задача в той же области,</tspan><tspan x="160" dy="15">сервитор работает, и это первая или</tspan><tspan x="160" dy="15">вторая переделка?</tspan></text><rect x="156" y="606" width="228" height="32" rx="2" fill="#C050FF" fill-opacity="0.1" stroke="#C050FF" stroke-width="1.5"/><text x="166" y="626" font-family="Oswald, Impact, 'Arial Narrow', sans-serif" font-size="13.5" fill="#C050FF" font-weight="500" letter-spacing="0.3"><tspan x="166" dy="0">да → ТРАНСМУТАЦИЯ</tspan></text><text x="374" y="626" font-family="'Space Mono', 'JetBrains Mono', ui-monospace, monospace" font-size="9.5" fill="#8C8879" text-anchor="end"><tspan x="374" dy="0">§ 7.5</tspan></text><rect x="156" y="646" width="228" height="49" rx="2" fill="#E8E2D3" fill-opacity="0.1" stroke="#E8E2D3" stroke-width="1.5"/><text x="166" y="666" font-family="Oswald, Impact, 'Arial Narrow', sans-serif" font-size="13.5" fill="#E8E2D3" font-weight="500" letter-spacing="0.3"><tspan x="166" dy="0">нет → ЗАВЕРШИТЬ И СОЗДАТЬ</tspan><tspan x="166" dy="17">НОВОГО</tspan></text><text x="374" y="666" font-family="'Space Mono', 'JetBrains Mono', ui-monospace, monospace" font-size="9.5" fill="#8C8879" text-anchor="end"><tspan x="374" dy="0"></tspan></text><line x1="140" y1="565" x2="150" y2="565" stroke="#8C8879" stroke-width="1.5" marker-end="url(#f19-kak-zavershit-ah-dim)" stroke-linecap="butt"/><text x="20" y="719" font-family="'IBM Plex Sans', 'Segoe UI', system-ui, sans-serif" font-size="11.5" fill="#8C8879"><tspan x="20" dy="0">Материалы уничтожают только безопасными и законными</tspan><tspan x="20" dy="15">способами — и не в раздражении.</tspan></text></svg>