<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 851" width="400" height="851" role="img" aria-label="Диаграмма Эйлера: внутри области «мыслеформы» находятся сервитор с четырьмя признаками и тульпа; эгрегор частично пересекается с сервитором в зоне A4 и выходит за пределы мыслеформ. Вне мыслеформ — ангелы, демоны и божества; голем, гомункул и фамильяр; интроект и части в IFS."><defs><marker id="f02-sosednie-ponyatiya-ah-bone" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#E8E2D3"/></marker><marker id="f02-sosednie-ponyatiya-ah-dim" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8C8879"/></marker><marker id="f02-sosednie-ponyatiya-ah-purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C050FF"/></marker><marker id="f02-sosednie-ponyatiya-ah-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#FF5A5A"/></marker><marker id="f02-sosednie-ponyatiya-ah-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#FFB800"/></marker></defs><rect width="400" height="851" fill="#0A0A0A"/><text x="20" y="28" font-family="'Space Mono', 'JetBrains Mono', ui-monospace, monospace" font-size="10.5" fill="#C050FF" letter-spacing="1.2"><tspan x="20" dy="0">▸ СХЕМА · § 0.2</tspan></text><text x="20" y="56" font-family="Oswald, Impact, 'Arial Narrow', sans-serif" font-size="21" fill="#E8E2D3" font-weight="500" letter-spacing="0.3"><tspan x="20" dy="0">СЕРВИТОР И СОСЕДНИЕ ПОНЯТИЯ</tspan></text><rect x="16" y="72" width="368" height="296" rx="4" fill="none" stroke="#8C8879" stroke-width="1" stroke-dasharray="4 4"/><text x="28" y="92" font-family="'Space Mono', 'JetBrains Mono', ui-monospace, monospace" font-size="10" fill="#E8E2D3" letter-spacing="1"><tspan x="28" dy="0">МЫСЛЕФОРМЫ</tspan></text><text x="28" y="108" font-family="'IBM Plex Sans', 'Segoe UI', system-ui, sans-serif" font-size="11" fill="#8C8879"><tspan x="28" dy="0">образы, которые создают и</tspan><tspan x="28" dy="14">поддерживают мыслью</tspan></text><circle cx="262" cy="324" r="78" fill="#E8E2D3" fill-opacity="0.04" stroke="#E8E2D3" stroke-width="1.2"/><circle cx="136" cy="244" r="98" fill="#C050FF" fill-opacity="0.12" stroke="#C050FF" stroke-width="2"/><text x="136" y="208" font-family="Oswald, Impact, 'Arial Narrow', sans-serif" font-size="20" fill="#E8E2D3" font-weight="500" text-anchor="middle" letter-spacing="0.5"><tspan x="136" dy="0">СЕРВИТОР</tspan></text><text x="136" y="234" font-family="'IBM Plex Sans', 'Segoe UI', system-ui, sans-serif" font-size="12.5" fill="#E8E2D3" text-anchor="middle"><tspan x="136" dy="0">задача</tspan></text><text x="136" y="253" font-family="'IBM Plex Sans', 'Segoe UI', system-ui, sans-serif" font-size="12.5" fill="#E8E2D3" text-anchor="middle"><tspan x="136" dy="0">режим работы</tspan></text><text x="136" y="272" font-family="'IBM Plex Sans', 'Segoe UI', system-ui, sans-serif" font-size="12.5" fill="#E8E2D3" text-anchor="middle"><tspan x="136" dy="0">имя · форма · сигила</tspan></text><text x="136" y="291" font-family="'IBM Plex Sans', 'Segoe UI', system-ui, sans-serif" font-size="12.5" fill="#E8E2D3" text-anchor="middle"><tspan x="136" dy="0">управляемость</tspan></text><text x="207.44212815247803" y="293.3600813666527" font-family="'Space Mono', 'JetBrains Mono', ui-monospace, monospace" font-size="10.5" fill="#C050FF" font-weight="700" text-anchor="middle"><tspan x="207.44212815247803" dy="0">A4</tspan></text><text x="286" y="314" font-family="Oswald, Impact, 'Arial Narrow', sans-serif" font-size="15" fill="#E8E2D3" font-weight="500" text-anchor="middle"><tspan x="286" dy="0">ЭГРЕГОР</tspan></text><text x="282" y="331" font-family="'IBM Plex Sans', 'Segoe UI', system-ui, sans-serif" font-size="11" fill="#8C8879" text-anchor="middle"><tspan x="282" dy="0">образ группы,</tspan><tspan x="282" dy="14">без одного автора</tspan></text><circle cx="318" cy="160" r="50" fill="#E8E2D3" fill-opacity="0.04" stroke="#E8E2D3" stroke-width="1.2"/><text x="318" y="154" font-family="Oswald, Impact, 'Arial Narrow', sans-serif" font-size="15" fill="#E8E2D3" font-weight="500" text-anchor="middle"><tspan x="318" dy="0">ТУЛЬПА</tspan></text><text x="318" y="171" font-family="'IBM Plex Sans', 'Segoe UI', system-ui, sans-serif" font-size="11" fill="#8C8879" text-anchor="middle"><tspan x="318" dy="0">спутник, а не</tspan><tspan x="318" dy="14">исполнитель</tspan></text><text x="20" y="432" font-family="'Space Mono', 'JetBrains Mono', ui-monospace, monospace" font-size="10" fill="#E8E2D3" letter-spacing="1"><tspan x="20" dy="0">ЗА ПРЕДЕЛАМИ МЫСЛЕФОРМ</tspan></text><rect x="16" y="452" width="368" height="67" rx="2" fill="#141414" stroke="#2A2A2A" stroke-width="1"/><text x="30" y="470" font-family="'Space Mono', 'JetBrains Mono', ui-monospace, monospace" font-size="10" fill="#8C8879" letter-spacing="1"><tspan x="30" dy="0">СУЩЕСТВУЮТ ДО МАГА</tspan></text><text x="30" y="489" font-family="'IBM Plex Sans', 'Segoe UI', system-ui, sans-serif" font-size="13.5" fill="#E8E2D3"><tspan x="30" dy="0">ангел · демон · божество</tspan></text><text x="30" y="507" font-family="'IBM Plex Sans', 'Segoe UI', system-ui, sans-serif" font-size="11" fill="#8C8879"><tspan x="30" dy="0">их призывают, а не создают</tspan></text><rect x="16" y="527" width="368" height="81" rx="2" fill="#141414" stroke="#2A2A2A" stroke-width="1"/><text x="30" y="545" font-family="'Space Mono', 'JetBrains Mono', ui-monospace, monospace" font-size="10" fill="#8C8879" letter-spacing="1"><tspan x="30" dy="0">ПОХОЖИЙ МОТИВ</tspan></text><text x="30" y="564" font-family="'IBM Plex Sans', 'Segoe UI', system-ui, sans-serif" font-size="13.5" fill="#E8E2D3"><tspan x="30" dy="0">голем · гомункул · фамильяр</tspan></text><text x="30" y="582" font-family="'IBM Plex Sans', 'Segoe UI', system-ui, sans-serif" font-size="11" fill="#8C8879"><tspan x="30" dy="0">сотворённый или найденный помощник: сходство, а не</tspan><tspan x="30" dy="14">родословная</tspan></text><rect x="16" y="616" width="368" height="67" rx="2" fill="#141414" stroke="#2A2A2A" stroke-width="1"/><text x="30" y="634" font-family="'Space Mono', 'JetBrains Mono', ui-monospace, monospace" font-size="10" fill="#8C8879" letter-spacing="1"><tspan x="30" dy="0">ПСИХОЛОГИЧЕСКИЕ МОДЕЛИ</tspan></text><text x="30" y="653" font-family="'IBM Plex Sans', 'Segoe UI', system-ui, sans-serif" font-size="13.5" fill="#E8E2D3"><tspan x="30" dy="0">интроект · «часть» в IFS</tspan></text><text x="30" y="671" font-family="'IBM Plex Sans', 'Segoe UI', system-ui, sans-serif" font-size="11" fill="#8C8879"><tspan x="30" dy="0">складываются в отношениях; для курса только аналогия</tspan></text><text x="20" y="705" font-family="'Space Mono', 'JetBrains Mono', ui-monospace, monospace" font-size="10" fill="#C050FF" letter-spacing="1"><tspan x="20" dy="0">ЕСЛИ ПРИЗНАКА НЕТ</tspan></text><text x="20" y="735" font-family="'IBM Plex Sans', 'Segoe UI', system-ui, sans-serif" font-size="12.5" fill="#8C8879"><tspan x="20" dy="0">нет задачи</tspan></text><text x="160" y="735" font-family="'IBM Plex Sans', 'Segoe UI', system-ui, sans-serif" font-size="13" fill="#8C8879"><tspan x="160" dy="0">→</tspan></text><text x="186" y="735" font-family="'IBM Plex Sans', 'Segoe UI', system-ui, sans-serif" font-size="12.5" fill="#E8E2D3"><tspan x="186" dy="0">просто красивый образ</tspan></text><text x="20" y="765" font-family="'IBM Plex Sans', 'Segoe UI', system-ui, sans-serif" font-size="12.5" fill="#8C8879"><tspan x="20" dy="0">нет имени и формы</tspan></text><text x="160" y="765" font-family="'IBM Plex Sans', 'Segoe UI', system-ui, sans-serif" font-size="13" fill="#8C8879"><tspan x="160" dy="0">→</tspan></text><text x="186" y="765" font-family="'IBM Plex Sans', 'Segoe UI', system-ui, sans-serif" font-size="12.5" fill="#E8E2D3"><tspan x="186" dy="0">скорее состояние, чем</tspan><tspan x="186" dy="16">существо</tspan></text><text x="20" y="811" font-family="'IBM Plex Sans', 'Segoe UI', system-ui, sans-serif" font-size="12.5" fill="#8C8879"><tspan x="20" dy="0">нет управления</tspan></text><text x="160" y="811" font-family="'IBM Plex Sans', 'Segoe UI', system-ui, sans-serif" font-size="13" fill="#8C8879"><tspan x="160" dy="0">→</tspan></text><text x="186" y="811" font-family="'IBM Plex Sans', 'Segoe UI', system-ui, sans-serif" font-size="12.5" fill="#FF5A5A"><tspan x="186" dy="0">остановить практику и вернуть</tspan><tspan x="186" dy="16">себе решения</tspan></text></svg>