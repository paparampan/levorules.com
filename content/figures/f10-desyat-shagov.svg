<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 553" width="400" height="553" role="img" aria-label="Пять недель. Неделя 1: задача, имя, сигила, форма, прошивка. Неделя 2: договор, анкер и выбор протокола. Затем проверка перед ритуалом: прочитаны параграфы 5.5, 7.2 и модуль 9, записан порядок остановки. Неделя 3: ритуал зачатия. Неделя 4: три испытания. Неделя 5 и дальше: обычная работа по модулю 5. Шаг 10, хранение записей, идёт через все недели."><defs><marker id="f10-desyat-shagov-ah-bone" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#E8E2D3"/></marker><marker id="f10-desyat-shagov-ah-dim" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8C8879"/></marker><marker id="f10-desyat-shagov-ah-purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C050FF"/></marker><marker id="f10-desyat-shagov-ah-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#FF5A5A"/></marker><marker id="f10-desyat-shagov-ah-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#FFB800"/></marker></defs><rect width="400" height="553" fill="#0A0A0A"/><text x="20" y="28" font-family="'Space Mono', 'JetBrains Mono', ui-monospace, monospace" font-size="10.5" fill="#C050FF" letter-spacing="1.2"><tspan x="20" dy="0">▸ СХЕМА · МОДУЛЬ 4</tspan></text><text x="20" y="56" font-family="Oswald, Impact, 'Arial Narrow', sans-serif" font-size="21" fill="#E8E2D3" font-weight="500" letter-spacing="0.3"><tspan x="20" dy="0">ДЕСЯТЬ ШАГОВ ЗА ПЯТЬ НЕДЕЛЬ</tspan></text><text x="20" y="94" font-family="Oswald, Impact, 'Arial Narrow', sans-serif" font-size="15" fill="#E8E2D3" font