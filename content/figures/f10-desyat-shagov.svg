ce Mono', 'JetBrains Mono', ui-monospace, monospace" font-size="9" fill="#8C8879"><tspan x="20" dy="0">§ 4.8</tspan></text><rect x="104" y="342" width="252" height="40" rx="2" fill="#C050FF" fill-opacity="0.18" stroke="#C050FF" stroke-width="1.5"/><text x="113" y="359" font-family="'Space Mono', 'JetBrains Mono', ui-monospace, monospace" font-size="10.5" fill="#C050FF" font-weight="700"><tspan x="113" dy="0">8</tspan></text><text x="125" y="359" font-family="'IBM Plex Sans', 'Segoe UI', system-ui, sans-serif" font-size="13" fill="#E8E2D3"><tspan x="125" dy="0">Ритуал зачатия</tspan></text><text x="113" y="374" font-family="'IBM Plex Sans', 'Segoe UI', system-ui, sans-serif" font-size="10.5" fill="#8C8879"><tspan x="113" dy="0">один спокойный подготовленный сеанс</tspan></text><text x="20" y="416" font-family="Oswald, Impact, 'Arial Narrow', sans-serif" font-size="15" fill="#E8E2D3" font-weight="500"><tspan x="20" dy="0">НЕД. 4</tspan></text><text x="20" y="432" font-family="'Space Mono', 'JetBrains Mono', ui-monospace, monospace" font-size="9" fill="#8C8879"><tspan x="20" dy="0">§ 4.9</tspan></text><rect x="104" y="400" width="252" height="40" rx="2" fill="#141414" stroke="#3D3D3D" stroke-width="1"/><text x="113" y="417" font-family="'Space Mono', 'JetBrains Mono', ui-monospace, monospace" font-size="10.5" fill="#C050FF" font-weight="700"><tspan x="113" dy="0">9</tspan></text><text x="125" y="417" font-family="'IBM Plex Sans', 'Segoe UI', system-ui, sans-serif" font-size="13" fill="#E8E2D3"><tspan x="125" dy="0">Три пробных обращения</tspan></text><text x="113" y="432" font-family="'IBM Plex Sans', 'Segoe UI', system-ui, sans-serif" font-size="10.5" fill="#8C8879"><tspan x="113" dy="0">и разбор записей</tspan></text><text x="20" y="474" font-family="Oswald, Impact, 'Arial Narrow', sans-serif" font-size="15" fill="#E8E2D3" font-weight="500"><tspan x="20" dy="0">НЕД. 5+</tspan></text><text x="20" y="490" font-family="'Space Mono', 'JetBrains Mono', ui-monospace, monospace" font-size="9" fill="#8C8879"><tspan x="20" dy="0">модуль 5</tspan></text><rect x="104" y="458" width="252" height="34" rx="2" fill="none" stroke="#3D3D3D" stroke-width="1" stroke-dasharray="4 3"/><text x="114" y="479" font-family="'IBM Plex Sans', 'Segoe UI', system-ui, sans-serif" font-size="12" fill="#8C8879"><tspan x="114" dy="0">обычная работа: вызов, кормление, проверка</tspan></text><rect x="372" y="78" width="6" height="366" fill="#C050FF" fill-opacity="0.85"/><text x="392" y="261" font-family="'Space Mono', 'JetBrains Mono', ui-monospace, monospace" font-size="9.5" fill="#C050FF" text-anchor="middle" letter-spacing="0.8" transform="rotate(90 392 261)"><tspan x="392" dy="0">10 · ХРАНЕНИЕ ЗАПИСЕЙ — ПО ХОДУ ВСЕЙ РАБОТЫ</tspan></text><path d="M90,432 L90,86" fill="none" stroke="#8C8879" stroke-width="1.3" stroke-dasharray="4 4" marker-end="url(#f10-desyat-shagov-ah-dim)" stroke-linecap="round" stroke-linejoin="round"/><line x1="20" y1="514" x2="44" y2="514" stroke="#8C8879" stroke-width="1.3" stroke-dasharray="4 4"/><text x="52" y="518" font-family="'IBM Plex Sans', 'Segoe UI', system-ui, sans-serif" font-size="11.5" fill="#8C8879"><tspan x="52" dy="0">к любому шагу можно вернуться: если замысел перестал</tspan><tspan x="52" dy="15">складываться, его не проталкивают ритуалом</tspan></text></svg>