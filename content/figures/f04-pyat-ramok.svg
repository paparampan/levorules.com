<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 667" width="400" height="667" role="img" aria-label="Схема из пяти рамок: в центре автономная, точка возврата; вокруг психологическая для психогигиены, магическая для ритуального языка левого пути, информационная для цифровых сервиторов и мемов (стартовая пара вместе с автономной) и симулякрная для медиа и поп-образов. У каждой указано слабое место."><defs><marker id="f04-pyat-ramok-ah-bone" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#E8E2D3"/></marker><marker id="f04-pyat-ramok-ah-dim" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8C8879"/></marker><marker id="f04-pyat-ramok-ah-purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C050FF"/></marker><marker id="f04-pyat-ramok-ah-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#FF5A5A"/></marker><marker id="f04-pyat-ramok-ah-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#FFB800"/></marker></defs><rect width="400" height="667" fill="#0A0A0A"/><text x="20" y="28" font-family="'Space Mono', 'JetBrains Mono', ui-monospace, monospace" font-size="10.5" fill="#C050FF" letter-spacing="1.2"><tspan x="20" dy="0">▸ СХЕМА · § 1.5</tspan></text><text x="20" y="56" font-family="Oswald, Impact, 'Arial Narrow', sans-serif" font-size="21" fill="#E8E2D3" font-weight="500" letter-spacing="0.3"><tspan x="20" dy="0">ПЯТЬ РАМОК ОБЪЯСНЕНИЯ</tspan></text><line x1="182" y1="245" x2="186.06930551965684" y2="264.4422374828049" stroke="#8C8879" stroke-width="1.3" stroke-dasharray="4 4" stroke-linecap="butt"/><line x1="218" y1="245" x2="213.93069448034316" y2="264.4422374828049" stroke="#8C8879" stroke-width="1.3" stroke-dasharray="4 4" stroke-linecap="butt"/><line x1="182" y1="417" x2="186.06930551965684" y2="397.5577625171951" stroke="#C050FF" stroke-width="2.5" stroke-linecap="butt"/><line x1="218" y1="417" x2="213.93069448034316" y2="397.5577625171951" stroke="#8C8879" stroke-width="1.3" stroke-dasharray="4 4" stroke-linecap="butt"/><rect x="16" y="72" width="176" height="173" rx="2" fill="#141414" stroke="#3D3D3D" stroke-width="1"/><rect x="208" y="72" width="176" height="173" rx="2" fill="#141414" stroke="#3D3D3D" stroke-width="1"/><rect x="16" y="417" width="176" height="188" rx="2" fill="#C050FF" fill-opacity="0.08" stroke="#C050FF" stroke-width="1"/><rect x="208" y="417" width="176" height="188" rx="2" fill="#141414" stroke="#3D3D3D" stroke-width="1"/><text x="28" y="94" font-family="Oswald, Impact, 'Arial Narrow', sans-serif" font-size="14" fill="#E8E2D3" font-weight="500" letter-spacing="0.3"><tspan x="28" dy="0">1 · ПСИХОЛОГИЧЕСКАЯ</tspan></text><text x="28" y="112" font-family="'IBM Plex Sans', 'Segoe UI', system-ui, sans-serif" font-size="11.5" fill="#E8E2D3"><tspan x="28" dy="0">часть психики, которой</tspan><tspan x="28" dy="15">дали имя, форму и задачу</tspan></text><text x="28" y="149" font-family="'Space Mono', 'JetBrains Mono', ui-monospace, monospace" font-size="9.5" fill="#C050FF" letter-spacing="1"><tspan x="28" dy="0">БРАТЬ ДЛЯ</tspan></text><text x="28" y="165" font-family="'IBM Plex Sans', 'Segoe UI', system-ui, sans-serif" font-size="11.5" fill="#E8E2D3"><tspan x="28" dy="0">психогигиена, разбор</tspan><tspan x="28" dy="15">состояния</tspan></text><text x="28" y="200" font-family="'Space Mono', 'JetBrains Mono', ui-monospace, monospace" font-size="9.5" fill="#8C8879" letter-spacing="1"><tspan x="28" dy="0">СЛАБОЕ МЕСТО</tspan></text><text x="28" y="216" font-family="'IBM Plex Sans', 'Segoe UI', system-ui, sans-serif" font-size="11.5" fill="#8C8879"><tspan x="28" dy="0">яркие совпадения трудно</tspan><tspan x="28" dy="15">уложить</tspan></text><text x="220" y="94" font-family="Oswald, Impact, 'Arial Narrow', sans-serif" font-size="14" fill="#E8E2D3" font-weight="500" letter-spacing="0.3"><tspan x="220" dy="0">2 · МАГИЧЕСКАЯ</tspan></text><text x="220" y="112" font-family="'IBM Plex Sans', 'Segoe UI', system-ui, sans-serif" font-size="11.5" fill="#E8E2D3"><tspan x="220" dy="0">сущность тонкого плана,</tspan><tspan x="220" dy="15">созданная магом</tspan></text><text x="220" y="149" font-family="'Space Mono', 'JetBrains Mono', ui-monospace, monospace" font-size="9.5" fill="#C050FF" letter-spacing="1"><tspan x="220" dy="0">БРАТЬ ДЛЯ</tspan></text><text x="220" y="165" font-family="'IBM Plex Sans', 'Segoe UI', system-ui, sans-serif" font-size="11.5" fill="#E8E2D3"><tspan x="220" dy="0">левый путь — хотя бы как</tspan><tspan x="220" dy="15">ритуальный язык</tspan></text><text x="220" y="200" font-family="'Space Mono', 'JetBrains Mono', ui-monospace, monospace" font-size="9.5" fill="#8C8879" letter-spacing="1"><tspan x="220" dy="0">СЛАБОЕ МЕСТО</tspan></text><text x="220" y="216" font-family="'IBM Plex Sans', 'Segoe UI', system-ui, sans-serif" font-size="11.5" fill="#8C8879"><tspan x="220" dy="0">нельзя проверить обычным</tspan><tspan x="220" dy="15">опытом</tspan></text><text x="28" y="439" font-family="Oswald, Impact, 'Arial Narrow', sans-serif" font-size="14" fill="#C050FF" font-weight="500" letter-spacing="0.3"><tspan x="28" dy="0">3 · ИНФОРМАЦИОННАЯ</tspan></text><text x="28" y="457" font-family="'IBM Plex Sans', 'Segoe UI', system-ui, sans-serif" font-size="11.5" fill="#E8E2D3"><tspan x="28" dy="0">устойчивая структура</tspan><tspan x="28" dy="15">знаков, «управляемый</tspan><tspan x="28" dy="15">мем»</tspan></text><text x="28" y="509" font-family="'Space Mono', 'JetBrains Mono', ui-monospace, monospace" font-size="9.5" fill="#C050FF" letter-spacing="1"><tspan x="28" dy="0">БРАТЬ ДЛЯ</tspan></text><text x="28" y="525" font-family="'IBM Plex Sans', 'Segoe UI', system-ui, sans-serif" font-size="11.5" fill="#E8E2D3"><tspan x="28" dy="0">цифровое, мемы, сети;</tspan><tspan x="28" dy="15">старт вместе с 5</tspan></text><text x="28" y="560" font-family="'Space Mono', 'JetBrains Mono', ui-monospace, monospace" font-size="9.5" fill="#8C8879" letter-spacing="1"><tspan x="28" dy="0">СЛАБОЕ МЕСТО</tspan></text><text x="28" y="576" font-family="'IBM Plex Sans', 'Segoe UI', system-ui, sans-serif" font-size="11.5" fill="#8C8879"><tspan x="28" dy="0">«информация» легко</tspan><tspan x="28" dy="15">становится пустым словом</tspan></text><text x="220" y="439" font-family="Oswald, Impact, 'Arial Narrow', sans-serif" font-size="14" fill="#E8E2D3" font-weight="500" letter-spacing="0.3"><tspan x="220" dy="0">4 · СИМУЛЯКРНАЯ</tspan></text><text x="220" y="457" font-family="'IBM Plex Sans', 'Segoe UI', system-ui, sans-serif" font-size="11.5" fill="#E8E2D3"><tspan x="220" dy="0">знак без оригинала,</tspan><tspan x="220" dy="15">который действует как</tspan><tspan x="220" dy="15">образ</tspan></text><text x="220" y="509" font-family="'Space Mono', 'JetBrains Mono', ui-monospace, monospace" font-size="9.5" fill="#C050FF" letter-spacing="1"><tspan x="220" dy="0">БРАТЬ ДЛЯ</tspan></text><text x="220" y="525" font-family="'IBM Plex Sans', 'Segoe UI', system-ui, sans-serif" font-size="11.5" fill="#E8E2D3"><tspan x="220" dy="0">медиа, поп-образы,</tspan><tspan x="220" dy="15">бренды</tspan></text><text x="220" y="560" font-family="'Space Mono', 'JetBrains Mono', ui-monospace, monospace" font-size="9.5" fill="#8C8879" letter-spacing="1"><tspan x="220" dy="0">СЛАБОЕ МЕСТО</tspan></text><text x="220" y="576" font-family="'IBM Plex Sans', 'Segoe UI', system-ui, sans-serif" font-size="11.5" fill="#8C8879"><tspan x="220" dy="0">для практики слишком</tspan><tspan x="220" dy="15">отвлечённо</tspan></text><text x="108" y="403" font-family="'Space Mono', 'JetBrains Mono', ui-monospace, monospace" font-size="9.5" fill="#C050FF" text-anchor="middle" letter-spacing="1"><tspan x="108" dy="0">СТАРТ</tspan></text><text x="292" y="271" font-family="'Space Mono', 'JetBrains Mono', ui-monospace, monospace" font-size="9.5" fill="#8C8879" text-anchor="middle" letter-spacing="0.5"><tspan x="292" dy="0">сменить рамку</tspan></text><text x="292" y="284" font-family="'Space Mono', 'JetBrains Mono', ui-monospace, monospace" font-size="9.5" fill="#8C8879" text-anchor="middle" letter-spacing="0.5"><tspan x="292" dy="0">и вернуться</tspan></text><circle cx="200" cy="331" r="64" fill="#0A0A0A" stroke="#C050FF" stroke-width="2"/><circle cx="200" cy="331" r="64" fill="#C050FF" fill-opacity="0.14" stroke="none" stroke-width="1"/><text x="200" y="305" font-family="Oswald, Impact, 'Arial Narrow', sans-serif" font-size="22" fill="#C050FF" font-weight="500" text-anchor="middle"><tspan x="200" dy="0">5</tspan></text><text x="200" y="324" font-family="Oswald, Impact, 'Arial Narrow', sans-serif" font-size="14" fill="#E8E2D3" font-weight="500" text-anchor="middle" letter-spacing="0.3"><tspan x="200" dy="0">АВТОНОМНАЯ</tspan></text><text x="200" y="342" font-family="'IBM Plex Sans', 'Segoe UI', system-ui, sans-serif" font-size="11" fill="#E8E2D3" text-anchor="middle"><tspan x="200" dy="0">не решать, «что это</tspan><tspan x="200" dy="14">на самом деле»</tspan></text><text x="200" y="375" font-family="'Space Mono', 'JetBrains Mono', ui-monospace, monospace" font-size="9" fill="#C050FF" text-anchor="middle" letter-spacing="1"><tspan x="200" dy="0">ТОЧКА ВОЗВРАТА</tspan></text><text x="20" y="631" font-family="'IBM Plex Sans', 'Segoe UI', system-ui, sans-serif" font-size="12" fill="#8C8879"><tspan x="20" dy="0">Во время ритуала можно держаться выбранной рамки; после —</tspan><tspan x="20" dy="16">вернуться к обычным объяснениям (§ 9.2).</tspan></text></svg>