<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 825" width="400" height="825" role="img" aria-label="Три группы. Пересмотреть режим и наблюдать: мысли о сервиторе не по делу, ощущение присутствия без активации, лёгкая тревога без кормления. Прекратить практику и обратиться за оценкой: тревожные сны, решения ради сервитора, отдельный голос, стыд или вина, ревность. Прекратить и получить помощь без промедления: сервитор требует и наказывает, страх не покормить, не даёт себя уничтожить, новое поведение, ухудшение жизни. Ниже — шесть этапов действий и золотое правило: практику можно прекратить без согласия образа."><defs><marker id="f15-priznaki-zahvata-ah-bone" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#E8E2D3"/></marker><marker id="f15-priznaki-zahvata-ah-dim" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8C8879"/></marker><marker id="f15-priznaki-zahvata-ah-purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C050FF"/></marker><marker id="f15-priznaki-zahvata-ah-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#FF5A5A"/></marker><marker id="f15-priznaki-zahvata-ah-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#FFB800"/></marker></defs><rect width="400" height="825" fill="#0A0A0A"/><text x="20" y="28" font-family="'Space Mono', 'JetBrains Mono', ui-monospace, monospace" font-size="10.5" fill="#C050FF" letter-spacing="1.2"><tspan x="20" dy="0">▸ СХЕМА · § 5.5</tspan></text><text x="20" y="56" font-family="Oswald, Impact, 'Arial Narrow', sans-serif" font-size="21" fill="#E8E2D3" font-weight="500" letter-spacing="0.3"><tspan x="20" dy="0">ПРИЗНАКИ ЗАХВАТА</tspan></text><rect x="16" y="72" width="368" height="105" rx="2" fill="#FFB800" fill-opacity="0.05" stroke="#FFB800" stroke-width="1"/><rect x="16" y="72" width="5" height="105" fill="#FFB800"/><text x="32" y="94" font-family="Oswald, Impact, 'Arial Narrow', sans-serif" font-size="14" fill="#FFB800" font-weight="500" letter-spacing="0.3"><tspan x="32" dy="0">ПЕРЕСМОТРЕТЬ РЕЖИМ И НАБЛЮДАТЬ</tspan></text><text x="32" y="124" font-family="'IBM Plex Sans', 'Segoe UI', system-ui, sans-serif" font-size="11" fill="#FFB800"><tspan x="32" dy="0">▸</tspan></text><text x="46" y="124" font-family="'IBM Plex Sans', 'Segoe UI', system-ui, sans-serif" font-size="12.5" fill="#E8E2D3"><tspan x="46" dy="0">мысли о сервиторе там, где его функция ни при чём</tspan></text><text x="32" y="143" font-family="'IBM Plex Sans', 'Segoe UI', system-ui, sans-serif" font-size="11" fill="#FFB800"><tspan x="32" dy="0">▸</tspan></text><text x="46" y="143" font-family="'IBM Plex Sans', 'Segoe UI', system-ui, sans-serif" font-size="12.5" fill="#E8E2D3"><tspan x="46" dy="0">ощущение «я не один в комнате» без активации</tspan></text><text x="32" y="162" font-family="'IBM Plex Sans', 'Segoe UI', system-ui, sans-serif" font-size="11" fill="#FFB800"><tspan x="32" dy="0">▸</tspan></text><text x="46" y="162" font-family="'IBM Plex Sans', 'Segoe UI', system-ui, sans-serif" font-size="12.5" fill="#E8E2D3"><tspan x="46" dy="0">лёгкая тревога, если долго не кормил</tspan></text><rect x="16" y="189" width="368" height="143" rx="2" fill="#FF5A5A" fill-opacity="0.05" stroke="#FF5A5A" stroke-width="1"/><rect x="16" y="189" width="5" height="143" fill="#FF5A5A"/><text x="32" y="211" font-family="Oswald, Impact, 'Arial Narrow', sans-serif" font-size="14" fill="#FF5A5A" font-weight="500" letter-spacing="0.3"><tspan x="32" dy="0">ПРЕКРАТИТЬ ПРАКТИКУ И ОБРАТИТЬСЯ ЗА ОЦЕНКОЙ</tspan></text><text x="32" y="241" font-family="'IBM Plex Sans', 'Segoe UI', system-ui, sans-serif" font-size="11" fill="#FF5A5A"><tspan x="32" dy="0">▸</tspan></text><text x="46" y="241" font-family="'IBM Plex Sans', 'Segoe UI', system-ui, sans-serif" font-size="12.5" fill="#E8E2D3"><tspan x="46" dy="0">образ регулярно появляется в снах и тревожит</tspan></text><text x="32" y="260" font-family="'IBM Plex Sans', 'Segoe UI', system-ui, sans-serif" font-size="11" fill="#FF5A5A"><tspan x="32" dy="0">▸</tspan></text><text x="46" y="260" font-family="'IBM Plex Sans', 'Segoe UI', system-ui, sans-serif" font-size="12.5" fill="#E8E2D3"><tspan x="46" dy="0">решения «чтобы ему было хорошо»</tspan></text><text x="32" y="279" font-family="'IBM Plex Sans', 'Segoe UI', system-ui, sans-serif" font-size="11" fill="#FF5A5A"><tspan x="32" dy="0">▸</tspan></text><text x="46" y="279" font-family="'IBM Plex Sans', 'Segoe UI', system-ui, sans-serif" font-size="12.5" fill="#E8E2D3"><tspan x="46" dy="0">отдельный голос, который приписываешь сервитору</tspan></text><text x="32" y="298" font-family="'IBM Plex Sans', 'Segoe UI', system-ui, sans-serif" font-size="11" fill="#FF5A5A"><tspan x="32" dy="0">▸</tspan></text><text x="46" y="298" font-family="'IBM Plex Sans', 'Segoe UI', system-ui, sans-serif" font-size="12.5" fill="#E8E2D3"><tspan x="46" dy="0">стыд или вина перед ним</tspan></text><text x="32" y="317" font-family="'IBM Plex Sans', 'Segoe UI', system-ui, sans-serif" font-size="11" fill="#FF5A5A"><tspan x="32" dy="0">▸</tspan></text><text x="46" y="317" font-family="'IBM Plex Sans', 'Segoe UI', system-ui, sans-serif" font-size="12.5" fill="#E8E2D3"><tspan x="46" dy="0">ревность к другим практикам и сервиторам</tspan></text><rect x="16" y="344" width="368" height="143" rx="2" fill="#FF5A5A" fill-opacity="0.12" stroke="#FF5A5A" stroke-width="2"/><rect x="16" y="344" width="368" height="34" fill="#FF5A5A"/><text x="30" y="366" font-family="Oswald, Impact, 'Arial Narrow', sans-serif" font-size="14" fill="#0A0A0A" font-weight="500" letter-spacing="0.3"><tspan x="30" dy="0">ПРЕКРАТИТЬ И ПОЛУЧИТЬ ПОМОЩЬ БЕЗ ПРОМЕДЛЕНИЯ</tspan></text><text x="32" y="396" font-family="'IBM Plex Sans', 'Segoe UI', system-ui, sans-serif" font-size="11" fill="#FF5A5A"><tspan x="32" dy="0">▸</tspan></text><text x="46" y="396" font-family="'IBM Plex Sans', 'Segoe UI', system-ui, sans-serif" font-size="12.5" fill="#E8E2D3"><tspan x="46" dy="0">сервитор «настаивает», «требует», «наказывает»</tspan></text><text x="32" y="415" font-family="'IBM Plex Sans', 'Segoe UI', system-ui, sans-serif" font-size="11" fill="#FF5A5A"><tspan x="32" dy="0">▸</tspan></text><text x="46" y="415" font-family="'IBM Plex Sans', 'Segoe UI', system-ui, sans-serif" font-size="12.5" fill="#E8E2D3"><tspan x="46" dy="0">страшно не покормить</tspan></text><text x="32" y="434" font-family="'IBM Plex Sans', 'Segoe UI', system-ui, sans-serif" font-size="11" fill="#FF5A5A"><tspan x="32" dy="0">▸</tspan></text><text x="46" y="434" font-family="'IBM Plex Sans', 'Segoe UI', system-ui, sans-serif" font-size="12.5" fill="#E8E2D3"><tspan x="46" dy="0">«не даёт» себя уничтожить</tspan></text><text x="32" y="453" font-family="'IBM Plex Sans', 'Segoe UI', system-ui, sans-serif" font-size="11" fill="#FF5A5A"><tspan x="32" dy="0">▸</tspan></text><text x="46" y="453" font-family="'IBM Plex Sans', 'Segoe UI', system-ui, sans-serif" font-size="12.5" fill="#E8E2D3"><tspan x="46" dy="0">новые формы поведения, отчётливо «сервиторные»</tspan></text><text x="32" y="472" font-family="'IBM Plex Sans', 'Segoe UI', system-ui, sans-serif" font-size="11" fill="#FF5A5A"><tspan x="32" dy="0">▸</tspan></text><text x="46" y="472" font-family="'IBM Plex Sans', 'Segoe UI', system-ui, sans-serif" font-size="12.5" fill="#E8E2D3"><tspan x="46" dy="0">ухудшились работа, отношения или здоровье</tspan></text><text x="20" y="517" font-family="'Space Mono', 'JetBrains Mono', ui-monospace, monospace" font-size="10" fill="#C050FF" letter-spacing="1"><tspan x="20" dy="0">ЧТО ДЕЛАТЬ, ПО ПОРЯДКУ</tspan></text><rect x="16" y="531" width="116" height="85.5" rx="2" fill="#141414" stroke="#3D3D3D" stroke-width="1"/><text x="25" y="548" font-family="'Space Mono', 'JetBrains Mono', ui-monospace, monospace" font-size="10.5" fill="#C050FF" font-weight="700"><tspan x="25" dy="0">1</tspan></text><text x="25" y="564" font-family="'IBM Plex Sans', 'Segoe UI', system-ui, sans-serif" font-size="11" fill="#E8E2D3"><tspan x="25" dy="0">назвать, что</tspan><tspan x="25" dy="13.5">происходит,</tspan><tspan x="25" dy="13.5">письменно</tspan></text><rect x="142" y="531" width="116" height="85.5" rx="2" fill="#141414" stroke="#3D3D3D" stroke-width="1"/><text x="151" y="548" font-family="'Space Mono', 'JetBrains Mono', ui-monospace, monospace" font-size="10.5" fill="#C050FF" font-weight="700"><tspan x="151" dy="0">2</tspan></text><text x="151" y="564" font-family="'IBM Plex Sans', 'Segoe UI', system-ui, sans-serif" font-size="11" fill="#E8E2D3"><tspan x="151" dy="0">остановить</tspan><tspan x="151" dy="13.5">вызовы, убрать</tspan><tspan x="151" dy="13.5">носитель</tspan></text><rect x="268" y="531" width="116" height="85.5" rx="2" fill="#141414" stroke="#3D3D3D" stroke-width="1"/><text x="277" y="548" font-family="'Space Mono', 'JetBrains Mono', ui-monospace, monospace" font-size="10.5" fill="#C050FF" font-weight="700"><tspan x="277" dy="0">3</tspan></text><text x="277" y="564" font-family="'IBM Plex Sans', 'Segoe UI', system-ui, sans-serif" font-size="11" fill="#E8E2D3"><tspan x="277" dy="0">вернуть сон, еду,</tspan><tspan x="277" dy="13.5">движение, людей</tspan></text><rect x="16" y="626.5" width="116" height="85.5" rx="2" fill="#141414" stroke="#3D3D3D" stroke-width="1"/><text x="25" y="643.5" font-family="'Space Mono', 'JetBrains Mono', ui-monospace, monospace" font-size="10.5" fill="#C050FF" font-weight="700"><tspan x="25" dy="0">4</tspan></text><text x="25" y="659.5" font-family="'IBM Plex Sans', 'Segoe UI', system-ui, sans-serif" font-size="11" fill="#E8E2D3"><tspan x="25" dy="0">разбор: чего не</tspan><tspan x="25" dy="13.5">хватает в жизни</tspan></text><rect x="142" y="626.5" width="116" height="85.5" rx="2" fill="#141414" stroke="#3D3D3D" stroke-width="1"/><text x="151" y="643.5" font-family="'Space Mono', 'JetBrains Mono', ui-monospace, monospace" font-size="10.5" fill="#C050FF" font-weight="700"><tspan x="151" dy="0">5</tspan></text><text x="151" y="659.5" font-family="'IBM Plex Sans', 'Segoe UI', system-ui, sans-serif" font-size="11" fill="#E8E2D3"><tspan x="151" dy="0">разговор с</tspan><tspan x="151" dy="13.5">близким; при</tspan><tspan x="151" dy="13.5">голосах —</tspan><tspan x="151" dy="13.5">специалист</tspan></text><rect x="268" y="626.5" width="116" height="85.5" rx="2" fill="#141414" stroke="#3D3D3D" stroke-width="1"/><text x="277" y="643.5" font-family="'Space Mono', 'JetBrains Mono', ui-monospace, monospace" font-size="10.5" fill="#C050FF" font-weight="700"><tspan x="277" dy="0">6</tspan></text><text x="277" y="659.5" font-family="'IBM Plex Sans', 'Segoe UI', system-ui, sans-serif" font-size="11" fill="#E8E2D3"><tspan x="277" dy="0">решение: пауза</tspan><tspan x="277" dy="13.5">или срочное</tspan><tspan x="277" dy="13.5">завершение</tspan><tspan x="277" dy="13.5">(§ 7.2)</tspan></text><text x="20" y="746" font-family="Oswald, Impact, 'Arial Narrow', sans-serif" font-size="15" fill="#C050FF" font-weight="500" letter-spacing="0.3"><tspan x="20" dy="0">ТЫ ВПРАВЕ ПРЕКРАТИТЬ ЛЮБУЮ СОЗДАННУЮ ТОБОЙ</tspan><tspan x="20" dy="20">ПРАКТИКУ БЕЗ «СОГЛАСИЯ» ОБРАЗА</tspan></text><text x="20" y="790" font-family="'IBM Plex Sans', 'Segoe UI', system-ui, sans-serif" font-size="11.5" fill="#8C8879"><tspan x="20" dy="0">При непосредственной угрозе себе или другому человеку нужна</tspan><tspan x="20" dy="15">экстренная помощь (§ 9.6).</tspan></text></svg>