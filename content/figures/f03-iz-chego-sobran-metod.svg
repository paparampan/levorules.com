<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 851" width="400" height="851" role="img" aria-label="Схема схождения: мыслеформа как объект, ритуальная техника, психологическое прочтение и опыт опасностей ведут сплошными линиями к хаос-магии; похожие мотивы вроде паредра, ушабти и голема ведут пунктиром. В хаос-магии Спейр в 1913 году даёт поворот, Кэрролл и IOT в 1978 году — рабочую схему, из которой выходит сервитор."><defs><marker id="f03-iz-chego-sobran-metod-ah-bone" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#E8E2D3"/></marker><marker id="f03-iz-chego-sobran-metod-ah-dim" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8C8879"/></marker><marker id="f03-iz-chego-sobran-metod-ah-purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C050FF"/></marker><marker id="f03-iz-chego-sobran-metod-ah-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#FF5A5A"/></marker><marker id="f03-iz-chego-sobran-metod-ah-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#FFB800"/></marker></defs><rect width="400" height="851" fill="#0A0A0A"/><text x="20" y="28" font-family="'Space Mono', 'JetBrains Mono', ui-monospace, monospace" font-size="10.5" fill="#C050FF" letter-spacing="1.2"><tspan x="20" dy="0">▸ СХЕМА · § 1.1</tspan></text><text x="20" y="56" font-family="Oswald, Impact, 'Arial Narrow', sans-serif" font-size="21" fill="#E8E2D3" font-weight="500" letter-spacing="0.3"><tspan x="20" dy="0">ИЗ ЧЕГО СОБРАН МЕТОД</tspan></text><line x1="20" y1="70" x2="52" y2="70" stroke="#E8E2D3" stroke-width="2" stroke-linecap="butt"/><text x="60" y="74" font-family="'IBM Plex Sans', 'Segoe UI', system-ui, sans-serif" font-size="11.5" fill="#8C8879"><tspan x="60" dy="0">влияние подтверждается текстами</tspan></text><line x1="20" y1="88" x2="52" y2="88" stroke="#8C8879" stroke-width="2" stroke-dasharray="5 4" stroke-linecap="butt"/><text x="60" y="92" font-family="'IBM Plex Sans', 'Segoe UI', system-ui, sans-serif" font-size="11.5" fill="#8C8879"><tspan x="60" dy="0">только сходство мотива, аналогия курса</tspan></text><rect x="16" y="114" width="262" height="63" rx="2" fill="#141414" stroke="#3D3D3D" stroke-width="1"/><text x="28" y="133" font-family="Oswald, Impact, 'Arial Narrow', sans-serif" font-size="13.5" fill="#E8E2D3" font-weight="500" letter-spacing="0.3"><tspan x="28" dy="0">МЫСЛЕФОРМА КАК «ОБЪЕКТ»</tspan></text><text x="28" y="150" font-family="'IBM Plex Sans', 'Segoe UI', system-ui, sans-serif" font-size="11.5" fill="#8C8879"><tspan x="28" dy="0">Леви, астральный свет, 1854–56 · Безант</tspan><tspan x="28" dy="15">и Ледбитер, «Thought-Forms», 1901</tspan></text><rect x="16" y="187" width="262" height="78" rx="2" fill="#141414" stroke="#3D3D3D" stroke-width="1"/><text x="28" y="206" font-family="Oswald, Impact, 'Arial Narrow', sans-serif" font-size="13.5" fill="#E8E2D3" font-weight="500" letter-spacing="0.3"><tspan x="28" dy="0">РИТУАЛЬНАЯ ТЕХНИКА</tspan></text><text x="28" y="223" font-family="'IBM Plex Sans', 'Segoe UI', system-ui, sans-serif" font-size="11.5" fill="#8C8879"><tspan x="28" dy="0">таблицы Агриппы, 1533 · Гоэтия, XVII в.</tspan><tspan x="28" dy="15">· Кроули, 1929 · Регарди издаёт Золотую</tspan><tspan x="28" dy="15">Зарю, 1937–40</tspan></text><rect x="16" y="275" width="262" height="63" rx="2" fill="#141414" stroke="#3D3D3D" stroke-width="1"/><text x="28" y="294" font-family="Oswald, Impact, 'Arial Narrow', sans-serif" font-size="13.5" fill="#E8E2D3" font-weight="500" letter-spacing="0.3"><tspan x="28" dy="0">ПСИХОЛОГИЧЕСКОЕ ПРОЧТЕНИЕ</tspan></text><text x="28" y="311" font-family="'IBM Plex Sans', 'Segoe UI', system-ui, sans-serif" font-size="11.5" fill="#8C8879"><tspan x="28" dy="0">Кроули: духи как «части мозга», 1904 ·</tspan><tspan x="28" dy="15">позднее Юнг</tspan></text><rect x="16" y="348" width="262" height="63" rx="2" fill="#141414" stroke="#3D3D3D" stroke-width="1"/><text x="28" y="367" font-family="Oswald, Impact, 'Arial Narrow', sans-serif" font-size="13.5" fill="#E8E2D3" font-weight="500" letter-spacing="0.3"><tspan x="28" dy="0">ОПЫТ ОПАСНОСТЕЙ</tspan></text><text x="28" y="384" font-family="'IBM Plex Sans', 'Segoe UI', system-ui, sans-serif" font-size="11.5" fill="#8C8879"><tspan x="28" dy="0">Давид-Неэль о тульпе, 1929 · Форчун,</tspan><tspan x="28" dy="15">«Psychic Self-Defence», 1930</tspan></text><rect x="16" y="421" width="262" height="78" rx="2" fill="#141414" stroke="#2A2A2A" stroke-width="1" stroke-dasharray="4 3"/><text x="28" y="440" font-family="Oswald, Impact, 'Arial Narrow', sans-serif" font-size="13.5" fill="#8C8879" font-weight="500" letter-spacing="0.3"><tspan x="28" dy="0">ПОХОЖИЕ МОТИВЫ</tspan></text><text x="28" y="457" font-family="'IBM Plex Sans', 'Segoe UI', system-ui, sans-serif" font-size="11.5" fill="#8C8879"><tspan x="28" dy="0">паредр в PGM, II–V вв. · ушабти ·</tspan><tspan x="28" dy="15">духи-помощники · Ars Notoria · гомункул</tspan><tspan x="28" dy="15">· Абрамелин · голем</tspan></text><path d="M278,145.5 C316,145.5 336,344.25 336,541" fill="none" stroke="#E8E2D3" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M278,226 C316,226 336,384.5 336,541" fill="none" stroke="#E8E2D3" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M278,306.5 C316,306.5 336,424.75 336,541" fill="none" stroke="#E8E2D3" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M278,379.5 C316,379.5 336,461.25 336,541" fill="none" stroke="#E8E2D3" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M278,460 C316,460 336,501.5 336,541" fill="none" stroke="#8C8879" stroke-width="1.4" stroke-dasharray="5 4" stroke-linecap="round" stroke-linejoin="round"/><rect x="16" y="543" width="368" height="162" rx="2" fill="#C050FF" fill-opacity="0.06" stroke="#C050FF" stroke-width="1.5"/><text x="32" y="567" font-family="'Space Mono', 'JetBrains Mono', ui-monospace, monospace" font-size="10" fill="#C050FF" letter-spacing="1"><tspan x="32" dy="0">ХАОС-МАГИЯ СОБИРАЕТ МЕТОД</tspan></text><text x="32" y="593" font-family="Oswald, Impact, 'Arial Narrow', sans-serif" font-size="14" fill="#E8E2D3" font-weight="500" letter-spacing="0.3"><tspan x="32" dy="0">СПЕЙР · 1913</tspan></text><text x="32" y="611" font-family="'IBM Plex Sans', 'Segoe UI', system-ui, sans-serif" font-size="12" fill="#E8E2D3"><tspan x="32" dy="0">поворот: личная сигила из собственного желания,</tspan><tspan x="32" dy="16">гнозис, забывание</tspan></text><text x="32" y="657" font-family="Oswald, Impact, 'Arial Narrow', sans-serif" font-size="14" fill="#E8E2D3" font-weight="500" letter-spacing="0.3"><tspan x="32" dy="0">КЭРРОЛЛ И IOT · 1978</tspan></text><text x="32" y="675" font-family="'IBM Plex Sans', 'Segoe UI', system-ui, sans-serif" font-size="12" fill="#E8E2D3"><tspan x="32" dy="0">рабочая схема созданного элементаля: назначение,</tspan><tspan x="32" dy="16">имя, образ, сигила, гнозис, завершение</tspan></text><line x1="200" y1="705" x2="200" y2="735" stroke="#C050FF" stroke-width="2" marker-end="url(#f03-iz-chego-sobran-metod-ah-purple)" stroke-linecap="butt"/><rect x="16" y="739" width="368" height="92" rx="2" fill="#C050FF" fill-opacity="0.2" stroke="#C050FF" stroke-width="2"/><text x="32" y="765" font-family="Oswald, Impact, 'Arial Narrow', sans-serif" font-size="19" fill="#E8E2D3" font-weight="500" letter-spacing="0.6"><tspan x="32" dy="0">СЕРВИТОР</tspan></text><text x="32" y="783" font-family="'IBM Plex Sans', 'Segoe UI', system-ui, sans-serif" font-size="12" fill="#E8E2D3"><tspan x="32" dy="0">термин и схема закрепляются: Хайн, «Chaos Servitors:</tspan><tspan x="32" dy="16">A User Guide», 1991 · «Liber Kaos», 1992 · руководства</tspan><tspan x="32" dy="16">Харта и Брэнда, 2015–16</tspan></text></svg>