<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 998" width="400" height="998" role="img" aria-label="Карта курса из одиннадцати модулей. До первого запуска обязательно читать модули 0–4, параграф 5.5, параграф 7.2 и модуль 9. Подготовка в модуле 3 занимает 2–3 недели, создание первого сервитора в модуле 4 — от одной до трёх недель."><defs><marker id="f01-karta-kursa-ah-bone" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#E8E2D3"/></marker><marker id="f01-karta-kursa-ah-dim" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8C8879"/></marker><marker id="f01-karta-kursa-ah-purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C050FF"/></marker><marker id="f01-karta-kursa-ah-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#FF5A5A"/></marker><marker id="f01-karta-kursa-ah-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#FFB800"/></marker></defs><rect width="400" height="998" fill="#0A0A0A"/><text x="20" y="28" font-family="'Space Mono', 'JetBrains Mono', ui-monospace, monospace" font-size="10.5" fill="#C050FF" letter-spacing="1.2"><tspan x="20" dy="0">▸ СХЕМА · § 0.3</tspan></text><text x="20" y="56" font-family="Oswald, Impact, 'Arial Narrow', sans-serif" font-size="21" fill="#E8E2D3" font-weight="500" letter-spacing="0.3"><tspan x="20" dy="0">КАРТА КУРСА</tspan></text><circle cx="27" cy="74" r="5.5" fill="#C050FF" stroke="none" stroke-width="1"/><text x="42" y="78" font-family="'IBM Plex Sans', 'Segoe UI', system-ui, sans-serif" font-size="11.5" fill="#8C8879"><tspan x="42" dy="0">обязательно до первого запуска</tspan></text><circle cx="27" cy="92" r="5.5" fill="#0A0A0A" stroke="#C050FF" stroke-width="2"/><path d="M27,86.5 A5.5,5.5 0 0 0 27,97.5 Z" fill="#C050FF"/><text x="42" y="96" font-family="'IBM Plex Sans', 'Segoe UI', system-ui, sans-serif" font-size="11.5" fill="#8C8879"><tspan x="42" dy="0">до запуска — один раздел модуля</tspan></text><circle cx="27" cy="110" r="5.5" fill="#0A0A0A" stroke="#8C8879" stroke-width="2"/><text x="42" y="114" font-family="'IBM Plex Sans', 'Segoe UI', system-ui, sans-serif" font-size="11.5" fill="#8C8879"><tspan x="42" dy="0">углубляться по мере практики</tspan></text><line x1="27" y1="155" x2="27" y2="221" stroke="#C050FF" stroke-width="3" stroke-linecap="butt"/><line x1="27" y1="221" x2="27" y2="271" stroke="#C050FF" stroke-width="3" stroke-linecap="butt"/><line x1="27" y1="271" x2="27" y2="321" stroke="#C050FF" stroke-width="3" stroke-linecap="butt"/><line x1="27" y1="321" x2="27" y2="371" stroke="#C050FF" stroke-width="3" stroke-linecap="butt"/><line x1="27" y1="371" x2="27" y2="421" stroke="#3D3D3D" stroke-width="2" stroke-linecap="butt"/><line x1="27" y1="421" x2="27" y2="487" stroke="#3D3D3D" stroke-width="2" stroke-linecap="butt"/><line x1="27" y1="487" x2="27" y2="537" stroke="#3D3D3D" stroke-width="2" stroke-linecap="butt"/><line x1="27" y1="537" x2="27" y2="603" stroke="#3D3D3D" stroke-width="2" stroke-linecap="butt"/><line x1="27" y1="603" x2="27" y2="669" stroke="#3D3D3D" stroke-width="2" stroke-linecap="butt"/><line x1="27" y1="669" x2="27" y2="735" stroke="#3D3D3D" stroke-width="2" stroke-linecap="butt"/><text x="46" y="160" font-family="'Space Mono', 'JetBrains Mono', ui-monospace, monospace" font-size="11" fill="#C050FF"><tspan x="46" dy="0">00</tspan></text><text x="74" y="160" font-family="Oswald, Impact, 'Arial Narrow', sans-serif" font-size="15" fill="#E8E2D3" font-weight="500" letter-spacing="0.2"><tspan x="74" dy="0">ВВЕДЕНИЕ</tspan></text><text x="74" y="178" font-family="'IBM Plex Sans', 'Segoe UI', system-ui, sans-serif" font-size="12" fill="#8C8879"><tspan x="74" dy="0">что такое сервитор, соседние понятия, договор с</tspan><tspan x="74" dy="16">собой</tspan></text><text x="46" y="226" font-family="'Space Mono', 'JetBrains Mono', ui-monospace, monospace" font-size="11" fill="#C050FF"><tspan x="46" dy="0">01</tspan></text><text x="74" y="226" font-family="Oswald, Impact, 'Arial Narrow', sans-serif" font-size="15" fill="#E8E2D3" font-weight="500" letter-spacing="0.2"><tspan x="74" dy="0">ТЕОРИЯ И ИСТОРИЯ</tspan></text><text x="74" y="244" font-family="'IBM Plex Sans', 'Segoe UI', system-ui, sans-serif" font-size="12" fill="#8C8879"><tspan x="74" dy="0">откуда взялся метод, пять рамок объяснения</tspan></text><text x="46" y="276" font-family="'Space Mono', 'JetBrains Mono', ui-monospace, monospace" font-size="11" fill="#C050FF"><tspan x="46" dy="0">02</tspan></text><text x="74" y="276" font-family="Oswald, Impact, 'Arial Narrow', sans-serif" font-size="15" fill="#E8E2D3" font-weight="500" letter-spacing="0.2"><tspan x="74" dy="0">ТИПОЛОГИЯ</tspan></text><text x="74" y="294" font-family="'IBM Plex Sans', 'Segoe UI', system-ui, sans-serif" font-size="12" fill="#8C8879"><tspan x="74" dy="0">шесть осей, по которым проверяют замысел</tspan></text><text x="46" y="326" font-family="'Space Mono', 'JetBrains Mono', ui-monospace, monospace" font-size="11" fill="#C050FF"><tspan x="46" dy="0">03</tspan></text><text x="74" y="326" font-family="Oswald, Impact, 'Arial Narrow', sans-serif" font-size="15" fill="#E8E2D3" font-weight="500" letter-spacing="0.2"><tspan x="74" dy="0">ПОДГОТОВКА</tspan></text><rect x="318" y="312" width="62" height="20" rx="2" fill="#0A0A0A" stroke="#C050FF" stroke-width="1"/><text x="325" y="325.6" font-family="'Space Mono', 'JetBrains Mono', ui-monospace, monospace" font-size="10" fill="#C050FF"><tspan x="325" dy="0">2–3 НЕД.</tspan></text><text x="74" y="344" font-family="'IBM Plex Sans', 'Segoe UI', system-ui, sans-serif" font-size="12" fill="#8C8879"><tspan x="74" dy="0">сон, дневник, гнозис, банишинг</tspan></text><text x="46" y="376" font-family="'Space Mono', 'JetBrains Mono', ui-monospace, monospace" font-size="11" fill="#C050FF"><tspan x="46" dy="0">04</tspan></text><text x="74" y="376" font-family="Oswald, Impact, 'Arial Narrow', sans-serif" font-size="15" fill="#E8E2D3" font-weight="500" letter-spacing="0.2"><tspan x="74" dy="0">СОЗДАНИЕ СЕРВИТОРА</tspan></text><rect x="318" y="362" width="62" height="20" rx="2" fill="#0A0A0A" stroke="#C050FF" stroke-width="1"/><text x="325" y="375.6" font-family="'Space Mono', 'JetBrains Mono', ui-monospace, monospace" font-size="10" fill="#C050FF"><tspan x="325" dy="0">1–3 НЕД.</tspan></text><text x="74" y="394" font-family="'IBM Plex Sans', 'Segoe UI', system-ui, sans-serif" font-size="12" fill="#8C8879"><tspan x="74" dy="0">десять шагов: от задачи до первых испытаний</tspan></text><text x="46" y="426" font-family="'Space Mono', 'JetBrains Mono', ui-monospace, monospace" font-size="11" fill="#C050FF"><tspan x="46" dy="0">05</tspan></text><text x="74" y="426" font-family="Oswald, Impact, 'Arial Narrow', sans-serif" font-size="15" fill="#E8E2D3" font-weight="500" letter-spacing="0.2"><tspan x="74" dy="0">РАБОТА С СЕРВИТОРОМ</tspan></text><text x="74" y="444" font-family="'IBM Plex Sans', 'Segoe UI', system-ui, sans-serif" font-size="12" fill="#8C8879"><tspan x="74" dy="0">кормление, проверка, коррекция; до запуска —</tspan><tspan x="74" dy="16">§ 5.5, признаки захвата</tspan></text><text x="46" y="492" font-family="'Space Mono', 'JetBrains Mono', ui-monospace, monospace" font-size="11" fill="#8C8879"><tspan x="46" dy="0">06</tspan></text><text x="74" y="492" font-family="Oswald, Impact, 'Arial Narrow', sans-serif" font-size="15" fill="#8C8879" font-weight="500" letter-spacing="0.2"><tspan x="74" dy="0">ПРОДВИНУТЫЕ ТЕХНИКИ</tspan></text><text x="74" y="510" font-family="'IBM Plex Sans', 'Segoe UI', system-ui, sans-serif" font-size="12" fill="#8C8879"><tspan x="74" dy="0">группы, сети, цифровые и клипотические сервиторы</tspan></text><text x="46" y="542" font-family="'Space Mono', 'JetBrains Mono', ui-monospace, monospace" font-size="11" fill="#C050FF"><tspan x="46" dy="0">07</tspan></text><text x="74" y="542" font-family="Oswald, Impact, 'Arial Narrow', sans-serif" font-size="15" fill="#E8E2D3" font-weight="500" letter-spacing="0.2"><tspan x="74" dy="0">ЗАВЕРШЕНИЕ</tspan></text><text x="74" y="560" font-family="'IBM Plex Sans', 'Segoe UI', system-ui, sans-serif" font-size="12" fill="#8C8879"><tspan x="74" dy="0">деактивация, отпуск, трансмутация; до запуска —</tspan><tspan x="74" dy="16">§ 7.2, как остановить</tspan></text><text x="46" y="608" font-family="'Space Mono', 'JetBrains Mono', ui-monospace, monospace" font-size="11" fill="#8C8879"><tspan x="46" dy="0">08</tspan></text><text x="74" y="608" font-family="Oswald, Impact, 'Arial Narrow', sans-serif" font-size="15" fill="#8C8879" font-weight="500" letter-spacing="0.2"><tspan x="74" dy="0">ПРИМЕРЫ И ОШИБКИ</tspan></text><text x="74" y="626" font-family="'IBM Plex Sans', 'Segoe UI', system-ui, sans-serif" font-size="12" fill="#8C8879"><tspan x="74" dy="0">30 ошибок, 5 неработающих схем, 5 учебных</tspan><tspan x="74" dy="16">примеров</tspan></text><text x="46" y="674" font-family="'Space Mono', 'JetBrains Mono', ui-monospace, monospace" font-size="11" fill="#C050FF"><tspan x="46" dy="0">09</tspan></text><text x="74" y="674" font-family="Oswald, Impact, 'Arial Narrow', sans-serif" font-size="15" fill="#E8E2D3" font-weight="500" letter-spacing="0.2"><tspan x="74" dy="0">ПСИХОЛОГИЧЕСКАЯ РАМКА</tspan></text><text x="74" y="692" font-family="'IBM Plex Sans', 'Segoe UI', system-ui, sans-serif" font-size="12" fill="#8C8879"><tspan x="74" dy="0">граница с диссоциацией, риски, когда идти к</tspan><tspan x="74" dy="16">специалисту</tspan></text><text x="46" y="740" font-family="'Space Mono', 'JetBrains Mono', ui-monospace, monospace" font-size="11" fill="#8C8879"><tspan x="46" dy="0">10</tspan></text><text x="74" y="740" font-family="Oswald, Impact, 'Arial Narrow', sans-serif" font-size="15" fill="#8C8879" font-weight="500" letter-spacing="0.2"><tspan x="74" dy="0">ДАЛЬНЕЙШИЙ ПУТЬ</tspan></text><text x="74" y="758" font-family="'IBM Plex Sans', 'Segoe UI', system-ui, sans-serif" font-size="12" fill="#8C8879"><tspan x="74" dy="0">искусство, Таро и руны, личный пантеон, план на</tspan><tspan x="74" dy="16">год</tspan></text><circle cx="27" cy="155" r="7" fill="#C050FF" stroke="none" stroke-width="1"/><circle cx="27" cy="221" r="7" fill="#C050FF" stroke="none" stroke-width="1"/><circle cx="27" cy="271" r="7" fill="#C050FF" stroke="none" stroke-width="1"/><circle cx="27" cy="321" r="7" fill="#C050FF" stroke="none" stroke-width="1"/><circle cx="27" cy="371" r="7" fill="#C050FF" stroke="none" stroke-width="1"/><circle cx="27" cy="421" r="7" fill="#0A0A0A" stroke="#C050FF" stroke-width="2"/><path d="M27,414 A7,7 0 0 0 27,428 Z" fill="#C050FF"/><circle cx="27" cy="487" r="7" fill="#0A0A0A" stroke="#8C8879" stroke-width="2"/><circle cx="27" cy="537" r="7" fill="#0A0A0A" stroke="#C050FF" stroke-width="2"/><path d="M27,530 A7,7 0 0 0 27,544 Z" fill="#C050FF"/><circle cx="27" cy="603" r="7" fill="#0A0A0A" stroke="#8C8879" stroke-width="2"/><circle cx="27" cy="669" r="7" fill="#C050FF" stroke="none" stroke-width="1"/><circle cx="27" cy="735" r="7" fill="#0A0A0A" stroke="#8C8879" stroke-width="2"/><line x1="20" y1="798" x2="380" y2="798" stroke="#2A2A2A" stroke-width="1" stroke-linecap="butt"/><text x="20" y="824" font-family="'Space Mono', 'JetBrains Mono', ui-monospace, monospace" font-size="10" fill="#C050FF" letter-spacing="1"><tspan x="20" dy="0">ПОРЯДОК ПРОХОЖДЕНИЯ</tspan></text><text x="20" y="850" font-family="Oswald, Impact, 'Arial Narrow', sans-serif" font-size="20" fill="#C050FF" font-weight="500"><tspan x="20" dy="0">1</tspan></text><text x="44" y="848" font-family="'IBM Plex Sans', 'Segoe UI', system-ui, sans-serif" font-size="13" fill="#E8E2D3"><tspan x="44" dy="0">Прочитать курс целиком, ничего не создавая.</tspan></text><text x="20" y="876" font-family="Oswald, Impact, 'Arial Narrow', sans-serif" font-size="20" fill="#C050FF" font-weight="500"><tspan x="20" dy="0">2</tspan></text><text x="44" y="874" font-family="'IBM Plex Sans', 'Segoe UI', system-ui, sans-serif" font-size="13" fill="#E8E2D3"><tspan x="44" dy="0">Вернуться к модулю 03: две-три недели дневника,</tspan><tspan x="44" dy="18">гнозиса и банишинга.</tspan></text><text x="20" y="920" font-family="Oswald, Impact, 'Arial Narrow', sans-serif" font-size="20" fill="#C050FF" font-weight="500"><tspan x="20" dy="0">3</tspan></text><text x="44" y="918" font-family="'IBM Plex Sans', 'Segoe UI', system-ui, sans-serif" font-size="13" fill="#E8E2D3"><tspan x="44" dy="0">Пройти модуль 04 по шагам: на первого сервитора</tspan><tspan x="44" dy="18">нормально уйти от одной до трёх недель.</tspan></text><text x="20" y="964" font-family="Oswald, Impact, 'Arial Narrow', sans-serif" font-size="20" fill="#C050FF" font-weight="500"><tspan x="20" dy="0">4</tspan></text><text x="44" y="962" font-family="'IBM Plex Sans', 'Segoe UI', system-ui, sans-serif" font-size="13" fill="#E8E2D3"><tspan x="44" dy="0">К модулям 05–10 возвращаться, когда практика</tspan><tspan x="44" dy="18">начнёт задавать вопросы.</tspan></text></svg>