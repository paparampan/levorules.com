й силуэт, точка для взгляда в центре, легко</tspan><tspan x="20" dy="16">перерисовать по памяти.</tspan></text><text x="20" y="660" font-family="'IBM Plex Sans', 'Segoe UI', system-ui, sans-serif" font-size="11.5" fill="#8C8879"><tspan x="20" dy="0">Шаги 1–2 — поздняя стандартизация метода, а не дословная</tspan><tspan x="20" dy="15">инструкция Спейра.</tspan></text></svg>