<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>Лево руля — подключение TikTok</title>
  <link rel="stylesheet" href="/tiktok/styles.css">
</head>
<body>
  <main class="document-page">
    <section class="document-card">
      <p class="eyebrow">Лево руля · аналитика TikTok</p>
      <h1 id="title">Вход через TikTok подтверждён</h1>
      <p id="message">Нажми кнопку ниже, чтобы безопасно завершить подключение в локальном коннекторе на этом компьютере.</p>
      <p><a class="document-link" id="complete" href="#">Завершить подключение</a></p>
      <p class="note" id="note">Сайт не сохраняет код и не получает токены доступа.</p>
    </section>
  </main>
  <script>
    (() => {
      const params = new URLSearchParams(location.search);
      const title = document.getElementById('title');
      const message = document.getElementById('message');
      const note = document.getElementById('note');
      const code = params.get('code');
      const state = params.get('state');
      const error = params.get('error') || params.get('error_description');
      if (error || !code || !state) {
        title.textContent = 'Подключение не завершено';
        message.textContent = error || 'TikTok не вернул код авторизации.';
        note.textContent = 'Вернись в локальный коннектор и запусти авторизацию ещё раз.';
        return;
      }
      document.getElementById('complete').href = `http://127.0.0.1:4019/oauth/complete?code=${encodeURIComponent(code)}&state=${encodeURIComponent(state)}`;
    })();
  </script>
</body>
</html>
