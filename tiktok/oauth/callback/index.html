<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>Лево руля — подключение TikTok</title>
  <style>
    :root { color-scheme: dark; }
    body { margin: 0; background: #0a0a0a; color: #eee8dc; font: 18px/1.55 system-ui, sans-serif; }
    main { min-height: 100vh; display: grid; place-items: center; padding: 24px; box-sizing: border-box; }
    section { width: min(680px, 100%); border: 1px solid #443c36; background: #151311; padding: 34px; box-sizing: border-box; }
    p:first-child { color: #e43535; font: 12px ui-monospace, monospace; letter-spacing: .12em; text-transform: uppercase; }
    h1 { margin: 12px 0; font-size: clamp(30px, 6vw, 52px); line-height: 1; text-transform: uppercase; }
    a { display: inline-block; margin-top: 12px; padding: 13px 18px; color: #fff; border: 1px solid #e43535; text-decoration: none; font-weight: 700; }
    .note { color: #aaa29a; font-size: 14px; }
  </style>
</head>
<body>
  <main>
    <section>
      <p>Лево руля · read-only TikTok</p>
      <h1 id="title">Вход подтверждён</h1>
      <p id="message">Завершите подключение в локальном коннекторе на этом компьютере.</p>
      <p><a id="complete" href="#">Завершить подключение</a></p>
      <p class="note" id="note">Сайт не сохраняет код и не получает токены доступа.</p>
    </section>
  </main>
  <script>
    (() => {
      const params = new URLSearchParams(location.search);
      const code = params.get('code');
      const state = params.get('state');
      const error = params.get('error') || params.get('error_description');
      if (error || !code || !state) {
        document.getElementById('title').textContent = 'Подключение не завершено';
        document.getElementById('message').textContent = error || 'TikTok не вернул код авторизации.';
        document.getElementById('complete').hidden = true;
        document.getElementById('note').textContent = 'Запустите авторизацию ещё раз.';
        return;
      }
      document.getElementById('complete').href = `http://127.0.0.1:4019/oauth/complete?code=${encodeURIComponent(code)}&state=${encodeURIComponent(state)}`;
    })();
  </script>
</body>
</html>
